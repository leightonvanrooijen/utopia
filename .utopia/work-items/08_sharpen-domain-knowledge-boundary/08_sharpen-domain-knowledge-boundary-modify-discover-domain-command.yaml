last_validator_feedback: |
    Gating connector validators:after-workitem blocked workitem-verified:
    Validator spec-intent failed:
    Diff supplied contained only work-item metadata; substantive change is executor commit `4049ae9`, reviewed that.

    Criteria check: all three satisfied. Boundary criteria reach prompt via `domain.DomainKnowledgeBoundary{}.FormatForAgent()` (`internal/discover/domain.go:149`); prompt orders invariant candidates out of every draft's terms/entities (`domain.go:29-33`); excluded candidates parsed, logged with `likely_spec`, surfaced in CLI. Prompt-level enforcement is the right home - discovery has no non-agent candidate list to filter. No ADR contradiction, no scope invention.

    Standards violations:

    internal/discover/domain.go:175 - [B] `out.Progressf` for each excluded candidate fires between `prog.StartPhase(3, ...)` and `prog.EndPhase(...)`, so it lands mid-line on the unterminated `[3/4] Parsing draft domain documents...` prefix and the ` done (0.1s, N drafts parsed)` tail then attaches to the last excluded line. Breaks the `[n/N] ... done (X.Xs)` phase-progress format terminal-output codifies (`ui.Progress` row of the glyph table); sibling detail lines in the same function open with `\n` for exactly this reason (`prog.Verbosef("\n  Saving %s.yaml", ...)`, domain.go:186). Emit through `prog.Verbosef` with a leading newline, or move the loop after `prog.EndPhase`.

    internal/cli/discover.go:310 - [B] Routing line uses a `-` bullet. terminal-output anti-pattern table: "Mixed bullets (`•` vs `-`) across commands | `ui.Bullet` everywhere". Use `ui.Bullet`.

    <VERDICT>
