id: 08_sharpen-domain-knowledge-boundary-domain-knowledge-boundary
spec_ref: 08_sharpen-domain-knowledge-boundary.domain-knowledge-boundary
title: |
    Explicit boundary criteria distinguishing spec domain_knowledge from
    Domain documentation. Both capture domain understanding, but they own
    different content:

    - Spec domain_knowledge owns implementation invariants: constraints,
      assumptions, and design rules an implementer of that spec must
      respect, but which are not testable acceptance criteria
      (e.g. "Output truncation preserves tail").
    - Domain docs own ubiquitous language: terms, canonical definitions,
      aliases, code usage, and entity relationships within a bounded
      context (e.g. "WorkItem means X, also called Y").

    These criteria are referenced by discovery agents (adoption) and
    signal detection (harvest) to route content to the correct home.
status: completed
prompt: |-
    ## TASK

    Explicit boundary criteria distinguishing spec domain_knowledge from
    Domain documentation. Both capture domain understanding, but they own
    different content:

    - Spec domain_knowledge owns implementation invariants: constraints,
      assumptions, and design rules an implementer of that spec must
      respect, but which are not testable acceptance criteria
      (e.g. "Output truncation preserves tail").
    - Domain docs own ubiquitous language: terms, canonical definitions,
      aliases, code usage, and entity relationships within a bounded
      context (e.g. "WorkItem means X, also called Y").

    These criteria are referenced by discovery agents (adoption) and
    signal detection (harvest) to route content to the correct home.


    Acceptance criteria:
    - Boundary rule: content that is a noun/term used when talking about the system belongs in Domain docs
    - Boundary rule: content that defines relationships between entities belongs in Domain docs
    - Boundary rule: content that is a constraint or assumption an implementer of one spec must respect belongs in that spec's domain_knowledge
    - Litmus test: 'Would this still be true and useful if the spec were deleted?' YES = Domain doc, NO = spec domain_knowledge
    - Litmus test: 'Is this only meaningful in the context of one spec's features?' YES = spec domain_knowledge
    - Boundary criteria are documented alongside the domain qualification/disqualification criteria
    - Boundary criteria are referenced by domain discovery agent prompts and harvest signal detection



    ## HINTS

    - Existing spec domain_knowledge content (execution-ralph, verification) already fits the invariant definition - use it as calibration examples
    - Follow the qualification/disqualification criteria pattern already established in knowledge-artifacts



    ## STANDARDS

    This project defines coding standards in .utopia/standards/. Before implementing, read the standards docs relevant to the files this task touches:

    - id: cli-organization
      description: How to structure cobra commands in internal/cli: thin handlers that own the CLI frame and delegate the algorithm to domain packages.
      tags: go, cli, cobra, architecture
      path: .utopia/standards/cli-organization.md
    - id: error-handling
      description: How errors are created, wrapped, matched, and surfaced: typed domain errors for branching, %w wrapping for infrastructure, one exit point in root.go.
      tags: go, errors, cli
      path: .utopia/standards/error-handling.md
    - id: terminal-output
      description: One shared output vocabulary (glyphs, banners, progress) routed through cobra's injectable writers so command output is consistent and testable.
      tags: go, cli, ux, output
      path: .utopia/standards/terminal-output.md


    ## CONSTRAINTS

    - Prefer existing abstractions over creating new ones unless clearly required
    - Do not refactor unrelated code
    - Architecture is already correct
    - Do not modify .utopia/specs/ files - specs are updated automatically when the CR merges
    - You are running autonomously and non-interactively; never ask for, or wait on, human input
    - When a genuine design choice arises, choose the best-justified option and implement it rather than deferring the decision to a human
    - Record any non-obvious decision - rationale and the alternatives considered - in the commit or PR body, so PR review is the human checkpoint


    ---

