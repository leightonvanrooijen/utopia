prompt: |-
    ## TASK

    Add a configurable per-iteration turn ceiling for work-item execution,
    expressed as work_items.turn_budget in .utopia/config.yaml.

    The budget is a single shared knob with two enforcement postures. The
    executor treats it as a hard cap (passed to the Claude CLI as
    --max-turns). The chunker later treats the same value as a sizing
    target (phase 2). One number therefore governs both how large work
    items are cut and how much a single iteration may spend, so tuning
    cost means changing one value rather than keeping two in sync.

    It lives in config rather than as a CLI flag because `chunk` and
    `execute` are separate commands; a flag on `execute` would be
    invisible to the chunker. It is named after work items rather than
    after either command because it belongs to neither.


    Acceptance criteria:
    - Config has an optional work_items section with a turn_budget integer field
    - work_items.turn_budget defaults to 40 when the section or field is omitted
    - A turn_budget of zero or a negative value is rejected at config load with an error naming the field
    - Config files with no work_items section continue to load without error



    ## HINTS

    - Config struct is domain.Config in internal/domain/discovery.go
    - Follow the pointer-to-struct-with-omitempty pattern used by PathsConfig and ModelConfig
    - Do not add turn_budget under the verification section - max_iterations is already misfiled there, see .utopia/notes/max-iterations-misfiled-under-verification.md



