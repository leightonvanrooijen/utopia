id: 10_work-item-turn-budget-and-sizing-phase-1-work-item-sizing
spec_ref: 10_work-item-turn-budget-and-sizing-phase-1.work-item-sizing
title: |
    Before generating WorkItems, the chunker runs a single read-only
    agent over the whole document. The agent explores the codebase once
    and returns, for every feature, an assessment of whether it fits
    work_items.turn_budget and a split when it does not.

    One pass rather than one call per feature: exploration is amortised
    across all features, and the agent gains cross-feature context, so
    it can see that two features touch the same files and size both
    accordingly. Independent per-feature calls would re-explore the same
    repository and each be blind to the others.

    Splitting prefers partitioning the feature's existing acceptance
    criteria into bundles, which keeps every criterion traceable to the
    reviewed change request. Only when a single criterion is itself too
    large to partition may the sizer author sub-steps, and that
    escalation is recorded on the WorkItem so it is visible rather than
    silent.

    The sizer is read-only. It must reason about the change, never make
    it.
