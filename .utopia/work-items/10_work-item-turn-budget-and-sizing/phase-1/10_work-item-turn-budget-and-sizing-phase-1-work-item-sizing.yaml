prompt: |-
    ## TASK

    Before generating WorkItems, the chunker runs a single read-only
    agent over the whole document. The agent explores the codebase once
    and returns, for every feature, an assessment of whether it fits
    work_items.turn_budget and a split when it does not.

    One pass rather than one call per feature: exploration is amortised
    across all features, and the agent gains cross-feature context, so
    it can see that two features touch the same files and size both
    accordingly. Independent per-feature calls would re-explore the same
    repository and each be blind to the others.

    Splitting prefers partitioning the feature's existing acceptance
    criteria into bundles, which keeps every criterion traceable to the
    reviewed change request. Only when a single criterion is itself too
    large to partition may the sizer author sub-steps, and that
    escalation is recorded on the WorkItem so it is visible rather than
    silent.

    The sizer is read-only. It must reason about the change, never make
    it.


    Acceptance criteria:
    - The chunker invokes exactly one sizer agent per chunk operation, receiving all features in the document
    - The sizer is invoked with a read-only tool allowlist and cannot edit, write, or run mutating commands
    - The sizer receives work_items.turn_budget and assesses each feature against it
    - Features assessed as fitting the budget produce exactly one WorkItem, unchanged from current behaviour
    - Features assessed as exceeding the budget produce multiple WorkItems
    - A split that partitions existing criteria assigns every criterion of the feature to exactly one WorkItem, with none dropped or duplicated
    - Partitioned WorkItems record CriteriaOrigin as partitioned
    - The sizer only authors new criteria for a feature whose single criterion cannot be partitioned further
    - WorkItems with sizer-authored criteria record CriteriaOrigin as authored
    - Every produced WorkItem records SourceFeatureID naming the feature it came from
    - Chunk output reports each feature's sizing verdict and the number of WorkItems produced for it
    - A sizer invocation that fails or returns unparseable output falls back to one WorkItem per feature and reports the fallback
    - The sizer never merges two features into one WorkItem



    ## HINTS

    - Chunk() and ChunkPhase() are in internal/chunk/chunk.go; sizing runs after validateFeatures() and before WorkItem generation
    - Use WithAllowedTools (internal/claude.go:62) scoped to Read, Grep, Glob
    - internal/discover and internal/analysis are the existing precedents for agentic calls that return structured output
    - Keep prompt building (BuildPromptWithConstraints) unchanged - it operates per WorkItem and should not know a split happened
    - The fallback path matters - chunking must never become unusable because a sizer call failed



    ## STANDARDS

    This project defines coding standards in .utopia/standards/. Before implementing, read the standards docs relevant to the files this task touches:

    - id: cli-organization
      description: How to structure cobra commands in internal/cli: thin handlers that own the CLI frame and delegate the algorithm to domain packages.
      tags: go, cli, cobra, architecture
      path: .utopia/standards/cli-organization.md
    - id: error-handling
      description: How errors are created, wrapped, matched, and surfaced: typed domain errors for branching, %w wrapping for infrastructure, one exit point in root.go.
      tags: go, errors, cli
      path: .utopia/standards/error-handling.md
    - id: terminal-output
      description: One shared output vocabulary (glyphs, banners, progress) routed through cobra's injectable writers so command output is consistent and testable.
      tags: go, cli, ux, output
      path: .utopia/standards/terminal-output.md


