id: 12_tiered-model-routing-validation-escalation-phase-3-escalation-telemetry
spec_ref: 12_tiered-model-routing-validation-escalation-phase-3.escalation-telemetry
title: |
    Every change request outcome writes a record of how it was
    routed, so the caps and the premise behind them can be argued
    with evidence instead of intuition.

    The specific hypothesis under test is that repeated
    comprehension failure indicates a defective change request
    rather than an executor limit. That is plausible and unmeasured.
    If rewritten change requests do not improve first-pass rates,
    the rule should invert - escalate execution before rewriting the
    specification - and this record is what makes that decision
    possible.

    Token counts and monetary cost are deliberately absent. Utopia
    drives the claude CLI, which reports neither, so cost is
    approximated from attempt counts and the model each attempt used
    rather than measured. An approximation that is honest about
    being one is more useful than a fabricated dollar figure.
status: in_progress
prompt: |-
    ## TASK

    Every change request outcome writes a record of how it was
    routed, so the caps and the premise behind them can be argued
    with evidence instead of intuition.

    The specific hypothesis under test is that repeated
    comprehension failure indicates a defective change request
    rather than an executor limit. That is plausible and unmeasured.
    If rewritten change requests do not improve first-pass rates,
    the rule should invert - escalate execution before rewriting the
    specification - and this record is what makes that decision
    possible.

    Token counts and monetary cost are deliberately absent. Utopia
    drives the claude CLI, which reports neither, so cost is
    approximated from attempt counts and the model each attempt used
    rather than measured. An approximation that is honest about
    being one is more useful than a fabricated dollar figure.


    Acceptance criteria:
    - One record is written per change request outcome, including outcomes that halted as needs_human
    - The record carries cr_id, spec_ref, cr_type, the executor model and effort used for each attempt, sonnet_attempts, mechanical_failures, comprehension_failures, opus_execution_attempts, scoping_escalations, spec_rewritten, outcome, and wall-clock duration
    - The recorded effort for the default executor is identical across every attempt on a change request, which is the persisted evidence that no path raised it
    - outcome is one of passed, needs_human or abandoned
    - The record is written when a change request aborts, not only when it completes
    - Escalation rate can be derived per spec and per cr_type from the persisted records without re-reading run transcripts
    - The ratio of mechanical to comprehension failures can be derived per spec from the persisted records
    - The record notes that token counts and monetary cost are not captured, so a reader does not mistake their absence for zero
    - Failure to write the record logs a warning and does not block the execution loop



    ## HINTS

    - run-transcript-persistence in execution-ralph already writes .utopia/runs/<cr-id>/<workitem-id>.yaml per work item and already specifies the warn-but-do-not-block behaviour - extend that record rather than adding a parallel file
    - Because run records are committed to git, git history is the time series - escalation rate over time is a query over the repository with no telemetry backend involved, which is the same reasoning 07_observability-execution-spans applies to spans
    - Wall-clock is already measured - stepTimings in internal/ralph/timing.go holds the Claude, verification and validator buckets, and step-timing-logs specifies the summary line. Note that 07_observability-execution-spans replaces stepTimings with the OpenTelemetry model, so coordinate rather than building on a type that change request deletes
    - 06_observability-unified-output frames itself as covering what Utopia "did and what it cost" - align the vocabulary with it rather than inventing a second cost dialect
    - Escalation clustering by spec is the highest-value aggregation and the reason spec_ref is on the record - a spec whose change requests escalate repeatedly has a boundary problem, not a model problem, and that is a finding about the codebase rather than about routing
    - Reuse the yaml-formatting package so the record matches other Utopia YAML
    - Capture an ADR recording that Utopia sits above the Anthropic API and therefore cannot observe tokens, cache hits or cost - the design this change request came from assumed the API layer, and the next reader will make the same assumption unless it is written down
    - Capture the inverted-rule hypothesis as an ADR too, with the specific evidence that would overturn it - rewritten change requests failing to improve first-pass rates - so the open question is recorded rather than remembered



    ## STANDARDS

    This project defines coding standards in .utopia/standards/. Before implementing, read the standards docs relevant to the files this task touches:

    - id: cli-organization
      description: How to structure cobra commands in internal/cli: thin handlers that own the CLI frame and delegate the algorithm to domain packages.
      tags: go, cli, cobra, architecture
      path: .utopia/standards/cli-organization.md
    - id: error-handling
      description: How errors are created, wrapped, matched, and surfaced: typed domain errors for branching, %w wrapping for infrastructure, one exit point in root.go.
      tags: go, errors, cli
      path: .utopia/standards/error-handling.md
    - id: terminal-output
      description: One shared output vocabulary (glyphs, banners, progress) routed through cobra's injectable writers so command output is consistent and testable.
      tags: go, cli, ux, output
      path: .utopia/standards/terminal-output.md


    ## CONSTRAINTS

    - Prefer existing abstractions over creating new ones unless clearly required
    - Do not refactor unrelated code
    - Architecture is already correct
    - Do not modify .utopia/specs/ files - specs are updated automatically when the CR merges


