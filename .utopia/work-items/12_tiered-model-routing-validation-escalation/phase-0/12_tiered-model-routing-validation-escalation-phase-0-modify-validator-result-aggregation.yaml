prompt: |-
    ## TASK

    Modify the validator-result-aggregation feature: Aggregate results from parallel validators and determine overall
    pass/fail.

    Aggregation is boolean AND over pass flags plus string
    concatenation of feedback. Once validators classify their failures,
    flattening them into one string discards exactly the field the
    routing logic needs, so the aggregate has to carry the
    classification rather than only the prose.

    Validators disagree, and the disagreement resolves toward
    escalation: one validator reporting a misread specification is not
    cancelled out by three reporting lint errors.


    Acceptance criteria:
    - The aggregate carries the strongest failure_class across failing validators, where comprehension is stronger than mechanical
    - The aggregate is spec_defect_suspected when any failing validator reports spec_defect_suspected
    - Each failing validator's diagnosis and corrected_intent are retained on the aggregate rather than flattened into the feedback string



