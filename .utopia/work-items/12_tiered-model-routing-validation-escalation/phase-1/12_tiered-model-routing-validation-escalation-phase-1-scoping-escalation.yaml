prompt: |-
    ## TASK

    Repeated comprehension failure is treated as evidence about the
    change request rather than only about the executor. Scoping
    escalation rewrites the change request instead of the code.

    The rewritten change request is the highest-value output of a
    failed iteration, so it is persisted as a first-class artefact
    and fed to harvesting. A run that produces a sharper
    specification has produced something durable even if it produced
    no working code.


    Acceptance criteria:
    - Scoping escalation sends the change request, the validator diagnoses and the relevant spec and ADR excerpts to the scoper model
    - The scoper is instructed to rewrite the change request, not to write code
    - The rewritten change request is persisted as a change request artefact rather than held in memory
    - The rewritten change request records which change request it supersedes and which diagnoses motivated the rewrite
    - The rewritten change request is discoverable by harvesting
    - Execution resumes against the rewritten change request with comprehension_count reset to 0
    - opus_execution_attempts is not reset by a scoping escalation
    - A scoping escalation that produces no parseable change request counts against the scoping_escalations cap and does not resume execution



    ## HINTS

    - cr-validate-command in unified-change-request-system already validates a change request file - run the rewritten change request through it before resuming, so a malformed rewrite fails fast instead of at merge
    - The scoper writes into .utopia/change-requests/ and must not write to .utopia/specs/ - specs are only updated by merge, and a scoper that edits them directly breaks the merge invariant
    - harvest-command and signal-detection in harvest are where discoverability lands - a rewritten change request is a strong signal that domain language or an ADR is missing, which is the whole reason to persist it
    - Not resetting opus_execution_attempts across a scoping escalation is deliberate - it is the bound that stops rewrite-then-retry from becoming an unbounded loop through a different door
    - Record the supersedes relationship in the change request itself rather than in a side index, so the provenance survives a git clone with no database



    ## STANDARDS

    This project defines coding standards in .utopia/standards/. Before implementing, read the standards docs relevant to the files this task touches:

    - id: cli-organization
      description: How to structure cobra commands in internal/cli: thin handlers that own the CLI frame and delegate the algorithm to domain packages.
      tags: go, cli, cobra, architecture
      path: .utopia/standards/cli-organization.md
    - id: error-handling
      description: How errors are created, wrapped, matched, and surfaced: typed domain errors for branching, %w wrapping for infrastructure, one exit point in root.go.
      tags: go, errors, cli
      path: .utopia/standards/error-handling.md
    - id: terminal-output
      description: One shared output vocabulary (glyphs, banners, progress) routed through cobra's injectable writers so command output is consistent and testable.
      tags: go, cli, ux, output
      path: .utopia/standards/terminal-output.md


    ## CONSTRAINTS

    - Prefer existing abstractions over creating new ones unless clearly required
    - Do not refactor unrelated code
    - Architecture is already correct
    - Do not modify .utopia/specs/ files - specs are updated automatically when the CR merges


