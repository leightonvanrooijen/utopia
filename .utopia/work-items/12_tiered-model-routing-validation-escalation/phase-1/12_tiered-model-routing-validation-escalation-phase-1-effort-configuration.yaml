id: 12_tiered-model-routing-validation-escalation-phase-1-effort-configuration
spec_ref: 12_tiered-model-routing-validation-escalation-phase-1.effort-configuration
title: |
    Each role resolves an effort level alongside its model, so
    reasoning depth is configured rather than left to the CLI
    default.

    Effort and model are separate levers with different economics.
    Raising the default executor's effort is the intuitive response
    to a failure and the wrong one: at the top of its effort range a
    cheaper model can cost more than the expensive model would have,
    for comparable quality. Escalating the model is therefore
    strictly cheaper than cranking effort, which makes the default
    executor's effort a fixed property of its role rather than a dial
    the loop turns when something fails.

    The consequence is a rule worth stating as a rule: no code path
    raises effort in response to a validation failure. Failures
    change which model runs, never how hard the cheap one tries.
status: in_progress
prompt: |-
    ## TASK

    Each role resolves an effort level alongside its model, so
    reasoning depth is configured rather than left to the CLI
    default.

    Effort and model are separate levers with different economics.
    Raising the default executor's effort is the intuitive response
    to a failure and the wrong one: at the top of its effort range a
    cheaper model can cost more than the expensive model would have,
    for comparable quality. Escalating the model is therefore
    strictly cheaper than cranking effort, which makes the default
    executor's effort a fixed property of its role rather than a dial
    the loop turns when something fails.

    The consequence is a rule worth stating as a rule: no code path
    raises effort in response to a validation failure. Failures
    change which model runs, never how hard the cheap one tries.


    Acceptance criteria:
    - Config supports an optional effort section with per-role keys mirroring the models section
    - Effort accepts low, medium, high, xhigh or max, and any other value produces a clear error at load time
    - The default executor, escalated executor, validators and scoper each resolve their own effort level
    - Default effort is medium for the default executor, high for the escalated executor, medium for validators and high for the scoper
    - If a role's effort is missing, effort.default is used, and if that is missing the claude CLI default applies
    - No code path raises a role's effort in response to a validation failure, a retry, or an escalation
    - The default executor's effort is identical on a first attempt and on a mechanical retry
    - A --effort flag overrides the resolved effort for a single invocation, mirroring --model



    ## HINTS

    - The CLI flag is `--effort <level>` accepting low, medium, high, xhigh, max - confirm against `claude --help` on the installed version rather than trusting this text, since it is a per-session flag rather than a config setting
    - The immutability rule is the one criterion here that is genuinely a test rather than a config check - assert that the effort passed on a mechanical retry equals the effort passed on the first attempt, because that is where a well-meaning future change would try harder instead of escalating
    - Mirror the models section shape exactly rather than inventing a second config idiom - a reader who understands models.execute should not have to learn a new pattern to understand effort.execute
    - xhigh is the setting Claude Code itself defaults to for coding and agentic work, so it is the obvious candidate if the escalated executor at high proves too shallow - change the default rather than adding a code path that escalates effort
    - This composes with 10_work-item-turn-budget-and-sizing, which adds work_items.turn_budget as --max-turns. Effort and turn budget are both cost knobs on the same invocation - effort bounds reasoning depth per turn, turn budget bounds the number of turns - so state the relationship in the config documentation or the two will be confused for each other
    - Capture an ADR on why escalation is the response to failure rather than raised effort, including the cost reasoning - it is counterintuitive enough that someone will otherwise "fix" it by adding an effort bump



