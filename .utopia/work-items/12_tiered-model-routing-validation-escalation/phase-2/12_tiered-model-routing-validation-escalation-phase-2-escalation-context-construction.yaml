    reasoning: the validator's diagnosis, the corrected intent, the
    final diff and the verbatim tooling output. What the model
    thought on the way there is discarded.
status: in_progress
prompt: |-
    ## TASK

    An escalated attempt is built a fresh context rather than handed
    the transcript of the attempts that failed.

    Replaying failed attempts anchors the escalated model toward the
    mental model that just failed, which is the specific thing
    escalation is meant to escape. It also pays the higher tier's
    rate to read the cheaper tier's dead ends.

    What survives from a failed attempt is its conclusion, not its
    reasoning: the validator's diagnosis, the corrected intent, the
    final diff and the verbatim tooling output. What the model
    thought on the way there is discarded.


    Acceptance criteria:
    - An escalated context contains the change request, the relevant spec and ADR excerpts, each prior failure's diagnosis and corrected_intent, the final diff from the last attempt, and verbatim verification and validator output
    - An escalated context contains no prior-attempt model reasoning, no prior partial diffs other than the final diff, and no prior tool-call logs
    - The absence of prior-attempt transcript in a constructed escalated prompt is asserted by a test against the constructed prompt, not only by inspection
    - Scoping escalation contexts are constructed by the same rules as escalated execution contexts
    - A non-escalated retry keeps using the existing failure-injection prompt unchanged



    ## HINTS

    - failure-injection in execution-ralph already specifies "Only failures from immediately previous iteration (not accumulated)", so the loop already discards history on the normal path - this feature extends that discipline to escalation rather than inventing it
    - The prompt assembly to branch is internal/ralph/ralph.go:438-444, where PROJECT STANDARDS FEEDBACK and PREVIOUS FAILURES are injected as separate sections
    - Assert on the constructed prompt string, not on model behaviour - the criterion is about what was sent, which is cheap and deterministic to test, and this is the only acceptance criterion in the design that a unit test can fully pin down
    - Keep the diff and the verbatim tooling output - they are evidence rather than reasoning, and dropping them makes the escalated attempt guess at what actually broke
    - Utopia shells out to the claude CLI with a single --print prompt at internal/claude.go:129-134, so there is no conversation to prune - the fresh context is simply a different prompt string, which makes this phase considerably cheaper than it would be against a message-history API



    ## STANDARDS

    This project defines coding standards in .utopia/standards/. Before implementing, read the standards docs relevant to the files this task touches:

    - id: cli-organization
      description: How to structure cobra commands in internal/cli: thin handlers that own the CLI frame and delegate the algorithm to domain packages.
      tags: go, cli, cobra, architecture
      path: .utopia/standards/cli-organization.md
    - id: error-handling
      description: How errors are created, wrapped, matched, and surfaced: typed domain errors for branching, %w wrapping for infrastructure, one exit point in root.go.
      tags: go, errors, cli
      path: .utopia/standards/error-handling.md
    - id: terminal-output
      description: One shared output vocabulary (glyphs, banners, progress) routed through cobra's injectable writers so command output is consistent and testable.
      tags: go, cli, ux, output
      path: .utopia/standards/terminal-output.md


