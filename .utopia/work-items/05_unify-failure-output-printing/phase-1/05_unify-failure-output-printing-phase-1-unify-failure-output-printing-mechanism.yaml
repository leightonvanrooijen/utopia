prompt: |-
    ## TASK

    Collapse the three separate ways failure output reaches the terminal onto a
    single mechanism, without changing what a user sees.

    There are currently three paths:
    1. Verification - explicit print added in phase 1, in the ralph loop body.
    2. After-phase validators - explicit print at internal/ralph/ralph.go:570-575.
    3. After-workitem validators - no explicit print. Output reaches the terminal
       only as a side effect of the engine's resolution ledger: validators.go
       sets ConnectorResult.Stdout to the aggregated feedback, engine.go join()
       calls logResolution on every joined handle, and logResolution dumps the
       captured output indented under the status line.

    Path 3 previously had a dedicated print (commit 0063841) which was dropped
    during the subscription/engine refactor. It still satisfies the
    agentic-validators failure-stdout-logging criteria today, but only by
    accident, and nothing tests it. Any future change to logResolution, to how
    handles carry output, or to whether validators route through the engine will
    silently break a specced behaviour again.

    Introduce one shared helper responsible for rendering a failure-output block
    and route all three call sites through it. Ensure exactly one block is emitted
    per failure - if a path both routes through the engine and calls the helper,
    suppress the ledger dump for that handle so output is not printed twice.

    Behaviour must be preserved: the same content, in the same order relative to
    prompt injection, for all three paths.


    Acceptance criteria:
    - A single shared helper renders failure-output blocks and is used by verification, after-phase validators, and after-workitem validators
    - Each failing path prints exactly one failure-output block per failure, with no duplicate emission from the engine resolution ledger
    - All three paths use the same delimiter formatting
    - For every path, the printed content remains byte-identical to the content injected into the AI retry prompt
    - For every path, printing still happens before prompt injection
    - Validator output still includes the validator ID, satisfying the agentic-validators failure-stdout-logging criteria
    - A regression test asserts the after-workitem validator path prints failure feedback, so it cannot be silently dropped again
    - A regression test asserts the after-phase validator path prints failure feedback
    - A regression test asserts the verification path prints failure output
    - No change to which commands run, to exit codes, or to any content fed to the AI



    ## HINTS

    - The three call sites are internal/ralph/ralph.go around lines 332-343 (verification, added in phase 1), lines 570-575 (after-phase validators), and lines 355-359 (after-workitem validators, currently status line only)
    - The implicit path runs through internal/ralph/validators.go:132-135 setting res.Stdout, internal/ralph/engine.go:69-74 calling logResolution on join, and internal/ralph/engine.go:180-191 doing the indented dump
    - Validator feedback text is built by AggregateResults in internal/validators/runner.go:364-381 using the format "Validator %s failed:\n%s\n\n" - the ID comes from there, so the shared helper should not prepend it again
    - Consider whether verification should become a subscription action so it routes through the engine like validators do; if so the helper may live behind logResolution rather than at the call sites
    - Capture the resulting decision as an ADR if the unification changes how failure output is expected to flow



    ## STANDARDS

    This project defines coding standards in .utopia/standards/. Before implementing, read the standards docs relevant to the files this task touches:

    - id: cli-organization
      description: How to structure cobra commands in internal/cli: thin handlers that own the CLI frame and delegate the algorithm to domain packages.
      tags: go, cli, cobra, architecture
      path: .utopia/standards/cli-organization.md
    - id: error-handling
      description: How errors are created, wrapped, matched, and surfaced: typed domain errors for branching, %w wrapping for infrastructure, one exit point in root.go.
      tags: go, errors, cli
      path: .utopia/standards/error-handling.md
    - id: terminal-output
      description: One shared output vocabulary (glyphs, banners, progress) routed through cobra's injectable writers so command output is consistent and testable.
      tags: go, cli, ux, output
      path: .utopia/standards/terminal-output.md


    ## CONSTRAINTS

    - This is a refactor. Existing behavior MUST be preserved.
    - All existing tests must pass without modification
    - Do not introduce new abstractions, interfaces, or packages
    - Prefer existing abstractions over creating new ones unless clearly required
    - Do not refactor unrelated code
    - Architecture is already correct
    - Do not modify .utopia/specs/ files - specs are updated automatically when the CR merges


