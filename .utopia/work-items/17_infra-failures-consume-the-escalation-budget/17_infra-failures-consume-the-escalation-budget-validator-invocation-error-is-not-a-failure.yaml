title: |
    A validator that could not run has not disapproved of anything. Its
    inability to run must be reported as an infrastructure fault and retried,
    rather than folded into the aggregate as a comprehension failure and
    routed as a verdict about the code.

    Current behavior: AggregateResults (validators/runner.go:392-396) folds
    vr.Err into the aggregate as unclassifiedFailure, which resolves to
    comprehension - the most expensive class.

    Expected behavior: this does not soften the existing
    resolve-toward-comprehension rule for unusable output. A validator that
    ran and emitted an unparseable verdict still fails comprehension: it read
    the diff and said something, and the caller cannot safely assume the
    cheaper class. The distinction is whether the invocation happened at all.
status: completed
prompt: |-
    ## TASK

    A validator that could not run has not disapproved of anything. Its
    inability to run must be reported as an infrastructure fault and retried,
    rather than folded into the aggregate as a comprehension failure and
    routed as a verdict about the code.

    Current behavior: AggregateResults (validators/runner.go:392-396) folds
    vr.Err into the aggregate as unclassifiedFailure, which resolves to
    comprehension - the most expensive class.

    Expected behavior: this does not soften the existing
    resolve-toward-comprehension rule for unusable output. A validator that
    ran and emitted an unparseable verdict still fails comprehension: it read
    the diff and said something, and the caller cannot safely assume the
    cheaper class. The distinction is whether the invocation happened at all.


    Acceptance criteria:
    - A validator whose invocation failed is carried on the aggregate as errored, distinctly from a validator that returned a failing verdict
    - A failed validator invocation is retried up to an independently configurable cap, defaulting to 2 retries, before it is treated as unresolved
    - An aggregate whose only non-passing entries are invocation errors does not report a failure class, so the gate does not route it as a comprehension failure
    - A validator that errors alongside another validator that genuinely failed routes on the genuine failure's class, and the error is reported beside it
    - Output that was produced but is unparseable, or a verdict missing a required field, still resolves to comprehension exactly as it does today
    - The feedback text names an invocation error as an infrastructure fault rather than as validator disapproval, so the next iteration's prompt is not told the code was wrong


    ## REFERENCE

    The following spec feature defines the correct behavior:

    Aggregate results from parallel validators and determine overall
    pass/fail.

    Aggregation is boolean AND over pass flags plus string
    concatenation of feedback. Once validators classify their failures,
    flattening them into one string discards exactly the field the
    routing logic needs, so the aggregate has to carry the
    classification rather than only the prose.

    Validators disagree, and the disagreement resolves toward
    escalation: one validator reporting a misread specification is not
    cancelled out by three reporting lint errors.


    Acceptance criteria:
    - Collect all validator results after parallel execution completes
    - Overall pass requires ALL validators to pass (output <PASSED>)
    - If any validator fails, aggregate all failure feedback
    - Failed validators are listed with their IDs and feedback
    - Passing validators are not included in feedback (reduce noise)
    - The aggregate carries the strongest failure_class across failing validators, where comprehension is stronger than mechanical
    - The aggregate is spec_defect_suspected when any failing validator reports spec_defect_suspected
    - Each failing validator's diagnosis and corrected_intent are retained on the aggregate rather than flattened into the feedback string



    ## HINTS

    - internal/validators/runner.go:392-396 folds vr.Err into unclassifiedFailure - that is the conflation
    - unclassifiedFailure and addFailure (runner.go:409 onward) hold the resolve-toward-comprehension rule that must keep applying to unparseable output
    - internal/validators/runner.go:289 is where the invocation error is created, wrapping the cause as claude invocation failed
    - ValidatorResult already carries Err separately from Result; the aggregate is where the two collapse



    ## STANDARDS

    This project defines coding standards in .utopia/standards/. Before implementing, read the standards docs relevant to the files this task touches:

    - id: cli-organization
      description: How to structure cobra commands in internal/cli: thin handlers that own the CLI frame and delegate the algorithm to domain packages.
      tags: go, cli, cobra, architecture
      path: .utopia/standards/cli-organization.md
    - id: error-handling
      description: How errors are created, wrapped, matched, and surfaced: typed domain errors for branching, %w wrapping for infrastructure, one exit point in root.go.
      tags: go, errors, cli
      path: .utopia/standards/error-handling.md
    - id: terminal-output
      description: One shared output vocabulary (glyphs, banners, progress) routed through cobra's injectable writers so command output is consistent and testable.
      tags: go, cli, ux, output
      path: .utopia/standards/terminal-output.md


    ## CONSTRAINTS

    - This is a bugfix. The implementation must be corrected to match the spec.
    - The acceptance criteria below are the source of truth for correct behavior.
    - Fix only the behavior that deviates from the spec
    - Prefer existing abstractions over creating new ones unless clearly required
    - Do not refactor unrelated code
    - Architecture is already correct
    - Do not modify .utopia/specs/ files - specs are updated automatically when the CR merges
    - You are running autonomously and non-interactively; never ask for, or wait on, human input
    - When a genuine design choice arises, choose the best-justified option and implement it rather than deferring the decision to a human
    - Record any non-obvious decision - rationale and the alternatives considered - in the commit or PR body, so PR review is the human checkpoint


