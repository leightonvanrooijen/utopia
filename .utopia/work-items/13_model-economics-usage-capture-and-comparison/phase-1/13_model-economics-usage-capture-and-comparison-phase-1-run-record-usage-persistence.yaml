prompt: |-
    ## TASK

    Captured usage is written into the work item's existing run record, one
    entry per iteration, so the model that did the work sits next to what that
    attempt cost and whether it worked.

    Run records are committed to git, so history becomes the time series and
    no telemetry backend is involved.


    Acceptance criteria:
    - Each attempt's usage is appended to the work item's run record at .utopia/runs/<cr-id>/<workitem-id>.yaml as an ordered list with one entry per iteration
    - Each entry carries iteration index, resolved model, effort, outcome, and the attempt's failure class when the attempt failed
    - Per-work-item and per-change-request totals for tokens and cost are derivable from the entries without re-reading the transcript
    - Usage entries are written using the yaml-formatting package so the record stays consistent with other Utopia YAML
    - Usage is persisted in the same commit as its work item, matching workitem-commit behaviour
    - A run that aborts or halts as needs_human persists the usage of attempts already completed
    - Failure to persist usage logs a warning and does not block the execution loop
    - Existing run records without usage entries remain readable, and consumers treat a missing list as unknown rather than as zero spend



    ## HINTS

    - The record to extend is the one written per work item under .utopia/runs/<cr-id>/<workitem-id>.yaml, which already carries workitem_id, cr_id, spec_ref, iterations, completed_at, outcome, status and transcript - add to it rather than writing a parallel file
    - The failure class vocabulary already exists from failure-class-routing in the escalation-routing spec - reuse those values, do not invent a second set
    - Mirror the non-blocking warn-on-failure behaviour of workitem-commit



    ## STANDARDS

    This project defines coding standards in .utopia/standards/. Before implementing, read the standards docs relevant to the files this task touches:

    - id: cli-organization
      description: How to structure cobra commands in internal/cli: thin handlers that own the CLI frame and delegate the algorithm to domain packages.
      tags: go, cli, cobra, architecture
      path: .utopia/standards/cli-organization.md
    - id: error-handling
      description: How errors are created, wrapped, matched, and surfaced: typed domain errors for branching, %w wrapping for infrastructure, one exit point in root.go.
      tags: go, errors, cli
      path: .utopia/standards/error-handling.md
    - id: terminal-output
      description: One shared output vocabulary (glyphs, banners, progress) routed through cobra's injectable writers so command output is consistent and testable.
      tags: go, cli, ux, output
      path: .utopia/standards/terminal-output.md


    ## CONSTRAINTS

    - Prefer existing abstractions over creating new ones unless clearly required
    - Do not refactor unrelated code
    - Architecture is already correct
    - Do not modify .utopia/specs/ files - specs are updated automatically when the CR merges


