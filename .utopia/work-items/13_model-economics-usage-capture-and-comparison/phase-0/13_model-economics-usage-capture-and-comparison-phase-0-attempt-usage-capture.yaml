last_validator_feedback: |
    Gating connector validators:after-workitem blocked workitem-verified:
    Validator spec-intent failed:
    Two `in_progress` work items exist (`13_...attempt-usage-capture.yaml:17` and `02_...modify-default-constraints.yaml:4`), but the item under review is unambiguous: the reviewed diff is that item's own routing record, and the implementation landed in `01df144`. Reviewed against `13_model-economics-usage-capture-and-comparison` phase-0 `attempt-usage-capture`.

    internal/claude.go:227 - [A] Verbose capture path sends `--output-format stream-json --include-partial-messages` but never `--verbose` to the claude binary, and `baseArgs` does not add it (`--verbose` appears only at claude.go:283, the interactive session path). The real CLI rejects this: `Error: When using --print, --output-format=stream-json requires --verbose`. Every verbose execution attempt now exits non-zero before producing any output, so no assistant text streams and no usage is read. Breaks "Verbose mode still streams assistant text to the operator in real time while usage is captured" and, for verbose runs, "Every Claude invocation the execution loop makes requests structured output from the claude CLI and parses the terminal result object for usage". Add `--verbose` whenever the stream-json format is requested.

    internal/claude_usage_test.go:224 - [A] `TestCLI_Prompt_VerboseStreamsTextAndCapturesUsage` passes against a `scriptedClaude` stand-in whose body is `cat <<'EOF'`, which ignores argv entirely, so the test asserts the streaming behaviour the criterion names while the flag combination it sends is one the real binary refuses. The verbose criterion is satisfied literally, not in substance. Have the stand-in reject the flag combination the real CLI rejects (exit non-zero unless `--verbose` accompanies `--output-format stream-json`), so the test fails until the flag is present.

    internal/ralph/scoping.go:208 - [A] The scoper invocation runs without `WithUsageCapture(true)`, so a Claude call the execution loop makes still discards its accounting. Breaks "Every Claude invocation the execution loop makes requests structured output from the claude CLI and parses the terminal result object for usage"; the exemption in "Attempts made by validators and by discovery are out of scope" does not cover the scoper, and the same reasoning was already applied to the after-phase fix invocation at internal/ralph/ralph.go:900.

    Not flagged: the resolved-model, cost-basis, three-state and ADR-007 work all match the criteria and the feature description; `fmt.Print` in `internal/claude.go` is pre-existing and outside `internal/cli`, where `terminal-output.md` scopes its writer rule.

