      "corrected_intent": "Usage capture is a contract with the real claude binary, so the flags the code emits must be flags that binary accepts: a stream-json run under --print carries --verbose alongside --output-format stream-json --include-partial-messages, and the test double stands in for the binary faithfully enough to reject what the binary rejects. Every Claude invocation the execution loop itself makes - the executor attempt, the after-phase fix and the scoper - asks for structured output; only validators and discovery report no usage.",
