id: 01_fix-batch-execution-filename-ordering-sort-batch-execution-by-filename
spec_ref: 01_fix-batch-execution-filename-ordering.sort-batch-execution-by-filename
title: |
    Fix utopia execute --all to match spec execution-ralph, feature batch-execution.

    Current behavior: runExecuteAll sorts with lessCRExecutionOrder, which reads
    the numeric prefix from cr.ID. cr.ID is populated purely by unmarshalling the
    yaml id field - the generic Load helper never injects the filename. The
    established convention, documented on ResolveChangeRequest and visible in real
    data, is that the prefix lives on the filename while the internal id stays
    clean: 01_reusable-core.yaml contains id: reusable-core. Under that convention
    crNumericPrefix finds no prefix, every CR is treated as unprefixed, and the
    batch silently runs in alphabetical id order. The ordering prefix does nothing.

    Expected behavior: ordering is driven by the CR filename, per the two
    acceptance criteria that say so explicitly.

    Root cause: ListChangeRequests derives the filename basename in order to load
    each CR, then discards it and returns only the parsed documents, so by the time
    the sort runs the filename is gone and cr.ID is the only key available.

    This is the same root cause as the shadow-save bug fixed in commit 1ee0cdc -
    that fix stopped SaveChangeRequest reconstructing a path from cr.ID, but the
    ordering half of the same assumption was never corrected.
status: completed
prompt: |-
    ## TASK

    Fix utopia execute --all to match spec execution-ralph, feature batch-execution.

    Current behavior: runExecuteAll sorts with lessCRExecutionOrder, which reads
    the numeric prefix from cr.ID. cr.ID is populated purely by unmarshalling the
    yaml id field - the generic Load helper never injects the filename. The
    established convention, documented on ResolveChangeRequest and visible in real
    data, is that the prefix lives on the filename while the internal id stays
    clean: 01_reusable-core.yaml contains id: reusable-core. Under that convention
    crNumericPrefix finds no prefix, every CR is treated as unprefixed, and the
    batch silently runs in alphabetical id order. The ordering prefix does nothing.

    Expected behavior: ordering is driven by the CR filename, per the two
    acceptance criteria that say so explicitly.

    Root cause: ListChangeRequests derives the filename basename in order to load
    each CR, then discards it and returns only the parsed documents, so by the time
    the sort runs the filename is gone and cr.ID is the only key available.

    This is the same root cause as the shadow-save bug fixed in commit 1ee0cdc -
    that fix stopped SaveChangeRequest reconstructing a path from cr.ID, but the
    ordering half of the same assumption was never corrected.


    Acceptance criteria:
    - Batch execution orders CRs by their filename basename, not by the id field inside the file
    - A CR file named NN_<name>.yaml whose internal id field carries no numeric prefix is ordered by its NN_ filename prefix
    - Numeric filename prefixes are compared numerically, so 2_ runs before 10_ regardless of zero-padding
    - CRs without a numeric filename prefix are executed after all prefixed CRs, in alphabetical filename order
    - A regression test covers a CR whose id field differs from its filename and asserts the filename determines position
    - A regression test asserts that a prefixed filename with an unprefixed internal id sorts ahead of an unprefixed filename
    - Work item keying, progress output and commit messages continue to use the CR's internal id, unchanged
    - Ordering is unchanged for CRs whose filename and internal id are identical


    ## REFERENCE

    The following spec feature defines the correct behavior:

    Execute all draft CRs in sequence with a single command.
    Instead of selecting one CR at a time, users can run all pending
    CRs in one batch operation.


    Acceptance criteria:
    - Command "utopia execute --all" runs all CRs in .utopia/change-requests/
    - CRs are executed in filename order; a leading numeric prefix on the CR filename (e.g. "1_", "2_") controls the execution sequence
    - Each CR goes through the full flow (chunk, execute, merge)
    - If a CR fails, execution stops and reports which CR failed
    - Progress shows "Executing CR N of M: <cr-title>"
    - Summary at end shows how many CRs completed successfully
    - Numeric filename prefixes are compared numerically, so "2_" runs before "10_" regardless of zero-padding
    - CRs without a numeric prefix are executed after all prefixed CRs, in alphabetical order



    ## HINTS

    - The sort is at internal/cli/execute.go:259; the comparator lessCRExecutionOrder is at execute.go:234 and crNumericPrefix at execute.go:216
    - ListChangeRequests at internal/store.go:468 already computes the filename basename around line 490 and throws it away after loading - surface it rather than re-reading the directory in the CLI layer
    - Keep one definition of the numeric-prefix convention; stripNumericPrefix at internal/store.go:383 already implements it for resolution, and crNumericPrefix is a second parallel implementation
    - The spec criteria that this must satisfy are .utopia/specs/execution-ralph.yaml:161 and :166, both of which say filename
    - Preserve lessCRExecutionOrder as a pure, separately testable function - the existing test at internal/cli/execute_test.go:39-44 documents the intended ordering and should keep passing once its fixtures carry filenames
    - Out of scope but worth recording as a note or ADR - the queue daemon in internal/cli/execute_run.go does not sort at all, it follows raw os.ReadDir order, so the two batch paths disagree on ordering and on failure policy



