    Gating connector validators:after-workitem blocked workitem-verified:
    Validator spec-intent failed:
    Two work items have `status: in_progress`, so the item under review cannot be identified without guessing:

    - `.utopia/work-items/11_ship-default-spec-intent-validator/11_ship-default-spec-intent-validator-default-spec-intent-validator.yaml:19`
    - `.utopia/work-items/04_connectors-cancelled-handle-no-false-error/04_connectors-cancelled-handle-no-false-error-modify-subscription-engine.yaml:4`

    The diff touches item 11 only, but the diff is not admissible evidence of which item is running - judging it against criteria inferred from itself is circular. Item 04's `in_progress` status is likely stale (commit `0b2bf35 chunk: 04_...` predates `807db01 chunk: 11_...`), which suggests the runner does not reset `status` when an item stops being the active one.

    Violations:

    `.utopia/work-items/04_connectors-cancelled-handle-no-false-error/04_connectors-cancelled-handle-no-false-error-modify-subscription-engine.yaml:4` - [A] stale `status: in_progress` on a non-running work item makes the running item unidentifiable; whichever component transitions work-item status must clear the previous item's `in_progress` so at most one item holds it at a time.

    <VERDICT>
    {
      "verdict": "fail",
      "failure_class": "mechanical",
      "confidence": "low"
    }
    </VERDICT>
