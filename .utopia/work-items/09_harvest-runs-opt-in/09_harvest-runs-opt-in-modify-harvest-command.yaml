id: 09_harvest-runs-opt-in-modify-harvest-command
spec_ref: 09_harvest-runs-opt-in.modify-harvest-command
title: |
    Modify the harvest-command feature: /harvest command that performs single-pass analysis of unprocessed
    conversations, detecting signals for all documentation types and
    guiding creation with context flowing between doc types.

    Conversations are always scanned. Execution runs are a second,
    opt-in source: each unprocessed run adds another source block (with
    an embedded transcript) to the harvest prompt, so a project with many
    executed work items inflates prompt size and token cost substantially.
    Runs are therefore included only when the operator asks for them via
    --runs, and harvest prints a cheap filesystem-derived count hint so
    accumulated runs stay discoverable without being paid for.
status: in_progress
prompt: |-
    ## TASK

    Modify the harvest-command feature: /harvest command that performs single-pass analysis of unprocessed
    conversations, detecting signals for all documentation types and
    guiding creation with context flowing between doc types.

    Conversations are always scanned. Execution runs are a second,
    opt-in source: each unprocessed run adds another source block (with
    an embedded transcript) to the harvest prompt, so a project with many
    executed work items inflates prompt size and token cost substantially.
    Runs are therefore included only when the operator asks for them via
    --runs, and harvest prints a cheap filesystem-derived count hint so
    accumulated runs stay discoverable without being paid for.


    Acceptance criteria:
    - harvest accepts a --runs boolean flag that defaults to false
    - A harvest invocation without --runs embeds no execution run transcripts in the prompt
    - A harvest invocation with --runs includes unprocessed execution runs as a source, prioritized ahead of conversations as before
    - Without --runs, harvest starts a session when unprocessed conversations exist, regardless of how many unprocessed execution runs exist
    - Without --runs, harvest exits without starting a session when there are no unprocessed conversations, even if unprocessed execution runs exist
    - Without --runs, when one or more unprocessed execution runs exist, harvest prints a single-line hint stating the count and naming the --runs flag
    - The count hint is derived from the filesystem only and embeds no run transcripts in the prompt
    - Without --runs, when zero unprocessed execution runs exist, no hint is printed
    - Execution runs not scanned because --runs was omitted remain unprocessed and are eligible for a later --runs harvest
    - Change from "/harvest scans .utopia/runs/ for unprocessed execution runs alongside .utopia/conversations/" to: /harvest scans .utopia/conversations/ always, and scans .utopia/runs/ for unprocessed execution runs only when the --runs flag is passed
    - Change from "Execution runs are marked processed only after the user completes or exits harvest, consistent with conversations" to: When --runs is passed, execution runs are marked processed only after the user completes or exits harvest, consistent with conversations



    ## STANDARDS

    This project defines coding standards in .utopia/standards/. Before implementing, read the standards docs relevant to the files this task touches:

    - id: cli-organization
      description: How to structure cobra commands in internal/cli: thin handlers that own the CLI frame and delegate the algorithm to domain packages.
      tags: go, cli, cobra, architecture
      path: .utopia/standards/cli-organization.md
    - id: error-handling
      description: How errors are created, wrapped, matched, and surfaced: typed domain errors for branching, %w wrapping for infrastructure, one exit point in root.go.
      tags: go, errors, cli
      path: .utopia/standards/error-handling.md
    - id: terminal-output
      description: One shared output vocabulary (glyphs, banners, progress) routed through cobra's injectable writers so command output is consistent and testable.
      tags: go, cli, ux, output
      path: .utopia/standards/terminal-output.md


    ## CONSTRAINTS

    - Prefer existing abstractions over creating new ones unless clearly required
    - Do not refactor unrelated code
    - Architecture is already correct
    - Do not modify .utopia/specs/ files - specs are updated automatically when the CR merges


    ---

    When complete, commit your changes and output: <COMPLETE>
