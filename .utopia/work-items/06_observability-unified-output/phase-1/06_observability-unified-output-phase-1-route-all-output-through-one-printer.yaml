status: completed
prompt: |-
    ## TASK

    Roughly 119 bare fmt call sites bypass the Printer entirely, across
    internal/ralph (31 in ralph.go, 7 in ratelimit.go, 3 in engine.go),
    internal/harvest (20), internal/validators (10 in create.go, 8 in
    edit.go), internal/discover (8 in discover.go, 2 in domain.go),
    internal/claude.go (2), internal/store.go (1) and internal/cli/root.go
    (1). None of them can be redirected or captured, because ralph.Execute
    and its peers accept no writer.

    Route every one of them through the relocated Printer, and thread a
    Printer into the packages that need one. Output must not change - not
    the text, not the stream. This phase only makes the output redirectable
    so later phases can level it and reclassify it.


    Acceptance criteria:
    - Every diagnostic and result emitted by internal/ralph, internal/harvest, internal/discover and internal/validators goes through the shared Printer
    - ralph.Execute receives a Printer from its caller rather than writing to the process stdout implicitly
    - No fmt.Print, fmt.Printf or fmt.Println call that writes to the process stdout remains outside the output package itself
    - No direct os.Stdout or os.Stderr reference remains outside the output package, except where a subprocess stream is deliberately wired in internal/claude.go
    - Every message printed before the change is still printed, with byte-identical text, on the same stream
    - A test injects a buffer into ralph.Execute and asserts on captured output, proving redirection works
    - go test ./... passes



    ## HINTS

    - internal/cli already constructs the Printer correctly in 17 places via ui.NewPrinter(cmd.OutOrStdout(), cmd.ErrOrStderr()) - extend that construction outward rather than inventing a second pattern
    - Prefer threading the Printer through the existing config or params structs over adding a positional parameter to ralph.Execute, since the call tree is wide
    - internal/discover/discover.go:32 constructs ui.NewProgress(os.Stdout, ...) directly - it should receive the writer instead
    - Do not touch the failure-output printing paths in internal/ralph/ralph.go around lines 332-343, 355-359 and 570-575; change request 05_unify-failure-output-printing owns those and will land its own shared helper there
    - Interactive prompts in internal/validators/create.go and edit.go are a result, not a diagnostic - route them through the result channel



    ## STANDARDS

    This project defines coding standards in .utopia/standards/. Before implementing, read the standards docs relevant to the files this task touches:

    - id: cli-organization
      description: How to structure cobra commands in internal/cli: thin handlers that own the CLI frame and delegate the algorithm to domain packages.
      tags: go, cli, cobra, architecture
      path: .utopia/standards/cli-organization.md
    - id: error-handling
      description: How errors are created, wrapped, matched, and surfaced: typed domain errors for branching, %w wrapping for infrastructure, one exit point in root.go.
      tags: go, errors, cli
      path: .utopia/standards/error-handling.md
    - id: terminal-output
      description: One shared output vocabulary (glyphs, banners, progress) routed through cobra's injectable writers so command output is consistent and testable.
      tags: go, cli, ux, output
      path: .utopia/standards/terminal-output.md


    ## CONSTRAINTS

    - This is a refactor. Existing behavior MUST be preserved.
    - All existing tests must pass without modification
    - Do not introduce new abstractions, interfaces, or packages
    - Prefer existing abstractions over creating new ones unless clearly required
    - Do not refactor unrelated code
    - Architecture is already correct
    - Do not modify .utopia/specs/ files - specs are updated automatically when the CR merges


    ---

