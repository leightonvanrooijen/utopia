      diagnosis: The level was wired into the one diagnostic path that already had a severity (Printer's slog logger) and treated as a property of that path, while the criteria and description define it as the single process-wide threshold every diagnostic obeys. The two diagnostic mechanisms the hint named - Progress and claude.CLI.WithVerbose - still gate themselves, so a quiet run still prints progress and a de
      corrected_intent: One process-wide level governs every diagnostic, whatever mechanism emits it. Progress phase lines are diagnostics and are suppressed when the level is above info, exactly as Printer diagnostics are. Claude streaming detail is debug-level diagnostic output, so it turns on whenever the level admits debug, which is what makes --verbose and --log-level debug the same request in both directions. Only results bypass the level.
