status: pending
prompt: |-
    ## TASK

    A user can raise or lower diagnostic verbosity globally, so a quiet run
    and a deep-debugging run are the same command with a different level. The
    result channel is never suppressed - lowering verbosity must never hide a
    command's answer.


    Acceptance criteria:
    - A UTOPIA_LOG_LEVEL environment variable accepts debug, info, warn and error
    - A --log-level persistent flag on the root command accepts the same values and takes precedence over the environment variable
    - The default level is info
    - Diagnostics below the active level are written to no stream
    - Result output is emitted at every level, including error
    - An invalid level value fails with a clear error naming the accepted values, rather than silently defaulting
    - The existing --verbose and -v flags on discover and discover domain continue to work, and are documented as equivalent to --log-level debug



    ## HINTS

    - Verbose gating currently exists only in Progress.verbose and claude.CLI.WithVerbose - there is no global level today
    - Register the persistent flag in internal/cli/root.go where the Printer is already constructed



    ## STANDARDS

    This project defines coding standards in .utopia/standards/. Before implementing, read the standards docs relevant to the files this task touches:

    - id: cli-organization
      description: How to structure cobra commands in internal/cli: thin handlers that own the CLI frame and delegate the algorithm to domain packages.
      tags: go, cli, cobra, architecture
      path: .utopia/standards/cli-organization.md
    - id: error-handling
      description: How errors are created, wrapped, matched, and surfaced: typed domain errors for branching, %w wrapping for infrastructure, one exit point in root.go.
      tags: go, errors, cli
      path: .utopia/standards/error-handling.md
    - id: terminal-output
      description: One shared output vocabulary (glyphs, banners, progress) routed through cobra's injectable writers so command output is consistent and testable.
      tags: go, cli, ux, output
      path: .utopia/standards/terminal-output.md


    ## CONSTRAINTS

    - Prefer existing abstractions over creating new ones unless clearly required
    - Do not refactor unrelated code
    - Architecture is already correct
    - Do not modify .utopia/specs/ files - specs are updated automatically when the CR merges


