    `internal/cli/discover.go:65 - [A] applyVerbose raises the ui level only; discover.go:116 (and :287) still pass the raw flag bool into opts.Verbose, which reaches internal.NewCLI().WithVerbose(opts.Verbose) at internal/discover/discover.go:101. So --verbose streams Claude output in real time (internal/claude.go:261) while --log-level debug does not. The help text added at discover.go:56/:213 documents the two as equivalent when they are not. Breaks criterion "--verbose and -v ... are documented as equivalent to --log-level debug" in substance, and the feature description "a quiet run and a deep-debugging run are the same command with a different level". The hint named claude.CLI.WithVerbose as one of the two existing gates; it was left un-migrated.`

    No B (standards) violations found: level resolution sits in `root.go` as the standard's hint directs, the invalid-value error returns through `RunE` to the single `Execute()` exit point, and results stay on `p.out` ungated.

