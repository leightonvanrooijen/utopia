title: |
    Pass the resolved credential environment to every claude subprocess
    the CLI wrapper spawns.
status: in_progress
prompt: |-
    ## TASK

    Pass the resolved credential environment to every claude subprocess
    the CLI wrapper spawns.


    Acceptance criteria:
    - All three exec.CommandContext call sites in internal/claude.go set cmd.Env
    - Prompt, streamingPrompt, and SessionWithCapture apply identical credential resolution
    - The resolved auth mode is carried on the CLI struct rather than read from global state at each call site
    - When no auth mode is configured, cmd.Env contains the same set of variables as os.Environ()



    ## HINTS

    - The three exec sites are internal/claude.go:109 (Prompt), :133 (streamingPrompt), and :224 (SessionWithCapture)
    - Add the mode to the CLI struct at internal/claude.go:41-56 with a WithAuth builder method, matching the existing WithModel and WithVerbose shape
    - NewCLI() is constructed in roughly a dozen places across internal/cli, internal/ralph, internal/validators, internal/discover, and internal/harvest - defaulting to inherit-everything keeps untouched call sites working



    ## STANDARDS

    This project defines coding standards in .utopia/standards/. Before implementing, read the standards docs relevant to the files this task touches:

    - id: cli-organization
      description: How to structure cobra commands in internal/cli: thin handlers that own the CLI frame and delegate the algorithm to domain packages.
      tags: go, cli, cobra, architecture
      path: .utopia/standards/cli-organization.md
    - id: error-handling
      description: How errors are created, wrapped, matched, and surfaced: typed domain errors for branching, %w wrapping for infrastructure, one exit point in root.go.
      tags: go, errors, cli
      path: .utopia/standards/error-handling.md
    - id: terminal-output
      description: One shared output vocabulary (glyphs, banners, progress) routed through cobra's injectable writers so command output is consistent and testable.
      tags: go, cli, ux, output
      path: .utopia/standards/terminal-output.md


