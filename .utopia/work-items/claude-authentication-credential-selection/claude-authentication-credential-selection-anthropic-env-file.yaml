id: claude-authentication-credential-selection-anthropic-env-file
spec_ref: claude-authentication-credential-selection.anthropic-env-file
title: |
    Read Anthropic credentials from .utopia/.env so the secret lives in a
    gitignored file rather than in committed config.
status: completed
prompt: |-
    ## TASK

    Read Anthropic credentials from .utopia/.env so the secret lives in a
    gitignored file rather than in committed config.


    Acceptance criteria:
    - .utopia/.env is read when present
    - Only keys matching the ANTHROPIC_ prefix are loaded from the file
    - Keys not matching that prefix are ignored and never reach the claude subprocess
    - A missing .utopia/.env is not an error
    - A value in .utopia/.env takes precedence over the same variable in the ambient environment
    - .utopia/.env is listed in .gitignore



    ## HINTS

    - There is no dotenv dependency in go.mod today - either add one or hand-roll the parse, but keep the ANTHROPIC_ prefix filter at the boundary so the file cannot become general-purpose env injection
    - .gitignore currently lists .utopia/conversations/, .envrc, and utopia - add the .env entry there



    ## STANDARDS

    This project defines coding standards in .utopia/standards/. Before implementing, read the standards docs relevant to the files this task touches:

    - id: cli-organization
      description: How to structure cobra commands in internal/cli: thin handlers that own the CLI frame and delegate the algorithm to domain packages.
      tags: go, cli, cobra, architecture
      path: .utopia/standards/cli-organization.md
    - id: error-handling
      description: How errors are created, wrapped, matched, and surfaced: typed domain errors for branching, %w wrapping for infrastructure, one exit point in root.go.
      tags: go, errors, cli
      path: .utopia/standards/error-handling.md
    - id: terminal-output
      description: One shared output vocabulary (glyphs, banners, progress) routed through cobra's injectable writers so command output is consistent and testable.
      tags: go, cli, ux, output
      path: .utopia/standards/terminal-output.md


    ## CONSTRAINTS

    - Prefer existing abstractions over creating new ones unless clearly required
    - Do not refactor unrelated code
    - Architecture is already correct
    - Do not modify .utopia/specs/ files - specs are updated automatically when the CR merges


