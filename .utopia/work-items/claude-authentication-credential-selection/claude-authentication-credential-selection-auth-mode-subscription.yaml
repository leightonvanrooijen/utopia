id: claude-authentication-credential-selection-auth-mode-subscription
spec_ref: claude-authentication-credential-selection.auth-mode-subscription
title: |
    In subscription mode, suppress API-key credentials so the claude CLI
    falls through to its OAuth profile.
status: pending
prompt: |-
    ## TASK

    In subscription mode, suppress API-key credentials so the claude CLI
    falls through to its OAuth profile.


    Acceptance criteria:
    - ANTHROPIC_API_KEY is absent from the claude subprocess environment even when it is set in the parent environment
    - ANTHROPIC_AUTH_TOKEN is absent from the claude subprocess environment even when it is set in the parent environment
    - Both variables are removed from the environment entirely rather than set to an empty string, because an empty value still occupies its slot in the precedence chain and authenticates as an empty credential
    - .utopia/.env is not consulted for a key in this mode
    - Every inherited environment variable other than those two is passed through unchanged



    ## HINTS

    - The existing cmd.Env precedent at internal/ralph/connectors.go:140 appends to os.Environ() and cannot remove a variable - this mode needs to filter os.Environ() instead, which is a new pattern here
    - A direnv .envrc that exports ANTHROPIC_API_KEY is the motivating case, so test with the variable genuinely present in the parent process



    ## STANDARDS

    This project defines coding standards in .utopia/standards/. Before implementing, read the standards docs relevant to the files this task touches:

    - id: cli-organization
      description: How to structure cobra commands in internal/cli: thin handlers that own the CLI frame and delegate the algorithm to domain packages.
      tags: go, cli, cobra, architecture
      path: .utopia/standards/cli-organization.md
    - id: error-handling
      description: How errors are created, wrapped, matched, and surfaced: typed domain errors for branching, %w wrapping for infrastructure, one exit point in root.go.
      tags: go, errors, cli
      path: .utopia/standards/error-handling.md
    - id: terminal-output
      description: One shared output vocabulary (glyphs, banners, progress) routed through cobra's injectable writers so command output is consistent and testable.
      tags: go, cli, ux, output
      path: .utopia/standards/terminal-output.md


