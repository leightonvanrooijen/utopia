id: 16_default-executor-ignores-configured-model-rewrite-1-assert-configured-model-reaches-the-binary
spec_ref: 16_default-executor-ignores-configured-model-rewrite-1.assert-configured-model-reaches-the-binary
title: |
    Fix the gap that let this defect ship: no test asserted that a configured
    default-executor model reaches the claude binary.

    Two different contracts live at two different layers, and the previous
    wording conflated them. Keep them apart:

    Layer 1, the default executor (internal/ralph): its model resolution
    chain always terminates in a value - models.execute, else models.default,
    else the executor default sonnet (spec model-configuration feature
    backward-compatibility: "Config without models section uses sonnet for
    all commands"). There is NO default-executor code path on which the
    resolution produces nothing. Therefore --model is present on the argv of
    every default-executor spawn, including when the project has no models
    section at all - in that case it carries sonnet. Do not write a
    default-executor test expecting the flag to be absent; such a state is
    unreachable by design and a test demanding it contradicts the sibling
    task in this change request.

    Layer 2, the CLI wrapper (internal.CLI): the spec criterion "If no model
    specified, claude CLI uses its default" is a contract of this wrapper,
    not of the executor. "No model specified" means the wrapper's model
    parameter is empty - it does not mean "the project has no models
    section". The wrapper omits --model when handed an empty model, and that
    omission is asserted at the internal.CLI layer, the only layer where an
    empty model can occur.
status: in_progress
prompt: |-
    ## TASK

    Fix the gap that let this defect ship: no test asserted that a configured
    default-executor model reaches the claude binary.

    Two different contracts live at two different layers, and the previous
    wording conflated them. Keep them apart:

    Layer 1, the default executor (internal/ralph): its model resolution
    chain always terminates in a value - models.execute, else models.default,
    else the executor default sonnet (spec model-configuration feature
    backward-compatibility: "Config without models section uses sonnet for
    all commands"). There is NO default-executor code path on which the
    resolution produces nothing. Therefore --model is present on the argv of
    every default-executor spawn, including when the project has no models
    section at all - in that case it carries sonnet. Do not write a
    default-executor test expecting the flag to be absent; such a state is
    unreachable by design and a test demanding it contradicts the sibling
    task in this change request.

    Layer 2, the CLI wrapper (internal.CLI): the spec criterion "If no model
    specified, claude CLI uses its default" is a contract of this wrapper,
    not of the executor. "No model specified" means the wrapper's model
    parameter is empty - it does not mean "the project has no models
    section". The wrapper omits --model when handed an empty model, and that
    omission is asserted at the internal.CLI layer, the only layer where an
    empty model can occur.


    Acceptance criteria:
    - A test asserts that with models.execute configured and no --model flag, a default-executor attempt invokes the claude binary with --model set to the configured value
    - A test asserts that with models.execute absent but models.default present, a default-executor attempt invokes the claude binary with --model set to models.default
    - A test asserts that with no models section at all, a default-executor attempt invokes the claude binary with --model sonnet, per feature backward-compatibility ("Config without models section uses sonnet for all commands")
    - A test asserts that a --model flag overrides a configured models.execute for that invocation
    - A test at the internal.CLI layer asserts that when the wrapper's model parameter is empty, no --model flag appears on the argv, satisfying the cli-model-injection criterion "If no model specified, claude CLI uses its default" at the only layer where an empty model occurs
    - No test asserts an absent --model flag on a default-executor attempt; the default-executor assertions cover that role specifically, not only the roles that already resolved their model correctly


    ## REFERENCE

    The following spec feature defines the correct behavior:

    Pass the resolved model and effort to the Claude CLI wrapper.

    Effort travels the same path as model - resolved by the caller from
    the role, threaded through the wrapper, appended as a flag. It is a
    second parameter on an existing route rather than a new mechanism.


    Acceptance criteria:
    - CLI struct accepts optional model and effort parameters
    - Model is passed to claude binary via --model flag
    - If no model specified, claude CLI uses its default
    - Model and effort flow through Prompt and SessionWithCapture methods
    - Effort is passed to claude binary via --effort flag
    - If no effort is specified, the flag is omitted and the claude CLI default applies



    ## HINTS

    - internal/claude.go:238 is the guarded append; internal/claude_usage_test.go shows the existing pattern for asserting on constructed argv
    - A regression test that only exercises the escalated executor or a validator would have passed against the defect - the default executor is the path that needs covering
    - The wrapper-layer omit-the-flag test and the executor-layer always-present tests are complementary, not contradictory; the empty-model case simply never reaches the wrapper from the default executor



    ## STANDARDS

    This project defines coding standards in .utopia/standards/. Before implementing, read the standards docs relevant to the files this task touches:

    - id: cli-organization
      description: How to structure cobra commands in internal/cli: thin handlers that own the CLI frame and delegate the algorithm to domain packages.
      tags: go, cli, cobra, architecture
      path: .utopia/standards/cli-organization.md
    - id: error-handling
      description: How errors are created, wrapped, matched, and surfaced: typed domain errors for branching, %w wrapping for infrastructure, one exit point in root.go.
      tags: go, errors, cli
      path: .utopia/standards/error-handling.md
    - id: terminal-output
      description: One shared output vocabulary (glyphs, banners, progress) routed through cobra's injectable writers so command output is consistent and testable.
      tags: go, cli, ux, output
      path: .utopia/standards/terminal-output.md


    ## CONSTRAINTS

    - This is a bugfix. The implementation must be corrected to match the spec.
    - The acceptance criteria below are the source of truth for correct behavior.
    - Fix only the behavior that deviates from the spec
    - Prefer existing abstractions over creating new ones unless clearly required
    - Do not refactor unrelated code
    - Architecture is already correct
    - Do not modify .utopia/specs/ files - specs are updated automatically when the CR merges
    - You are running autonomously and non-interactively; never ask for, or wait on, human input
    - When a genuine design choice arises, choose the best-justified option and implement it rather than deferring the decision to a human
    - Record any non-obvious decision - rationale and the alternatives considered - in the commit or PR body, so PR review is the human checkpoint


