id: 16_default-executor-ignores-configured-model-rewrite-1-assert-configured-model-reaches-the-binary
spec_ref: 16_default-executor-ignores-configured-model-rewrite-1.assert-configured-model-reaches-the-binary
title: |
    Fix the gap that let this defect ship: no test asserted that a configured
    default-executor model reaches the claude binary.

    Two different contracts live at two different layers, and the previous
    wording conflated them. Keep them apart:

    Layer 1, the default executor (internal/ralph): its model resolution
    chain always terminates in a value - models.execute, else models.default,
    else the executor default sonnet (spec model-configuration feature
    backward-compatibility: "Config without models section uses sonnet for
    all commands"). There is NO default-executor code path on which the
    resolution produces nothing. Therefore --model is present on the argv of
    every default-executor spawn, including when the project has no models
    section at all - in that case it carries sonnet. Do not write a
    default-executor test expecting the flag to be absent; such a state is
    unreachable by design and a test demanding it contradicts the sibling
    task in this change request.

    Layer 2, the CLI wrapper (internal.CLI): the spec criterion "If no model
    specified, claude CLI uses its default" is a contract of this wrapper,
    not of the executor. "No model specified" means the wrapper's model
    parameter is empty - it does not mean "the project has no models
    section". The wrapper omits --model when handed an empty model, and that
    omission is asserted at the internal.CLI layer, the only layer where an
    empty model can occur.
