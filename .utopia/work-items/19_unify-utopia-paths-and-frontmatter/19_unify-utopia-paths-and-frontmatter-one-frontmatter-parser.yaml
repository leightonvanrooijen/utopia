title: |
    The markdown frontmatter format is parsed by three hand-rolled copies in
    store.go - LoadConceptDoc (store.go:992-1003), the standards listing loop
    (store.go:1071-1081) and LoadValidator (store.go:1233-1244). Each repeats
    the same shape: HasPrefix on "---\n", Index for "\n---", then two magic
    offsets of 4 to skip the delimiters.

    Current behavior: the three copies agree today, which is precisely what
    makes them dangerous - a fix to the delimiter handling in one is
    invisible to the other two, and the literal 4s encode the delimiter
    length at three sites that no longer mention the delimiter.

    Expected behavior: one parser splits a document into raw frontmatter and
    body, and the three callers unmarshal that frontmatter into their own
    struct. Same accepted inputs, same rejected inputs, same errors.
status: pending
prompt: |-
    ## TASK

    The markdown frontmatter format is parsed by three hand-rolled copies in
    store.go - LoadConceptDoc (store.go:992-1003), the standards listing loop
    (store.go:1071-1081) and LoadValidator (store.go:1233-1244). Each repeats
    the same shape: HasPrefix on "---\n", Index for "\n---", then two magic
    offsets of 4 to skip the delimiters.

    Current behavior: the three copies agree today, which is precisely what
    makes them dangerous - a fix to the delimiter handling in one is
    invisible to the other two, and the literal 4s encode the delimiter
    length at three sites that no longer mention the delimiter.

    Expected behavior: one parser splits a document into raw frontmatter and
    body, and the three callers unmarshal that frontmatter into their own
    struct. Same accepted inputs, same rejected inputs, same errors.


    Acceptance criteria:
    - All existing tests pass unchanged, including internal/store_test.go
    - One function owns splitting a document into frontmatter and body, and the three sites in store.go call it
    - Documents that parse today still parse to byte-identical frontmatter and body
    - Documents that are rejected today are still rejected, with the same error text at each of the three call sites
    - The literal offsets that skip the delimiters appear once, in the shared parser, and are derived from the delimiter rather than written as bare 4s
    - Each caller still unmarshals into its own frontmatter struct - the shared parser does not know about ConceptDoc, standards metadata or Validator
    - A test covers the shared parser directly, including a document with no frontmatter, an unterminated frontmatter block, and an empty body



    ## HINTS

    - The three sites are internal/store.go:992 (LoadConceptDoc, declared at 981), internal/store.go:1071 (inside ListStandardsDocs) and internal/store.go:1233 (LoadValidator, declared at 1222)
    - validatorFrontmatter is declared at internal/store.go:1208 - it stays as-is, only the splitting moves
    - Check the two offsets carefully before extracting - bodyStart is `4 + endMarker + 4` at store.go:1003 and store.go:1244, and the standards loop at store.go:1071 may not compute the body at all. Preserve each caller's existing behavior rather than unifying it



    ## STANDARDS

    This project defines coding standards in .utopia/standards/. Before implementing, read the standards docs relevant to the files this task touches:

    - id: cli-organization
      description: How to structure cobra commands in internal/cli: thin handlers that own the CLI frame and delegate the algorithm to domain packages.
      tags: go, cli, cobra, architecture
      path: .utopia/standards/cli-organization.md
    - id: error-handling
      description: How errors are created, wrapped, matched, and surfaced: typed domain errors for branching, %w wrapping for infrastructure, one exit point in root.go.
      tags: go, errors, cli
      path: .utopia/standards/error-handling.md
    - id: terminal-output
      description: One shared output vocabulary (glyphs, banners, progress) routed through cobra's injectable writers so command output is consistent and testable.
      tags: go, cli, ux, output
      path: .utopia/standards/terminal-output.md


    ## CONSTRAINTS

    - This is a refactor. Existing behavior MUST be preserved.
    - All existing tests must pass without modification
    - Do not introduce new abstractions, interfaces, or packages
    - Prefer existing abstractions over creating new ones unless clearly required
    - Do not refactor unrelated code
    - Architecture is already correct
    - Do not modify .utopia/specs/ files - specs are updated automatically when the CR merges
    - You are running autonomously and non-interactively; never ask for, or wait on, human input
    - When a genuine design choice arises, choose the best-justified option and implement it rather than deferring the decision to a human
    - Record any non-obvious decision - rationale and the alternatives considered - in the commit or PR body, so PR review is the human checkpoint


