id: execution-ralph-execute-name-resolution-modify-execute-command
spec_ref: execution-ralph-execute-name-resolution.modify-execute-command
title: Modify the execute-command feature
status: completed
prompt: |-
    ## TASK

    Modify the execute-command feature

    Acceptance criteria:
    - utopia execute <name> resolves the target CR by first trying change-requests/<name>.yaml, then, when that is absent, the CR file whose basename with a leading numeric prefix (digits followed by an underscore) stripped equals <name>, so 'utopia execute reusable-core' finds '01_reusable-core.yaml'
    - A CR whose filename carries a numeric prefix is runnable both by its full filename (e.g. '06_ai-chat') and by its prefix-stripped name (e.g. 'ai-chat')
    - When more than one CR file resolves to the same requested name, the command reports an error listing the candidate files instead of silently choosing one
    - Work items are keyed by the CR's internal id, independent of any numeric filename prefix, so a file named 06_ai-chat.yaml with id ai-chat uses .utopia/work-items/ai-chat/ and is not re-chunked when run as '06_ai-chat'



    ## STANDARDS

    This project defines coding standards in .utopia/standards/. Before implementing, read the standards docs relevant to the files this task touches:

    - id: cli-organization
      description: How to structure cobra commands in internal/cli: thin handlers that own the CLI frame and delegate the algorithm to domain packages.
      tags: go, cli, cobra, architecture
      path: .utopia/standards/cli-organization.md
    - id: error-handling
      description: How errors are created, wrapped, matched, and surfaced: typed domain errors for branching, %w wrapping for infrastructure, one exit point in root.go.
      tags: go, errors, cli
      path: .utopia/standards/error-handling.md
    - id: terminal-output
      description: One shared output vocabulary (glyphs, banners, progress) routed through cobra's injectable writers so command output is consistent and testable.
      tags: go, cli, ux, output
      path: .utopia/standards/terminal-output.md


    ## CONSTRAINTS

    - Prefer existing abstractions over creating new ones unless clearly required
    - Do not refactor unrelated code
    - Architecture is already correct
    - Do not modify .utopia/specs/ files - specs are updated automatically when the CR merges


    ---

    When complete, commit your changes and output: <COMPLETE>
