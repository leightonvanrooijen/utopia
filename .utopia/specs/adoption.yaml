id: adoption
title: adoption
created: "2026-03-04T19:32:20.781903+11:00"
updated: "2026-03-08T20:47:46.374114+11:00"
description: ""
features:
    - id: discover-command
      description: |
        Remove hardcoded Go file patterns. Scan all text files and let Claude
        determine what's relevant. Utopia is a helper tool for any codebase,
        not just Go projects.
      acceptance_criteria:
        - Each draft spec includes confidence level (high/medium/low)
        - Confidence based on evidence quality (tests exist, clear boundaries, documentation)
        - Low confidence specs include uncertainty notes explaining what's unclear
        - Discovery completes with summary of drafts created
        - Default output shows phase-by-phase progress with timing (e.g., '[1/4] Scanning files... done (0.3s, 47 files found)')
        - Flag `-v` or `--verbose` enables detailed file-by-file progress during scanning
        - Verbose mode shows which files are skipped during incremental filtering
        - Verbose mode shows each draft filename as it's saved
        - Total elapsed time displayed at end of discovery
        - Discovery uses sequential multi-agent pipeline (3 stages)
        - 'Stage 1 (Candidate Agent): Scans all text files to find potential user-observable capabilities'
        - 'Stage 2 (Qualifier Agent): Applies qualification/disqualification criteria to filter candidates'
        - 'Stage 3 (Refinement Agent): Sharpens descriptions and ensures acceptance criteria are testable'
        - Each stage receives output from previous stage (no parallel execution)
        - Pipeline continues only with candidates that pass qualification
        - 'Spec qualification criteria enforced: describes user-observable capability'
        - 'Spec qualification criteria enforced: can be verified by using the system'
        - 'Spec qualification criteria enforced: represents coherent bounded feature'
        - 'Spec qualification criteria enforced: answers ''what can I do?'' not ''how is it built?'''
        - 'Spec disqualification criteria enforced: implementation details (data structures, algorithms)'
        - 'Spec disqualification criteria enforced: internal code organization (services, handlers)'
        - 'Spec disqualification criteria enforced: technical plumbing users don''t interact with'
        - 'Spec disqualification criteria enforced: standard practices covered by language/framework conventions'
        - Prompts are concise and laser-focused on intent
        - Quality over speed (no quick mode)
        - Scans all text files regardless of extension
        - Works on any codebase (Go, TypeScript, Python, Rust, etc.)

    - id: drafts-storage
      description: |
        Stores proposed specs in a drafts directory until validated.
        Drafts are not used by the system until promoted to specs.
      acceptance_criteria:
        - Draft specs stored in `.utopia/drafts/specs/` directory
        - Draft spec format matches spec format with additional `confidence` field
        - Drafts include `discovered_from` field listing source files analyzed
        - Drafts directory created by `utopia discover` if it doesn't exist (creates `.utopia/drafts/specs/`)

    - id: shape-command
      description: |
        Guided conversation flow for validating and refining draft specs.
        Walks through each draft, asking clarifying questions about intent,
        and updating specs based on user responses.
      acceptance_criteria:
        - Command `utopia shape` starts guided validation flow
        - Presents drafts one at a time, starting with lowest confidence
        - For each draft, Claude asks about uncertain areas
        - User confirms, corrects, or rejects each proposed feature
        - Corrections update the spec to match stated intent
        - Rejected features are removed from the draft

    - id: spec-promotion
      description: |
        Moves validated drafts from `.utopia/drafts/specs/` to `.utopia/specs/`.
        Removes draft-specific fields during promotion.
      acceptance_criteria:
        - After shaping conversation, user can promote draft to spec
        - Promotion moves file from `drafts/specs/` to `specs/`
        - Promotion removes `confidence` and `discovered_from` fields
        - 'Promoted spec has `status: active`'
        - Original draft is deleted after successful promotion

    - id: incremental-discovery
      description: |
        Re-running discover after codebase changes only analyzes new or
        modified files. Avoids re-processing unchanged code and allows
        discovery to evolve with the codebase.
      acceptance_criteria:
        - Discovery tracks last run timestamp in `.utopia/drafts/specs/.discovery-state`
        - Subsequent `utopia discover` compares file modification times to last run
        - Only files modified since last discovery are analyzed
        - New drafts are created for newly discovered features
        - Existing drafts for unchanged code are preserved
        - Flag `--full` forces complete re-discovery of entire codebase

    - id: discovery-scope-flags
      description: |
        Command-line flags to limit discovery scope to specific directories
        or file patterns. Useful for large codebases or focusing on specific
        modules during adoption.
      acceptance_criteria:
        - Flag `--path <dir>` limits discovery to specific directory
        - Multiple `--path` flags can be provided for multiple directories
        - Flag `--exclude <pattern>` excludes files matching glob pattern
        - Default (no flags) discovers entire codebase
        - Scope restrictions are recorded in draft metadata for context

    - id: discover-domain-command
      description: |
        Scans the codebase to discover domain vocabulary and propose draft
        domain documents. Uses Claude to analyze type definitions, package
        structure, and relationships to identify bounded contexts and
        canonical terms.
      acceptance_criteria:
        - Command `utopia discover domain` initiates domain analysis
        - Claude receives codebase context (types, packages, schemas)
        - Output is draft domain docs saved to `.utopia/drafts/domain/` directory
        - Each draft includes confidence level (high/medium/low)
        - Confidence based on evidence quality (clear type definitions, consistent naming)
        - Low confidence terms include uncertainty notes explaining what's unclear
        - Discovery completes with summary of drafts created
        - Default output shows phase-by-phase progress with timing (e.g., '[1/4] Scanning files... done (0.3s, 47 files found)')
        - Flag `-v` or `--verbose` enables detailed file-by-file progress during scanning
        - Verbose mode shows which files are skipped during incremental filtering
        - Verbose mode shows each draft filename as it's saved
        - Total elapsed time displayed at end of discovery

    - id: domain-drafts-storage
      description: |
        Stores proposed domain documents in a drafts directory until validated.
        Drafts are not used by the system until promoted.
      acceptance_criteria:
        - Draft domain docs stored in `.utopia/drafts/domain/` directory
        - Draft format matches domain doc format with additional `confidence` field
        - Drafts include `discovered_from` field listing source files analyzed
        - Each term includes `evidence` field showing where it was found in code
        - Drafts directory created by `utopia discover domain` if it doesn't exist

    - id: domain-type-analysis
      description: |
        Analyzes type definitions (structs, interfaces, classes) as the primary
        source of domain vocabulary. Types are the most reliable evidence of
        domain language since they directly represent domain entities.
      acceptance_criteria:
        - Scans for struct/type definitions in Go files
        - Scans for interface/class definitions in TypeScript files
        - Extracts type name as potential domain term
        - Extracts field names as potential related terms
        - Records file path and line number as evidence
        - Filters out generic programming terms (Handler, Manager, Service, Repository, Controller, Factory, Builder, Adapter, Wrapper, Helper, Util, Base, Abstract, Default, Common, Generic, Internal)
        - Terms appearing in multiple files receive higher confidence

    - id: domain-bounded-context-inference
      description: |
        Infers bounded context boundaries from package/module structure.
        Each top-level package may represent a separate bounded context
        where terms can have context-specific meanings.
      acceptance_criteria:
        - Analyzes package/directory structure to identify bounded contexts
        - Top-level packages under domain directories become candidate bounded contexts
        - Terms are grouped by their bounded context
        - Same term in different contexts creates separate entries
        - Bounded context name derived from package name
        - Draft domain doc created per bounded context (not one monolithic file)

    - id: domain-relationship-detection
      description: |
        Detects relationships between domain entities by analyzing type
        references, field types, and method signatures.
      acceptance_criteria:
        - Detects "contains" relationships from embedded/nested types
        - Detects "references" relationships from field types pointing to other domain types
        - Detects "produces" relationships from method return types
        - Detects "consumes" relationships from method parameter types
        - Relationships recorded in draft with source evidence
        - Only relationships between discovered domain types are included

    - id: domain-schema-analysis
      description: |
        Analyzes database schemas and migrations as an additional source
        of domain entities and their relationships.
      acceptance_criteria:
        - Scans for SQL migration files in common locations (migrations/, db/migrations/)
        - Scans for schema definition files (schema.sql, schema.prisma, etc.)
        - Extracts table names as potential domain entities
        - Extracts column names as potential term attributes
        - Detects foreign key relationships between tables
        - Schema-discovered terms cross-referenced with type-discovered terms
        - Terms found in both code and schema receive higher confidence

    - id: shape-domain-command
      description: |
        Guided conversation flow for validating and refining draft domain
        documents. Walks through each bounded context and term, asking
        clarifying questions about meaning and usage.
      acceptance_criteria:
        - Command `utopia shape domain` starts guided validation flow
        - Presents drafts one bounded context at a time
        - For each term, Claude asks about uncertain areas
        - User confirms, corrects, or rejects each proposed term
        - Corrections update the term definition
        - Rejected terms are removed from the draft
        - User can mark terms as aliases of other terms
        - User can merge terms that represent the same concept
        - User can split terms that have multiple meanings

    - id: domain-promotion
      description: |
        Moves validated domain drafts from `.utopia/drafts/domain/` to
        `.utopia/domain/`. Removes draft-specific fields during promotion.
      acceptance_criteria:
        - After shaping conversation, user can promote draft to domain doc
        - Promotion moves file from `drafts/domain/` to `domain/`
        - Promotion removes `confidence`, `discovered_from`, and `evidence` fields
        - Promoted domain doc follows standard domain template
        - Original draft is deleted after successful promotion
        - If domain doc already exists for bounded context, merge terms instead of overwrite

    - id: domain-generic-term-filtering
      description: |
        Filters out generic programming terms that don't represent domain
        concepts. Prevents technical jargon from polluting the domain vocabulary.
      acceptance_criteria:
        - Maintains list of generic programming terms to filter
        - Generic suffixes filtered (Handler, Manager, Service, Repository, etc.)
        - Generic prefixes filtered (Base, Abstract, Default, Common, etc.)
        - Terms that are ONLY generic are excluded entirely
        - Terms with generic suffix but domain prefix are kept with note (e.g., "OrderService" keeps "Order")
        - Filtering is configurable via flag to include filtered terms for review

    - id: spec-qualification-criteria
      description: |
        Criteria that define what qualifies as a Spec, ensuring discovered
        specs represent genuine user-observable capabilities rather than
        implementation details or code organization.

        Core principle: Specs answer "what can I do?" not "how is it built?"
      acceptance_criteria:
        - 'Qualification: capability is user-observable (command, output, interaction, behavior)'
        - 'Qualification: capability can be verified by using the system (testable from outside)'
        - 'Qualification: capability represents a coherent bounded feature users care about'
        - 'Qualification: description focuses on WHAT users can achieve, not HOW it''s implemented'
        - 'Qualification: acceptance criteria describe observable outcomes, not internal state'
        - 'Litmus test: ''Could a user verify this by using the system?'' YES = Spec worthy'
        - Qualification criteria are applied by Qualifier Agent before a candidate becomes a draft

    - id: spec-disqualification-criteria
      description: |
        Criteria that disqualify content from becoming a Spec, even if
        it superficially describes system behavior. Filters out noise
        that doesn't belong in specifications.
      acceptance_criteria:
        - 'Disqualified: implementation details (data structures, algorithms, patterns used)'
        - 'Disqualified: internal code organization (services, handlers, repositories, utils)'
        - 'Disqualified: technical plumbing users don''t interact with (middleware, adapters)'
        - 'Disqualified: standard practices already covered by language/framework conventions'
        - 'Disqualified: infrastructure concerns (logging, monitoring, deployment)'
        - 'Disqualified: code quality practices (error handling patterns, validation approaches)'
        - 'Disqualified: architectural decisions (those belong in ADRs)'
        - 'Disqualified: domain vocabulary definitions (those belong in Domain docs)'
        - Disqualification criteria are checked before suggesting spec creation
        - Candidates failing disqualification are logged with reason (for transparency)

    - id: discovery-agent-prompts
      description: |
        Update agent prompts to demand specificity and depth. The quality bar is:
        "Could someone implement equivalent behavior from this spec alone?"

        Current prompts are terse and produce vague specs with "etc." and
        generic descriptions. New prompts emphasize ultrathinking - deep study
        of the code to extract exact values, explicit rules, and precise boundaries.
      acceptance_criteria:
        - 'Candidate Agent prompt focuses on: ''Find what users can DO with this system'''
        - 'Qualifier Agent prompt focuses on: ''Is this user-observable and testable?'''
        - 'Refinement Agent prompt focuses on: ''Can someone verify this by using the system?'''
        - Each prompt fits in a single screen (concise by design)
        - Prompts include examples of good vs bad specs for calibration
        - Prompts reference qualification/disqualification criteria explicitly
        - No verbose instructions - intent over prescription
        - Refinement Agent prompt instructs Claude to "ultrathink" - deep analysis, not skimming
        - Refinement Agent prompt instructs Claude to "study" the code thoroughly
        - Refinement Agent prompt states regeneration quality bar explicitly
        - Prompt includes concrete BAD/GOOD examples showing vague vs specific criteria
        - Prompt explicitly forbids vague language ("etc.", "various", "appropriately")
        - Prompt instructs to list specific values, never categories
        - Prompt instructs to state exact rules, not vague behaviors
        - Prompt instructs to name boundaries explicitly
        - Prompt instructs to capture what DOESN'T happen (negative constraints)
        - Prompt instructs to include format strings and identifiers when they matter
