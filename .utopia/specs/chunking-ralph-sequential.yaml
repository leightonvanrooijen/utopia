id: chunking-ralph-sequential
title: Ralph Sequential Chunking Strategy
created: "0001-01-01T00:00:00+00:00"
updated: "2026-07-30T20:02:29.01324+10:00"
description: |
    The "ralph-sequential" chunking strategy transforms a structured specification into
    discrete WorkItems optimized for Ralph Wiggum loop execution.

    This is one of potentially many chunking strategies. This strategy:
    - Creates one WorkItem per feature (simple 1:1 mapping)
    - Executes sequentially (spec order = execution order)
    - Uses fresh context per iteration with failure feedback
    - Relies on external verification (Utopia loop, not Claude stop hooks)
domain_knowledge:
    - Ralph Wiggum loops work best with small, focused tasks that fit in one context window
    - Each iteration runs with fresh context; Claude rebuilds state from git/files
    - Verification happens externally via Utopia loop, not Claude stop hooks
    - Acceptance criteria must be machine-verifiable (tests pass, build succeeds)
    - Backpressure (hooks, tests) beats direction - engineer conditions for success
    - Only failure output from previous iteration is fed forward (not passing tests)
    - The completion token <COMPLETE> distinguishes intentional completion from step-limit exits
    - Change requests can be chunked directly using the same command as specs
    - All operation types (add, modify, remove) are converted to WorkItems
    - The chunk command falls back to change-requests directory if spec not found in main specs
    - Refactors use the same chunking infrastructure as specs
    - Refactor WorkItems receive additional behavior-preservation constraints
    - The chunk command detects document type (spec, change-request, refactor) and applies appropriate handling
features:
    - id: ralph-sequential-strategy
      description: |
        Implement the "ralph-sequential" chunking strategy.
        One WorkItem per feature by default, split into several when a feature
        exceeds the configured turn budget. Executed in spec order.
      acceptance_criteria:
        - Strategy implements chunk.Strategy interface
        - Strategy Name() returns "ralph-sequential"
        - Strategy creates one WorkItem per feature, or several when the sizer splits an oversized feature
        - Strategy is registered in the chunk registry
        - WorkItems are assigned sequential Order based on feature position
        - Order remains contiguous and sequential across split WorkItems, preserving spec order
        - WorkItems produced from one feature are ordered adjacently, in the order the sizer returned them

    - id: work-item-model
      description: |
        Extend the WorkItem domain model to support the Ralph execution loop.
      acceptance_criteria:
        - WorkItem has ID, SpecRef, Title, Status fields
        - WorkItem has Prompt field containing the rendered prompt
        - WorkItem has Constraints field (slice of strings)
        - WorkItem has Order field for sequential execution
        - WorkItem does NOT have separate AcceptanceCriteria (baked into prompt)
        - WorkItem does NOT have CompletionPromise field (token is in prompt template)
        - WorkItem has SourceFeatureID recording the feature it was derived from
        - WorkItem has CriteriaOrigin recording whether its criteria were partitioned from the feature or authored by the sizer
        - SourceFeatureID equals the feature ID and CriteriaOrigin is empty for WorkItems that were not split

    - id: prompt-template
      description: |
        Create a minimal prompt template for Ralph execution.
        Template renders task with criteria baked in, constraints, and completion instruction.
      acceptance_criteria:
        - Template has TASK section with feature description and acceptance criteria merged
        - Template has CONSTRAINTS section populated from spec and defaults
        - 'Template ends with "When complete, commit your changes and output: <COMPLETE>"'
        - Template has no orientation instructions (Ralph discovers context naturally)
        - Template has optional PREVIOUS FAILURES section for retry iterations
        - Template uses {{handlebars}} syntax for variable injection

    - id: prompt-builder
      description: |
        Build prompts from WorkItem data.
        Support first iteration (no failures) and retry iterations (with failures).
      acceptance_criteria:
        - Builder produces prompt without PREVIOUS FAILURES for first iteration
        - Builder injects extracted failure output for subsequent iterations
        - Built prompt is stored/updated on WorkItem
        - Builder escapes any template syntax in user content

    - id: task-with-criteria
      description: |
        Implement logic to merge feature description with acceptance criteria into a single TASK block.
      acceptance_criteria:
        - Feature description becomes the task headline
        - Acceptance criteria are listed as bullet points under the description
        - Output is plain text, not YAML
        - Format is concise and scannable

    - id: default-constraints
      description: |
        Soften the abstraction constraint language for general use, allowing legitimate
        architectural work when needed. The strict version moves to refactor-specific constraints.
      acceptance_criteria:
        - Default constraints include "Prefer existing abstractions over creating new ones unless clearly required"
        - Default constraints include "Do not refactor unrelated code"
        - Default constraints include "Architecture is already correct"
        - Constraints can be extended per-spec via spec.constraints field
        - Constraints are deduplicated if spec repeats a default
        - Default constraints include "You are running autonomously and non-interactively; never ask for, or wait on, human input"
        - Default constraints include "When a genuine design choice arises, choose the best-justified option and implement it rather than deferring the decision to a human"
        - Default constraints include "Record any non-obvious decision - rationale and the alternatives considered - in the commit or PR body, so PR review is the human checkpoint"
        - The autonomous decide-and-document constraints are emitted for every non-refactor work item prompt, alongside the existing default constraints

    - id: validation-verifiable-criteria
      description: |
        Validate that all features have acceptance criteria before chunking.
      acceptance_criteria:
        - Chunker rejects specs where any feature has zero acceptance criteria
        - Validation errors include the feature ID
        - Validation runs before any WorkItems are generated

    - id: change-request-to-spec-conversion
      description: |-
        Convert a change request to a chunkable spec by transforming all operations into features
      acceptance_criteria:
        - ChangeRequest has ToSpec() method that returns a *Spec
        - ToSpec() sets spec ID to the change request ID
        - ToSpec() sets spec title to the change request title
        - Add operations with features are included as-is (preserving ID, description, criteria)
        - Add operations with only domain knowledge are ignored (no feature to chunk)
        - Remove operations become features with ID remove-{feature_id}, description explaining removal, and acceptance criteria based on the reason
        - Modify operations become features with ID modify-{feature_id}, description of what to modify, and acceptance criteria listing the deltas (criteria to add, remove, edit)
        - delete-spec operations become features with ID delete-spec-{spec}, description explaining deletion, and acceptance criteria that the spec file is removed
        - CRs with both changes and tasks are supported - changes converted to features, tasks converted to features
        - Tasks on any CR type are converted to features (not just refactor CRs)

    - id: chunk-command-change-request-fallback
      description: |-
        Chunk command falls back to loading change requests when spec not found
      acceptance_criteria:
        - Command first attempts to load from .utopia/specs/<id>.yaml
        - If not found, attempts to load from .utopia/change-requests/<id>.yaml
        - Fallback checks .utopia/change-requests/ directory (unified CR location)
        - If change request found, converts to spec using ToSpec() before chunking
        - If neither found, returns clear error listing both locations checked
        - WorkItems are saved to .utopia/work-items/<change-request-id>/

    - id: refactor-chunking
      description: |
        Support chunking refactor documents into WorkItems.
        Refactor tasks map to WorkItems similar to spec features.
      acceptance_criteria:
        - Chunk command accepts refactor documents from .utopia/refactors/
        - Refactor tasks are converted to WorkItems (one WorkItem per task)
        - WorkItem ID is <refactor-id>-<task-id>
        - WorkItem Title is the task description
        - WorkItem Prompt is rendered using the same template as specs
        - WorkItems are saved to .utopia/work-items/<refactor-id>/

    - id: refactor-constraint-injection
      description: |
        Add strict abstraction constraint to refactor-specific constraints, ensuring
        refactors cannot change structure.
      acceptance_criteria:
        - Refactor WorkItems include "This is a refactor. Existing behavior MUST be preserved."
        - Refactor WorkItems include "All existing tests must pass without modification"
        - These constraints are prepended to the CONSTRAINTS section
        - Spec WorkItems do not receive these constraints
        - Constraint injection happens during prompt building
        - Behavior-preservation constraints are injected based on IsRefactor flag, not document type
        - CRs with type refactor receive behavior-preservation constraints on all work items
        - Refactor WorkItems include "Do not introduce new abstractions, interfaces, or packages"

    - id: bugfix-constraint-injection
      description: |
        Inject bugfix-specific constraints and inline feature content for bugfix WorkItems.
        This ensures Ralph has the source of truth for correct behavior.
      acceptance_criteria:
        - Bugfix WorkItems include "This is a bugfix. The implementation must be corrected to match the spec."
        - Bugfix WorkItems include "The acceptance criteria below are the source of truth for correct behavior."
        - Bugfix WorkItems include inline REFERENCE section with feature description and acceptance criteria
        - REFERENCE section is injected after TASK section, before CONSTRAINTS
        - Feature content is loaded from the referenced spec at chunk time
        - Chunker validates that referenced spec and feature_id exist
        - Chunker fails with clear error if referenced feature not found
        - Constraint injection happens during prompt building based on IsBugfix flag
        - CRs with type bugfix receive bugfix constraints on all work items

    - id: hints-injection
      description: |
        Inject hints from CR features/tasks into WorkItem prompts.
      acceptance_criteria:
        - Chunker reads hints field from features and tasks
        - Hints are rendered as a HINTS section in the prompt template
        - HINTS section appears after TASK section, before CONSTRAINTS
        - If no hints, HINTS section is omitted entirely
        - Each hint is rendered as a bullet point

    - id: standards-index-injection
      description: |
        When building work-item prompts, the chunker reads the YAML frontmatter
        of every doc in .utopia/standards/ and injects a compact STANDARDS index
        section into the prompt. The index works like skill discovery via
        progressive disclosure: only lightweight metadata (id, description,
        tags, path) is always present, and the executor reads the full docs it
        judges relevant before implementing. This keeps the chunker
        deterministic while placing semantic relevance matching with the
        executor, who knows which files the task actually touches.
      acceptance_criteria:
        - Work-item prompts include a STANDARDS section when .utopia/standards/ contains at least one doc
        - The STANDARDS section lists each doc's id, description, tags, and file path
        - The STANDARDS section instructs the executor to read relevant standards docs from .utopia/standards/ before implementing
        - Only frontmatter metadata is injected into the prompt, never full doc content
        - No STANDARDS section is injected when .utopia/standards/ is missing or empty
        - Docs with unparseable frontmatter are skipped without failing the chunk operation

    - id: work-item-sizing
      description: |
        Before generating WorkItems, the chunker runs a single read-only
        agent over the whole document. The agent explores the codebase once
        and returns, for every feature, an assessment of whether it fits
        work_items.turn_budget and a split when it does not.

        One pass rather than one call per feature: exploration is amortised
        across all features, and the agent gains cross-feature context, so
        it can see that two features touch the same files and size both
        accordingly. Independent per-feature calls would re-explore the same
        repository and each be blind to the others.

        Splitting prefers partitioning the feature's existing acceptance
        criteria into bundles, which keeps every criterion traceable to the
        reviewed change request. Only when a single criterion is itself too
        large to partition may the sizer author sub-steps, and that
        escalation is recorded on the WorkItem so it is visible rather than
        silent.

        The sizer is read-only. It must reason about the change, never make
        it.
      acceptance_criteria:
        - The chunker invokes exactly one sizer agent per chunk operation, receiving all features in the document
        - The sizer is invoked with a read-only tool allowlist and cannot edit, write, or run mutating commands
        - The sizer receives work_items.turn_budget and assesses each feature against it
        - Features assessed as fitting the budget produce exactly one WorkItem, unchanged from current behaviour
        - Features assessed as exceeding the budget produce multiple WorkItems
        - A split that partitions existing criteria assigns every criterion of the feature to exactly one WorkItem, with none dropped or duplicated
        - Partitioned WorkItems record CriteriaOrigin as partitioned
        - The sizer only authors new criteria for a feature whose single criterion cannot be partitioned further
        - WorkItems with sizer-authored criteria record CriteriaOrigin as authored
        - Every produced WorkItem records SourceFeatureID naming the feature it came from
        - Chunk output reports each feature's sizing verdict and the number of WorkItems produced for it
        - A sizer invocation that fails or returns unparseable output falls back to one WorkItem per feature and reports the fallback
        - The sizer never merges two features into one WorkItem
