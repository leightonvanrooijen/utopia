features:
    - id: project-context-field
      description: |
        Config includes a project_context field - 1-2 sentences orienting
        AI assistants to the project's workflow and philosophy.
      acceptance_criteria:
        - Config struct has ProjectContext string field with yaml tag "project_context"
        - Init prompts "Project context (orient an AI to this project's workflow):"
        - Value is saved to .utopia/config.yaml under project_context key

    - id: init-rerunnable
      description: |
        Running utopia init on an existing project prompts only for missing
        config fields, preserving existing values.
      acceptance_criteria:
        - Init detects existing .utopia/config.yaml
        - Only prompts for fields that are empty/missing
        - Preserves all existing config values
        - Prints which fields were added vs skipped

    - id: configurable-artifact-paths
      description: |
        Allow users to configure where the specs, adrs, concepts, and domain
        folders live via an optional `paths` section in config.yaml. Each key
        defaults to its current location under .utopia/ when omitted, so
        existing projects continue to work without any config changes.
        Configured paths may point outside .utopia/ (e.g. docs/specs).
      acceptance_criteria:
        - config.yaml supports an optional `paths` section with keys `specs`, `adrs`, `concepts`, and `domain`
        - When the `paths` section or an individual key is omitted, the path defaults to the current location (.utopia/specs, .utopia/adrs, .utopia/concepts, .utopia/domain)
        - Relative paths are resolved from the project root; absolute paths are used as-is
        - All commands that read or write specs, adrs, concepts, or domain artifacts resolve the folder location from config instead of hardcoded .utopia/ paths
        - Existing projects with no `paths` config behave exactly as before (backward compatible)
        - If a configured directory does not exist, it is created when an artifact is first written to it
