id: model-configuration
title: model-configuration
created: "2026-03-23T10:09:13.522167+11:00"
updated: "2026-07-30T10:28:20.566175+10:00"
description: ""
features:
    - id: model-mapping
      description: |
        Validate model aliases and pass them through to the claude CLI unchanged.

        Utopia used to expand each alias into a dated model identifier before
        handing it to the CLI. That expansion is the reason the aliases broke: the
        CLI already resolves 'sonnet' and 'opus' to the current generation, so
        translating them into claude-sonnet-4-20250514 replaced a self-updating
        alias with a pin that silently expired when those models retired.

        Utopia stores no model identifiers. It validates that an alias is one it
        recognises, so a typo in config fails at load time rather than at the
        first Claude invocation, and then forwards the string. A full model
        identifier is also accepted and forwarded unchanged, so a caller who needs
        a specific pinned model can still have one - deliberately, rather than by
        accident.
      acceptance_criteria:
        - Invalid model name produces clear error message
        - Model resolution is centralized in a single function
        - A recognised alias is passed to the claude CLI unchanged rather than expanded to a model identifier
        - The recognised aliases are haiku, sonnet, opus and fable
        - A full model identifier is accepted and passed through unchanged, so a specific model can be pinned when that is wanted
        - No dated model identifier is stored anywhere in Utopia
        - An unrecognised value that is neither a known alias nor a plausible model identifier produces a clear error at load time rather than at first invocation

    - id: config-structure
      description: |
        Define the models section in .utopia/config.yaml with default and
        per-command overrides.

        Execution is no longer one role. The default executor, the
        escalated executor, the validators and the scoper are four roles
        with different cost profiles and different failure consequences, so
        each resolves its own model with a fallback chain rather than
        sharing one key.
      acceptance_criteria:
        - Config supports optional models section
        - models.default specifies fallback model for all commands
        - Per-command keys override the default (cr, harvest, execute, execute_escalated, scoper, validators, validator_router, discover, standards, refactor, shape, validator_create, validator_edit)
        - If models section is missing, sonnet is used as implicit default
        - If a command key is missing, models.default is used
        - Invalid model name in config produces clear error at load time
        - models.execute_escalated specifies the model used once execution escalates after a comprehension failure
        - models.scoper specifies the model used to rewrite a change request during scoping escalation
        - If models.execute_escalated is missing, opus is used
        - If models.scoper is missing, models.execute_escalated is used
        - models.execute_escalated and models.scoper resolve to a model at least as capable as models.execute, and a configuration that escalates downward produces a clear error at load time

    - id: cli-model-flag
      description: |
        Add --model flag to all Claude-invoking commands for runtime override.
      acceptance_criteria:
        - Flag is available on cr, harvest, execute, discover, standards, refactor, shape, validator create, validator edit commands
        - Flag accepts haiku, sonnet, or opus
        - Flag overrides config for that single invocation
        - Invalid flag value produces clear error before execution starts
        - Flag is optional, defaults to config value

    - id: cli-model-injection
      description: |
        Pass the resolved model and effort to the Claude CLI wrapper.

        Effort travels the same path as model - resolved by the caller from
        the role, threaded through the wrapper, appended as a flag. It is a
        second parameter on an existing route rather than a new mechanism.
      acceptance_criteria:
        - CLI struct accepts optional model and effort parameters
        - Model is passed to claude binary via --model flag
        - If no model specified, claude CLI uses its default
        - Model and effort flow through Prompt and SessionWithCapture methods
        - Effort is passed to claude binary via --effort flag
        - If no effort is specified, the flag is omitted and the claude CLI default applies

    - id: validator-config-structure
      description: |
        Extend validator config to support object format with path, model, and run.
      acceptance_criteria:
        - Validators can be specified as strings (backward compatible) or objects
        - Object format has path (required), model (optional), run (optional)
        - String format is equivalent to object with path and run=after-workitem
        - model in validator config overrides models.validators default
        - run in validator config specifies trigger (after-workitem, after-phase, on-demand)
        - run defaults to after-workitem if not specified
        - Mixed format allowed (some strings, some objects)

    - id: validator-file-format-update
      description: |
        Update validator file format to remove run field (now in config).
      acceptance_criteria:
        - Validator files contain id, allowed_tools, and prompt
        - run field in validator file is ignored (config takes precedence)
        - Existing validator files with run field continue to work (no error)
        - allowed_tools defaults to [Read, Glob, Grep] if not specified

    - id: validator-runner-model-support
      description: |
        Update validator runner to use per-validator model configuration.
      acceptance_criteria:
        - Runner accepts model configuration per validator
        - Each validator runs with its configured model
        - If validator has no model, uses models.validators from config
        - If models.validators not set, uses models.default
        - Model is passed to Claude CLI for each validator invocation

    - id: backward-compatibility
      description: |
        Ensure existing configs without models section continue to work.
      acceptance_criteria:
        - Config without models section uses sonnet for all commands
        - Validators as string array work with after-workitem trigger
        - No migration required for existing projects
        - No warnings for valid old-format configs
        - New features only activated when new config is present

    - id: effort-configuration
      description: |
        Each role resolves an effort level alongside its model, so
        reasoning depth is configured rather than left to the CLI
        default.

        Effort and model are separate levers with different economics.
        Raising the default executor's effort is the intuitive response
        to a failure and the wrong one: at the top of its effort range a
        cheaper model can cost more than the expensive model would have,
        for comparable quality. Escalating the model is therefore
        strictly cheaper than cranking effort, which makes the default
        executor's effort a fixed property of its role rather than a dial
        the loop turns when something fails.

        The consequence is a rule worth stating as a rule: no code path
        raises effort in response to a validation failure. Failures
        change which model runs, never how hard the cheap one tries.
      acceptance_criteria:
        - Config supports an optional effort section with per-role keys mirroring the models section
        - Effort accepts low, medium, high, xhigh or max, and any other value produces a clear error at load time
        - The default executor, escalated executor, validators and scoper each resolve their own effort level
        - Default effort is medium for the default executor, high for the escalated executor, medium for validators and high for the scoper
        - If a role's effort is missing, effort.default is used, and if that is missing the claude CLI default applies
        - No code path raises a role's effort in response to a validation failure, a retry, or an escalation
        - The default executor's effort is identical on a first attempt and on a mechanical retry
        - A --effort flag overrides the resolved effort for a single invocation, mirroring --model
