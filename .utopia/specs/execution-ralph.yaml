id: execution-ralph
title: Ralph Execution Loop
created: "0001-01-01T00:00:00+00:00"
updated: "2026-07-30T11:13:45.640454+10:00"
description: |
    The Ralph execution loop runs WorkItems produced by the chunker.

    Key characteristics:
    - Utopia controls the loop (not Claude stop hooks)
    - Fresh context each iteration
    - Retries until success or human intervention (Ctrl+C)
    - Optional max iterations as safety net
    - Sequential execution, resumes from where it left off

    Depends on: verification (for running verification commands)
domain_knowledge:
    - Each iteration is a fresh Claude context; state is rebuilt from git/files
    - The <COMPLETE> token distinguishes intentional completion from step-limit exits
    - Only inject failures from previous iteration (not accumulated history)
    - Human oversight assumed; user can Ctrl+C if loop is stuck
    - Backpressure via verification replaces explicit direction
    - Timeout applies to entire execution session, not per-WorkItem
    - Timeout timer starts when execution begins, not when each WorkItem starts
features:
    - id: ralph-loop
      description: |
        Core loop that runs a single WorkItem until completion.
      acceptance_criteria:
        - Loop invokes Claude Code via CLI (claude --print --prompt "...")
        - Loop checks Claude output for <COMPLETE> token
        - If no token, retry immediately (step limit or stuck)
        - If token present, run verification (via verification system)
        - If verification passes, mark WorkItem completed
        - If verification fails, capture output, rebuild prompt with failures, retry
        - Loop continues until success or max iterations (if configured)
        - Loop logs each iteration (attempt N, token found, verification result)

    - id: failure-injection
      description: |
        Inject failure output into prompt for retry iterations.
      acceptance_criteria:
        - First iteration has no PREVIOUS FAILURES section
        - Subsequent iterations include PREVIOUS FAILURES with verification output
        - Only failures from immediately previous iteration (not accumulated)
        - Failures are injected as raw text in code block
        - Failure injection includes instruction that failures must be fixed regardless of whether they were introduced by this work item

    - id: work-item-status
      description: |
        Track WorkItem status through execution.
      acceptance_criteria:
        - Status values are pending, in_progress, completed
        - Status persisted to .utopia/work-items/<spec-id>/<item-id>.yaml
        - Completed status includes iteration count
        - In-progress status includes current iteration count

    - id: sequential-executor
      description: |
        Execute WorkItems in order, one at a time.
      acceptance_criteria:
        - Loads WorkItems for a spec, sorted by Order
        - Skips items with status "completed"
        - Executes items sequentially (waits for completion before next)
        - Stops if max iterations reached on any item
        - Continues from first non-completed item on resume

    - id: execute-command
      description: |
        Add explicit criteria for committing work items when generated and
        cleanup commit after CR completion. Ensures full git history of the
        entire CR lifecycle without requiring manual user commits.
      acceptance_criteria:
        - Command is "utopia execute <spec-id>"
        - Command loads WorkItems from .utopia/work-items/<spec-id>/
        - Command prints progress (executing item N of M, iteration K)
        - Command prints when item completes
        - Command handles Ctrl+C gracefully (saves current state)
        - On max iterations, prints message and exits
        - Execute command accepts a spec or CR as input
        - Execute internally invokes the chunking strategy to produce WorkItems
        - Execute runs the produced WorkItems through the Ralph loop
        - Users only need to run a single command for the full flow
        - Execute command with no arguments lists available CRs from .utopia/change-requests/
        - List displays CR titles
        - User can select a CR interactively
        - Selected CR is passed to execution flow
        - Initiative phases execute continuously without stopping between phases
        - After a phase completes, execution automatically proceeds to the next phase
        - User can still Ctrl+C to stop at any time (existing behavior preserved)
        - Final message only appears after all phases complete (not between phases)
        - After all WorkItems for a CR complete successfully, automatically merge the CR into specs
        - Merge is performed as a separate git commit with message indicating it's a spec merge
        - Separate commit enables easy rollback if work needs to be retried (git revert)
        - Merge uses existing merge logic from unified-change-request-system
        - If merge fails, error is displayed but WorkItem completion state is preserved
        - 'After chunking generates WorkItems, stage and commit with message format ''chunk: <cr-id>'''
        - Chunk commit includes only the work item files generated by that chunk (not pre-existing items from other CRs)
        - After spec merge commit, create a cleanup commit that removes work items and CR file
        - 'Cleanup commit message format is ''cleanup: complete <cr-id>'''
        - Cleanup commit stages removal of .utopia/work-items/<spec-id>/ and .utopia/change-requests/<cr-id>.yaml
        - All commits are automated - user never needs to manually commit
        - utopia execute <name> resolves the target CR by first trying change-requests/<name>.yaml, then, when that is absent, the CR file whose basename with a leading numeric prefix (digits followed by an underscore) stripped equals <name>, so 'utopia execute reusable-core' finds '01_reusable-core.yaml'
        - A CR whose filename carries a numeric prefix is runnable both by its full filename (e.g. '06_ai-chat') and by its prefix-stripped name (e.g. 'ai-chat')
        - When more than one CR file resolves to the same requested name, the command reports an error listing the candidate files instead of silently choosing one
        - Work items are keyed by the CR's internal id, independent of any numeric filename prefix, so a file named 06_ai-chat.yaml with id ai-chat uses .utopia/work-items/ai-chat/ and is not re-chunked when run as '06_ai-chat'
        - The cleanup commit resolves the CR's actual on-disk filename, staging removal of a numeric-prefixed CR file (e.g. .utopia/change-requests/01_reusable-core.yaml) rather than a path reconstructed from the CR id

    - id: streaming-output
      description: |
        Stream Claude output in real-time during execution using --verbose flag.
      acceptance_criteria:
        - Claude CLI invoked with --verbose flag to show real-time output
        - Output streams to terminal as Claude works (user sees progress)
        - Output is still captured for completion token detection
        - Works with both stdout and stderr streams
        - Streaming does not interfere with Ctrl+C handling

    - id: timeout-flag
      description: Add --timeout flag that accepts duration in minutes
      acceptance_criteria:
        - Flag accepts a positive integer representing minutes (e.g., --timeout 30)
        - Flag is optional with no default (executions run indefinitely by default)
        - Invalid values (negative, zero, non-numeric) produce clear error message
        - Flag is added to the "utopia execute <spec-id>" command

    - id: timeout-trigger
      description: Trigger graceful shutdown when session timeout is reached
      acceptance_criteria:
        - Execution stops after specified minutes have elapsed from session start
        - Shutdown uses same code path as Ctrl+C (existing persistence mechanism)
        - In-progress WorkItem state is saved and can be resumed
        - Timer continues across WorkItem boundaries (not reset per item)

    - id: timeout-notification
      description: Notify user when timeout occurs
      acceptance_criteria:
        - Terminal displays clear message indicating timeout was reached
        - Message includes total session duration
        - Message indicates that progress was saved and can be resumed
        - Message differs from normal completion (user knows it was timeout, not success)

    - id: workitem-commit
      description: |
        Automatically create a git commit after each WorkItem completes verification.
        This provides atomic commits per WorkItem, making it easier to debug, review,
        and rollback specific changes.
      acceptance_criteria:
        - After a WorkItem passes verification, stage all changes with `git add -A`
        - 'Create a commit with message format ''workitem: <workitem-id>'' and CR title in body'
        - Commit happens before moving to the next WorkItem
        - If commit fails, log warning but continue execution (don't block on commit failure)
        - Works for both regular CRs and initiative phases

    - id: batch-execution
      description: |
        Execute all draft CRs in sequence with a single command.
        Instead of selecting one CR at a time, users can run all pending
        CRs in one batch operation.
      acceptance_criteria:
        - Command "utopia execute --all" runs all CRs in .utopia/change-requests/
        - CRs are executed in filename order; a leading numeric prefix on the CR filename (e.g. "1_", "2_") controls the execution sequence
        - Each CR goes through the full flow (chunk, execute, merge)
        - If a CR fails, execution stops and reports which CR failed
        - 'Progress shows "Executing CR N of M: <cr-title>"'
        - Summary at end shows how many CRs completed successfully
        - Numeric filename prefixes are compared numerically, so "2_" runs before "10_" regardless of zero-padding
        - CRs without a numeric prefix are executed after all prefixed CRs, in alphabetical order

    - id: rate-limit-handling
      description: |
        Detect Claude limit errors and respond appropriately to each kind.
        Rolling usage limits include a reset time in the message, so the loop
        waits until that time before retrying. The org monthly spend limit
        carries no reset time and no API exposes one, so the loop enters probe
        mode: it periodically retries a minimal Claude invocation and resumes
        work when a probe succeeds. Neither kind of limited attempt burns
        iterations.
      acceptance_criteria:
        - Detects rolling-limit reset patterns in Claude invocation stderr/stdout (legacy and current message formats)
        - Parses reset time with timezone awareness (e.g., "1am (Australia/Sydney)")
        - Calculates sleep duration until reset time plus 2 minute buffer
        - Prints message indicating rate limit hit and wait time (e.g., "Rate limit hit, waiting until 1:02am Australia/Sydney to resume...")
        - Sleeps until calculated time then retries the iteration
        - Rate-limited attempts do not count against max iterations limit
        - Falls back to 10 minute retry delay if time parsing fails
        - Detects "You've hit your org's monthly spend limit" pattern in Claude invocation stdout/stderr
        - On spend-limit detection, prints a message explaining the org monthly spend limit was hit, that no reset time is available, and that the loop will probe periodically until usage is restored
        - In probe mode, the loop invokes a minimal Claude prompt (claude --print with a trivial prompt) every 30 minutes to check whether the limit has lifted
        - Each probe attempt is logged with a timestamp and its outcome (still limited or recovered)
        - When a probe succeeds, the loop prints a recovery message and resumes the interrupted iteration with a normally rebuilt prompt
        - Spend-limited attempts and probe attempts do not count against max iterations limit
        - Ctrl+C during a probe wait triggers the existing graceful shutdown path (state saved, resumable)
        - Session --timeout continues to elapse during probe mode and triggers graceful shutdown if reached
        - Detects the newer rolling-limit message formats "You've hit your session limit · resets {time}" and "You've hit your Opus limit · resets {time}" in addition to the legacy "Limit reached · resets {time} ({timezone})" format
        - When a rolling-limit message omits the timezone, the reset time is interpreted in the system local timezone

    - id: lifecycle-commits
      description: |
        Work items and change requests are tracked in git across their full lifecycle.
        After chunking, the generated work item files are committed. After a CR is merged
        and cleaned up, the deletion of the CR file and its work item files is committed.
        Lifecycle commits must be robust: a path that no longer exists on disk (already
        deleted, staged as a deletion) must not abort the commit, and commit failures are
        logged as warnings without blocking execution.
      acceptance_criteria:
        - After chunking a CR, the work item files under .utopia/work-items/<cr-id>/ are committed with message 'chunk:<space><cr-id>'
        - After merge cleanup, the deletion of .utopia/change-requests/<cr-id>.yaml and .utopia/work-items/<cr-id>/ is committed with message 'cleanup:<space>complete <cr-id>'
        - The cleanup commit succeeds even though the work-items directory has already been removed from disk (deletions of tracked files are staged; a non-matching pathspec does not cause a fatal git error)
        - Staging paths that are gitignored or nonexistent does not abort the commit of the remaining paths
        - The project .gitignore no longer excludes .utopia/work-items/
        - A full 'utopia execute' run on a clean repo produces no 'git add failed' or 'Cleanup commit warning' output and leaves the working tree clean
        - Initiative phase cleanup commits work the same way as regular CR cleanup commits

    - id: queue-watch-daemon
      description: |
        A long-running daemon mode that watches the change-request queue and
        executes work as it becomes ready, instead of the one-shot execute
        command. Surfaced as `utopia execute run`.

        Readiness is status-based: a change request is ready when its status
        is `approved`. Detection is by polling - the daemon re-scans
        .utopia/change-requests/ from disk on a fixed interval, so a CR
        approved by any process (a human editing YAML, another utopia
        invocation) is picked up without in-process coordination. Ready CRs
        are executed strictly one at a time, because the Ralph engine is
        single-goroutine and parallel CRs would collide on git.

        Picking up a CR chunks it, which transitions it to `in-progress`, so
        it leaves the ready set and is not re-processed on the next scan.
      acceptance_criteria:
        - Exposes a `run` subcommand under execute (utopia execute run) that does not exit after one CR
        - Accepts an --interval flag (seconds between queue scans) defaulting to 10, and rejects a non-positive interval
        - Accepts a --model flag consistent with `utopia execute`
        - On each scan, treats a change request as ready when and only when its status is `approved` (draft, in-progress, and complete are left alone)
        - Executes each ready CR via the same path as `utopia execute <cr-id>` (chunk if needed, run the Ralph loop, then auto-merge into specs)
        - Executes ready CRs sequentially, never concurrently
        - When the queue has nothing ready, idles until the next scan rather than exiting
        - Ctrl+C (SIGINT/SIGTERM) stops the daemon cleanly; an in-flight CR saves its state and is resumable with `utopia execute <cr-id>`
        - A transient queue-scan read error is logged and retried on the next tick rather than killing the daemon
        - The failure policy for a CR that fails to execute is isolated in one place and documented, with a default that keeps the daemon watching (logs and skips the failed CR rather than exiting)

    - id: step-timing-logs
      description: |
        The execution loop measures and logs the wall-clock duration of each
        expensive step it brackets - the Claude invocation, the verification
        command, and each validator run - so operators can see where time goes
        per iteration. On work-item completion the loop emits a summary that
        breaks the total wall-clock time down by step category.

        Durations augment the existing stdout status lines rather than replacing
        them, keeping the human-readable log format. Timing is captured in the
        loop itself (start marker before the step, elapsed after it), so the
        Claude and validator agents are timed as black-box calls without
        changing their APIs.
      acceptance_criteria:
        - Each Claude invocation logs its elapsed wall-clock time when it completes
        - Each verification run logs its elapsed wall-clock time when it completes
        - Each validator run logs its elapsed wall-clock time labelled with the validator name
        - On work-item completion a summary line reports the total wall-clock time and a per-category breakdown across Claude invocation, verification, and validators
        - Durations are rendered in a human-readable form such as 1.2s or 3m04s
        - Existing status log lines are preserved - timing is appended to them, not substituted for them

    - id: run-transcript-persistence
      description: |
        Persist each WorkItem's Ralph execution run as a durable, harvestable artifact so the implementation decisions made during execution are no longer lost when the loop moves on. The run transcript reuses the streamed Claude output already captured for completion-token detection.
      acceptance_criteria:
        - Each WorkItem execution writes a run transcript to .utopia/runs/<cr-id>/<workitem-id>.yaml
        - The run transcript captures the streamed Claude output already collected for <COMPLETE> token detection
        - The run record includes workitem_id, cr_id, spec_ref, iteration count, completed_at, and outcome (completed or failed)
        - The run transcript is committed as part of the same commit as its WorkItem (workitem-commit)
        - The project .gitignore does not exclude .utopia/runs/
        - Failure to write a run transcript logs a warning but does not block the execution loop
        - Each run record can be joined back to its originating CR and conversation via cr_id and workitem_id

    - id: work-item-turn-budget
      description: |
        Add a configurable per-iteration turn ceiling for work-item execution,
        expressed as work_items.turn_budget in .utopia/config.yaml.

        The budget is a single shared knob with two enforcement postures. The
        executor treats it as a hard cap (passed to the Claude CLI as
        --max-turns). The chunker later treats the same value as a sizing
        target (phase 2). One number therefore governs both how large work
        items are cut and how much a single iteration may spend, so tuning
        cost means changing one value rather than keeping two in sync.

        It lives in config rather than as a CLI flag because `chunk` and
        `execute` are separate commands; a flag on `execute` would be
        invisible to the chunker. It is named after work items rather than
        after either command because it belongs to neither.
      acceptance_criteria:
        - Config has an optional work_items section with a turn_budget integer field
        - work_items.turn_budget defaults to 40 when the section or field is omitted
        - A turn_budget of zero or a negative value is rejected at config load with an error naming the field
        - Config files with no work_items section continue to load without error

    - id: turn-cap-enforcement
      description: |
        Pass work_items.turn_budget to the Claude CLI as --max-turns so a
        single iteration cannot run unbounded. Today no turn ceiling exists
        anywhere: baseArgs() passes only --permission-mode, --allowedTools
        and --model, so an iteration can burn 100+ turns before producing
        anything.

        --max-turns is a real flag on Claude Code 2.1.220, but it is hidden
        from --help; it was confirmed by option-parse probe against a bogus
        control flag. Its exhaustion behaviour was measured rather than
        assumed, and it does NOT slot into the existing no-token path as a
        naive reading suggests:

          exit code: 1 (non-zero)
          stdout:    "Reached max turns (N)"
          stderr:    empty

        A non-zero exit makes cmd.Output() return an error, so cli.Prompt
        returns an error and the loop takes the generic invocation-failed
        branch at ralph.go:298, NOT the no-token branch at 305.

        That branch's handling of failure state is CORRECT and must be left
        alone. It does not clear LastFailureOutput, and it should not.
        LastFailureOutput is written in exactly one place (ralph.go:378) from
        verification output when verification fails, so it means "the last
        known verification result, and it was a failure". A turn-capped
        iteration runs no verification, so nothing supersedes that value - it
        is the most recent evidence in existence, not stale data. Carrying a
        failure forward that the capped iteration happened to fix costs a few
        turns of the executor checking and moving on. Dropping a failure that
        is still live costs an entire fresh iteration that does not know
        verification ever failed, and may converge on <COMPLETE> and fail the
        same way. Cheap redundancy beats expensive blindness.

        What IS wrong on that branch is the logging. It reports "Claude
        invocation failed", indistinguishable from a crash, an auth error, or
        the monthly-spend-limit case that also exits 1. Turn exhaustion is
        normal, expected operation and must not read as breakage.

        So this needs explicit detection before the error branch - not to
        change the retry behaviour, but to classify and report it correctly.
        Detection follows the established DetectRateLimit / DetectSpendLimit
        pattern that already inspects stdout and stderr for exactly this class
        of CLI-signalled condition.

        Separately, and deliberately excluded here: no message about turns,
        limits, or the cap may reach the retry prompt. That is a scarcity
        signal - it says hurry, and it invites shortcuts. PREVIOUS FAILURES is
        task information, which is a different thing and is welcome. Partial
        work survives uncommitted in the working tree and the next fresh
        iteration rebuilds state from git and files, so a capped iteration is
        a ratchet rather than wasted spend.
      acceptance_criteria:
        - Work-item execution invokes the Claude CLI with --max-turns set to the configured work_items.turn_budget
        - A DetectTurnExhaustion function reports whether a PromptResult's stdout or stderr indicates the turn cap was reached
        - Turn exhaustion is detected before the generic invocation-failed branch, so a capped iteration never logs as a Claude invocation failure
        - A turn-exhausted iteration is logged as expected operation, distinctly from both invocation failures and no-token retries
        - A turn-exhausted iteration preserves LastFailureOutput unchanged, so a still-unverified failure survives into the retry
        - No message referencing turns, turn limits, or the cap is injected into any retry prompt
        - A turn-exhausted iteration counts against max_iterations
        - Verification is not run for an iteration that exhausted the turn cap
        - A non-zero exit that is not turn exhaustion still takes the existing invocation-failed path unchanged
