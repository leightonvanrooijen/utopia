updated: "2026-07-30T19:57:07.646858+10:00"
description: ""
features:
    - id: attempt-usage-capture
      description: |
        Claude invocations from the execution loop ask the CLI for structured
        output and read the usage it reports, instead of taking prose and
        discarding the accounting.

        The resolved model id is recorded rather than the alias passed to --model,
        because model-mapping remaps aliases over time and a comparison keyed on
        "opus" would silently pool two different models.

        Cost needs a caveat baked into the data, not the reader. Under
        auth-mode-subscription no per-token charge is incurred, so the CLI's
        dollar figure is a list-price equivalent rather than money spent. Tokens
        are real under both auth modes; dollars are only real under
        auth-mode-api-key.
      acceptance_criteria:
        - Every Claude invocation the execution loop makes requests structured output from the claude CLI and parses the terminal result object for usage
        - Each attempt records resolved model id, effort, input tokens, output tokens, cache-read tokens, cache-creation tokens, turn count, wall-clock duration and reported cost
        - The recorded model id is the model the CLI resolved to, not the alias passed to --model
        - A recorded cost carries whether it was produced under api-key auth or subscription auth, and subscription costs are marked as list-price estimates rather than amounts charged
        - Verbose mode still streams assistant text to the operator in real time while usage is captured
        - An attempt whose usage cannot be parsed is recorded with usage marked unavailable and does not fail the work item
        - Unavailable usage is distinguishable from zero usage in the recorded form, asserted by a test
        - Attempts made by validators and by discovery are out of scope for this feature, and the loop does not error when they report no usage

    - id: run-record-usage-persistence
      description: |
        Captured usage is written into the work item's existing run record, one
        entry per iteration, so the model that did the work sits next to what that
        attempt cost and whether it worked.

        Run records are committed to git, so history becomes the time series and
        no telemetry backend is involved.
      acceptance_criteria:
        - Each attempt's usage is appended to the work item's run record at .utopia/runs/<cr-id>/<workitem-id>.yaml as an ordered list with one entry per iteration
        - Each entry carries iteration index, resolved model, effort, outcome, and the attempt's failure class when the attempt failed
        - Per-work-item and per-change-request totals for tokens and cost are derivable from the entries without re-reading the transcript
        - Usage entries are written using the yaml-formatting package so the record stays consistent with other Utopia YAML
        - Usage is persisted in the same commit as its work item, matching workitem-commit behaviour
        - A run that aborts or halts as needs_human persists the usage of attempts already completed
        - Failure to persist usage logs a warning and does not block the execution loop
        - Existing run records without usage entries remain readable, and consumers treat a missing list as unknown rather than as zero spend

    - id: model-comparison-report
      description: |
        A report command aggregates the persisted usage entries into a comparison
        of model and effort choices, so the operator can see which model finishes
        work, in how many iterations, and at what spend per finished work item.

        A second view answers the escalation question directly: for change
        requests that escalated, what was spent and achieved before the escalation
        versus after it.

        The report states its own limits. The comparison is observational, so
        escalated change requests are the harder ones by selection and a raw
        model-versus-model row is confounded. Attempts with unavailable usage are
        counted and shown, never folded into a total as zero.
      acceptance_criteria:
        - utopia report models reads persisted run records and prints one row per model and effort pair
        - Each row carries attempts, work items completed, first-pass rate, mean iterations to completion, total tokens and cost per completed work item
        - utopia report models --by spec and utopia report models --by cr_type group the same rows by that dimension
        - utopia report escalations prints one row per escalated change request carrying the model and spend before escalation, the model and spend after it, and the final outcome
        - utopia report escalations prints an aggregate line giving marginal cost and marginal completion rate of escalating
        - Both reports print the observational caveat that escalated change requests are selected for difficulty, so the comparison is not a controlled result
        - Attempts whose usage was unavailable are counted in a separate column and excluded from token and cost totals rather than summed as zero
        - Costs recorded under subscription auth are shown as list-price estimates and are not summed together with api-key costs into a single figure
        - A repository with no run records prints a message saying so and exits zero
        - Reports read only persisted run records and make no Claude call
