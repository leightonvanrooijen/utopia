id: connectors
title: connectors
created: "2026-07-27T18:56:05.450266+10:00"
updated: "2026-07-30T20:08:26.401481+10:00"
description: ""
features:
    - id: connector-config
      description: |
        Users register connectors in project config. Each entry names the connector,
        lists the lifecycle events it subscribes to, the command to execute, and its mode.
      acceptance_criteria:
        - Config has an optional connectors array
        - Each entry has name (string), on (list of lifecycle event names), command (string), and optional mode
        - mode is one of gating or notify, defaulting to notify
        - Each entry has an optional timeout field (duration string)
        - Config validation rejects unknown event names in on
        - Config validation rejects mode gating on events where gating has no semantics (workitem-committed, phase-completed, execution-completed, execution-failed)

    - id: connector-runner
      description: |
        Executes connector commands when their subscribed events fire. The command
        receives the event payload as JSON on stdin plus UTOPIA_EVENT, UTOPIA_CR_ID,
        and UTOPIA_PROJECT_DIR environment variables, making connectors writable in
        any language that can read stdin and parse JSON.
      acceptance_criteria:
        - When an event fires, all connectors subscribed to it run sequentially in config order
        - The connector process receives the full event payload as JSON on stdin
        - The connector process receives UTOPIA_EVENT, UTOPIA_CR_ID, and UTOPIA_PROJECT_DIR environment variables
        - Commands run with the project directory as working directory
        - Connector stdout and stderr are captured
        - A connector exceeding its timeout is killed and treated as failed

    - id: connector-gating-mode
      description: |
        Gating connectors block loop progression using git-hook semantics - exit code 0
        means proceed, non-zero means block. What blocking means depends on the event
        where the gate sits.
      acceptance_criteria:
        - A gating connector exiting 0 lets the loop proceed unchanged
        - A gating connector exiting non-zero on execution-started or workitem-started aborts the run with the connector's stdout in the error
        - A gating connector exiting non-zero on workitem-verified injects its stdout as feedback into the next loop iteration and prevents the work item commit
        - A gating connector exiting non-zero on phase-verified injects its stdout as feedback into an after-phase fix iteration and prevents the after-phase commit
        - A gating connector timeout is treated as a non-zero exit

    - id: connector-notify-mode
      description: |
        Notify connectors are fire-and-forget side effects. Failures are logged and
        never block or fail the run.
      acceptance_criteria:
        - A notify connector exiting non-zero does not stop the loop or change the run result
        - Notify connector failures are logged with the connector name, exit code, and captured output
        - A notify connector timeout is logged and does not block the run

    - id: subscription-engine
      description: |
        Internal launch/join/abort engine underneath the connector dispatcher.
        A subscription binds three verbs to lifecycle events: launch (spawn the
        process when this event fires), join (block at this event and collect
        the exit code), and cancel (kill the in-flight run if this event fires).
        Each launched run is tracked as a handle walking a state machine:
        running -> joined | cancelled | drained.

        The user-facing config surface is unchanged - mode gating/notify compile
        down to engine terms (gating = launch and join on the same event,
        notify = launch only). The engine's generality is internal.

        Depends on the connectors-plugin-system CR being merged first.
      acceptance_criteria:
        - A subscription carries a launch event, an optional join event, optional cancel events, a timeout, and an action
        - Emitting an event processes subscriptions in fixed pass order - cancel in-flight handles first, then launch new ones, then join
        - A connector with mode notify compiles to a subscription with launch only and no join
        - A connector with mode gating compiles to a subscription with launch and join on the same event, producing identical gating behavior to before
        - Cancelling a handle sends SIGTERM to the process group, then SIGKILL after a grace period
        - Joining a handle blocks until process exit and captures exit code and stdout
        - A handle exceeding its timeout is killed and its outcome recorded as failed
        - When a handle is cancelled, an action error that was caused by the cancellation (the context being cancelled, or a subprocess killed by the SIGTERM/SIGKILL the cancellation sent) is reported as a cancellation and is not surfaced as a connector failure or error message
        - A cancellation resolution log line does not include a subordinate error string that reads like a genuine failure (for example the git-diff-killed message seen when verification failure cancels an after-workitem validator)

    - id: speculative-events
      description: |
        Two additional lifecycle events enabling speculative execution - starting
        slow work before its gate point and killing it if the gate becomes moot.
      acceptance_criteria:
        - workitem-completion-claimed fires when the completion token is found, before verification runs
        - workitem-verification-failed fires when verification fails for an iteration
        - Both events carry the standard workitem-scoped payload including work_item_id and iteration_count
        - Notify connectors may subscribe to both events via config
        - Config validation rejects mode gating on both events, consistent with the existing rejection rule for events without gating semantics

    - id: handle-resolution-ledger
      description: |
        Every launched handle must resolve through exactly one door - joined,
        cancelled, or drained. The run cannot exit while any handle is unresolved.
        No orphaned processes, no silently dropped outcomes.
      acceptance_criteria:
        - Every launched handle resolves as exactly one of joined, cancelled, or drained
        - When the execution loop ends, unresolved handles are drained - awaited up to their remaining timeout, then killed
        - Each resolution is logged with connector name, resolution type, exit code, and captured output
        - After utopia execute returns, no connector child processes remain running
