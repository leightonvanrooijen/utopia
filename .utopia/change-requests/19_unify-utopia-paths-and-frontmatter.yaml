id: 19_unify-utopia-paths-and-frontmatter
type: refactor
title: Give the .utopia layout and its frontmatter format one owner each
status: in-progress
tasks:
    - id: one-frontmatter-parser
      description: |
        The markdown frontmatter format is parsed by three hand-rolled copies in
        store.go - LoadConceptDoc (store.go:992-1003), the standards listing loop
        (store.go:1071-1081) and LoadValidator (store.go:1233-1244). Each repeats
        the same shape: HasPrefix on "---\n", Index for "\n---", then two magic
        offsets of 4 to skip the delimiters.

        Current behavior: the three copies agree today, which is precisely what
        makes them dangerous - a fix to the delimiter handling in one is
        invisible to the other two, and the literal 4s encode the delimiter
        length at three sites that no longer mention the delimiter.

        Expected behavior: one parser splits a document into raw frontmatter and
        body, and the three callers unmarshal that frontmatter into their own
        struct. Same accepted inputs, same rejected inputs, same errors.
      acceptance_criteria:
        - All existing tests pass unchanged, including internal/store_test.go
        - One function owns splitting a document into frontmatter and body, and the three sites in store.go call it
        - Documents that parse today still parse to byte-identical frontmatter and body
        - Documents that are rejected today are still rejected, with the same error text at each of the three call sites
        - The literal offsets that skip the delimiters appear once, in the shared parser, and are derived from the delimiter rather than written as bare 4s
        - Each caller still unmarshals into its own frontmatter struct - the shared parser does not know about ConceptDoc, standards metadata or Validator
        - A test covers the shared parser directly, including a document with no frontmatter, an unterminated frontmatter block, and an empty body
      hints:
        - The three sites are internal/store.go:992 (LoadConceptDoc, declared at 981), internal/store.go:1071 (inside ListStandardsDocs) and internal/store.go:1233 (LoadValidator, declared at 1222)
        - validatorFrontmatter is declared at internal/store.go:1208 - it stays as-is, only the splitting moves
        - Check the two offsets carefully before extracting - bodyStart is `4 + endMarker + 4` at store.go:1003 and store.go:1244, and the standards loop at store.go:1071 may not compute the body at all. Preserve each caller's existing behavior rather than unifying it
    - id: one-utopia-layout
      description: |
        The .utopia directory layout is rebuilt from string literals in 34
        non-test files - 129 references in total. `filepath.Join(projectDir,
        ".utopia")` alone is written out at internal/cli/init.go:278,
        internal/cli/root.go:158 and :273, internal/validators/delete.go:19,
        internal/validators/edit.go:115, internal/ralph/ralph.go:121,
        internal/ralph/ratelimit.go:319 and more, and deeper paths such as
        `filepath.Join(projectDir, ".utopia", "work-items", crID)`
        (internal/cli/execute.go:758) are built inline wherever they are needed.

        A helper already exists - internal/discover/discover.go:43 returns
        exactly this path - and nothing outside its own package calls it.

        Current behavior: the on-disk layout is knowledge held by 34 files. There
        is no single place that answers "where do work items live", so moving or
        renaming any subdirectory means finding every literal.

        Expected behavior: one package owns the layout and exposes a function per
        location. Every caller asks it. The resolved paths are identical, so no
        file moves and no on-disk layout changes.
      acceptance_criteria:
        - All existing tests pass unchanged, and no fixture or golden file moves on disk
        - One package owns the .utopia layout and exposes a named accessor for each location currently built inline - the root, specs, change-requests, work-items, runs, validators, standards, concepts, domain, drafts, notes and conversations
        - Every resolved path is byte-identical to the path the current code produces for the same inputs, including separator handling on the standards listing which uses filepath.ToSlash today
        - The string literal ".utopia" appears only inside the owning package, except where it names a directory to skip during traversal
        - internal/discover/discover.go:43 is replaced by a call to the shared accessor rather than left as a second definition
        - The accessors take the project directory explicitly - no package-level mutable state holding the current project
        - go build ./... and go vet ./... stay clean
      hints:
        - Count before and after with `grep -rn "\.utopia" --include="*.go" internal cmd | grep -v _test.go` - 129 matches across 34 files today
        - internal/discover/discover.go:43 is the existing unused helper and shows the intended shape
        - Two traversal sites at internal/discover/collect.go:80 and :267 compare a directory name against ".utopia" to skip it - those are a name check, not a path build, and should keep using a shared constant rather than an accessor
        - internal/store.go:1087 uses filepath.ToSlash on the standards path - that behavior is observable in the stored metadata and must be preserved exactly
        - Several sites pass the .utopia directory to WithAuth (internal/ralph/ralph.go:121, internal/ralph/ratelimit.go:319, internal/validators/create.go:107, internal/validators/runner.go:107, internal/validators/edit.go:151) - these all want the same root accessor
        - Do this change request before the internal-root package split - the split will move store.go and claude.go, and rebasing 129 call sites across that move is avoidable work
