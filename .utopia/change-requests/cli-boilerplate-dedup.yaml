    - id: update-init-command
      description: |
        Update internal/cli/init.go - NOTE: init is special because it should NOT
        check if .utopia exists (it creates it). Use a simpler helper or keep
        minimal inline code. Consider adding ResolveProjectDir that only resolves
        path without existence check.
      acceptance_criteria:
        - init.go updated appropriately (may need different helper)
        - init still works on non-initialized projects
        - Behavior is unchanged
        - Build succeeds
    - id: verify-all-commands
      description: |
        Run all commands to verify they still work correctly after refactoring
      acceptance_criteria:
