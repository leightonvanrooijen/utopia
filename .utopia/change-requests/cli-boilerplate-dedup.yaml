id: cli-boilerplate-dedup
type: refactor
title: Deduplicate CLI project resolution boilerplate
status: in-progress
tasks:
    - id: add-resolve-project-helper
      description: |
        Add a ResolveProject helper function to root.go that handles the common
        pattern of resolving project path, checking .utopia exists, and creating store.

        The helper should:
        - Take *cobra.Command as input
        - Return (projectDir, utopiaDir string, store *YAMLStore, err error)
        - Handle path resolution with filepath.Abs
        - Check .utopia directory exists
        - Create and return the YAMLStore

        Add to internal/cli/root.go
      acceptance_criteria:
        - ResolveProject function exists in root.go
        - Function returns projectDir, utopiaDir, store, and error
        - Function checks .utopia exists and returns clear error if not
        - Build succeeds
    - id: update-status-command
      description: |
        Update internal/cli/status.go to use ResolveProject helper
      acceptance_criteria:
        - status.go uses ResolveProject instead of inline boilerplate
        - Behavior is unchanged
        - Build succeeds
    - id: update-execute-command
      description: |
        Update internal/cli/execute.go to use ResolveProject helper
      acceptance_criteria:
