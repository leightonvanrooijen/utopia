id: fix-prefixed-cr-shadow-file-on-save
type: bugfix
title: Stop saving a shadow copy of prefix-named CRs, which defeats post-merge deletion and re-runs completed work
status: in-progress
tasks:
    - id: make-save-change-request-prefix-aware
      description: |
        Fix CR persistence to match spec unified-change-request-system, feature cr-lifecycle,
        specifically the criterion:

          "Post-merge deletion removes the CR's actual on-disk file even when its filename
           carries a numeric prefix (deletes 01_reusable-core.yaml, not a path reconstructed
           as reusable-core.yaml)"

        Current behavior: every read path is prefix-aware, but the write path is not.
        SaveChangeRequest always writes change-requests/<id>.yaml, so any status mutation
        on a prefix-named CR forks a second, un-prefixed shadow file with the same id.

        CleanupAfterMerge then saves before it deletes. Setting status to complete creates
        the canonical shadow, and because ChangeRequestPath resolves a canonical filename in
        preference to a prefixed one, the subsequent delete removes the shadow it just
        created. The real prefixed file survives, still carrying a stale in-progress status.

        Consequences observed downstream:
        - The cleanup commit stages a path that was never deleted, so the commit records no
          CR removal at all.
        - ListChangeRequests applies no status filter, so the surviving orphan is picked up
          by "utopia execute --all". Its work-items directory was deleted, so it is re-chunked
          from scratch, re-executed, and re-merged into specs that already contain its changes.
        - A numeric prefix sorts first, so the orphan re-runs ahead of real work every time.

        The same shadow-forking also happens at chunk time, independently of merge, when the
        status is set to in-progress.

        Expected behavior: saving a change request that already exists on disk updates that
        file in place, whatever its filename. A canonical <id>.yaml is used only when the CR
        is genuinely new. Post-merge deletion then removes the real file, and no orphan
        survives to be re-executed.

        Root cause is the non-prefix-aware write path rather than the save/delete ordering in
        CleanupAfterMerge. Fixing the write path also closes the chunk-time leak, which
        reordering would not.
      acceptance_criteria:
        - Saving an existing change request whose filename carries a numeric prefix updates that file in place and creates no additional file
        - Saving a change request that does not yet exist on disk writes the canonical change-requests/<id>.yaml
        - After a successful merge of a prefix-named CR, no un-prefixed file with the same id exists anywhere in .utopia/change-requests/
        - After a successful merge of a prefix-named CR, the prefixed file itself is deleted
        - The cleanup commit records the deletion of the prefixed CR file, not an empty change set
        - Setting a prefix-named CR to in-progress at chunk time updates the prefixed file and creates no shadow copy
        - An id that strip-matches more than one file is reported as ambiguous on save, consistent with how ChangeRequestPath already reports it on read, rather than silently choosing one
        - A regression test reproduces the full merge sequence including the status save that precedes deletion, and asserts no orphan file remains
        - A regression test covers the chunk-time status update on a prefix-named CR
        - Running "utopia execute --all" after a prefix-named CR has been merged does not re-chunk or re-execute it
      spec: unified-change-request-system
      feature_id: cr-lifecycle
      hints:
        - Root cause is internal/store.go:301-303, where SaveChangeRequest joins change-requests/<id>.yaml directly instead of routing through ChangeRequestPath
        - ChangeRequestPath at internal/store.go:392-399 already implements the resolution and ambiguity reporting you need; note that it prefers a canonical filename, which is exactly what makes the shadow win
        - The merge sequence is internal/cli/merge.go:705 (resolve real path), then CleanupAfterMerge at merge.go:735-745 which saves at line 738 and deletes at line 743
        - The stale comment at internal/cli/merge.go:700-704 asserts the false invariant that deletion resolves the same path as the earlier resolve; update it once the fix lands
        - ChangeRequestPath returns a NotFoundError for a new CR, so Save must treat that as "write canonical" rather than propagating the error
        - The existing test at internal/cli/execute_commit_test.go:97-108 claims to mirror AutoMergeCR but omits the SaveChangeRequest step, which is precisely the step that flips resolution - that omission is why this shipped green
        - The chunk-time save is at internal/cli/execute.go:551-553
        - Consumers that re-run orphans are ListChangeRequests at internal/store.go:448-478 (no status filter) and runExecuteAll at internal/cli/execute.go:250-259; the daemon path readyChangeRequests at internal/cli/execute_run.go:69-77 is unaffected because it only selects approved CRs
