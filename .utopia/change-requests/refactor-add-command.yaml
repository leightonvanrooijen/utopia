id: refactor-add-command
type: feature
title: Add utopia refactor command for non-spec codebases
status: draft
changes:
  - operation: add
    spec: refactor
    spec_metadata:
      title: Refactor Workflow
      description: |
        A streamlined workflow for executing refactors on codebases that don't
        have specs yet. Uses the existing CR infrastructure with a specialized
        prompt that focuses only on refactor tasks.
    feature:
      id: refactor-command
      description: |
        Command `utopia refactor` launches a Claude session with a refactor-focused
        prompt. The prompt only teaches the refactor CR format (type: refactor with
        tasks array) and guides users toward behavior-preserving code improvements.

        Reuses existing CR infrastructure:
        - CR validation (domain.ValidateChangeRequest)
        - CR storage (.utopia/change-requests/)
        - Git commit logic (GitCommitCR)
        - Conversation capture (saveConversation)
        - Execution via `utopia execute`
      acceptance_criteria:
        - Command `utopia refactor` launches a Claude session
        - System prompt only describes refactor CR format (no feature/enhancement/removal/bugfix/initiative)
        - System prompt focuses on behavior preservation and scope identification
        - System prompt guides toward testable acceptance criteria
        - Generated CRs are saved to .utopia/change-requests/ (same as utopia cr)
        - Generated CRs use type refactor with tasks array
        - CR validation runs after session ends (reuses validateChangeRequests)
        - Valid CRs are auto-committed (reuses GitCommitCR)
        - Conversation transcript is captured (reuses saveConversation)
        - Command works in codebases without existing Utopia specs
        - No spec context is injected into the prompt (unlike utopia cr)
      hints:
        - Follow the pattern in internal/cli/standards.go for standalone command structure
        - Reuse helper functions from internal/cli/cr.go (validateChangeRequests, GitCommitCR, saveConversation)
        - The prompt should be similar in structure to crSystemPrompt but stripped down to only refactor type
