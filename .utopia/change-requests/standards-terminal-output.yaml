id: standards-terminal-output
type: refactor
title: Conform internal/cli to the terminal-output standard via a shared ui package
status: in-progress
tasks:
    - id: create-ui-package
      description: Create the internal/cli/ui package defined by the terminal-output standard - a Printer wrapping cobra's out/err writers, glyph constants (Success, Failure, Warning, Bullet, ConfidenceGlyph), computed Banner/Rule renderers, a shared Progress type (promoted from discover.go's discoverProgress), and a shared summary renderer replacing the near-duplicate printers in discover.go
      acceptance_criteria:
        - internal/cli/ui exists with Printer, glyph constants, Banner/Rule (computed via strings.Repeat, no frozen literals), Progress, and summary renderer
        - ui package has its own unit tests asserting rendered output
        - All existing tests pass
      hints:
        - Follow the reference implementation in .utopia/standards/terminal-output.md (Examples section)
        - Promote discoverProgress from internal/cli/discover.go into ui/progress.go
        - The two near-duplicate summary printers are printDiscoverySummary and printDomainDiscoverySummary in discover.go
    - id: route-output-through-writers
      description: Replace all package-level fmt.Print* calls in internal/cli command files (~565 call sites) with ui.Printer over cmd.OutOrStdout()/cmd.ErrOrStderr(), routing results to stdout and diagnostics (progress, warnings) to stderr
      acceptance_criteria:
        - Zero package-level fmt.Print/Printf/Println calls remain in internal/cli command files (LLM prompt-template string content is exempt per the standard)
        - Message content and exit codes are unchanged; only stream routing (warnings/progress to stderr) and glyph unification may differ, as mandated by the standard
        - Warnings and progress output go to stderr; pipeable results stay on stdout
        - All existing tests pass
      hints:
        - Construct ui.NewPrinter(cmd.OutOrStdout(), cmd.ErrOrStderr()) at the top of each RunE
        - 'Known stdout-polluting warning: cr.go:491 "⚠ Failed to commit CR"'
        - Verify with grep -rE 'fmt\.Print(f|ln)?\(' internal/cli/*.go
    - id: dedupe-banners-and-glyphs
      description: Replace hardcoded banner/rule string literals and copy-pasted glyph logic (confidence icon switches, mixed bullet characters) with the shared ui vocabulary
      acceptance_criteria:
        - No hardcoded ═══/─── rule literals remain in command files; banners render via ui.Banner with computed width
        - Confidence glyph logic exists once (ui.ConfidenceGlyph), not copy-pasted per summary printer
        - One bullet character (ui.Bullet) used across all commands
        - Rendered banner/summary content is visually equivalent to before (same titles, same information)
        - All existing tests pass
      hints:
        - Hardcoded 63-char banners live in discover.go (~line 704), promote.go, and shape.go
        - discover.go uses "•" bullets while harvest.go uses "-" - unify on ui.Bullet
