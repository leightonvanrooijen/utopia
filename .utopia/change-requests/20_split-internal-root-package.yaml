id: 20_split-internal-root-package
type: refactor
title: Break up the internal root package so callers depend on what they use
status: draft
tasks:
    - id: move-claude-and-credentials-out-of-root
      description: |
        The internal root package is not a package, it is a lobby. It holds the
        YAML store (store.go, 1274 lines, 70 methods), the claude subprocess
        client (claude.go, 642 lines), usage capture (claude_usage.go),
        credential resolution (credentials.go) and a formatting helper
        (format.go). These share no subject matter. They share a directory.

        Because they share a directory they share a namespace, and because they
        share a namespace 42 files import the whole lobby to reach one thing.
        A file that only wants to run a claude prompt imports the package that
        also defines every storage method.

        Current behavior: `internal.CLI`, `internal.YAMLStore`,
        `internal.PromptResult`, `internal.ExtractYAMLBlock` and the credential
        helpers all resolve through the same import. Any change to any of them
        recompiles every consumer.

        Expected behavior: the claude client, usage capture, credentials and
        formatting each live in a package named for what they do. Nothing about
        their logic changes - this is a move plus the import rewrites the move
        forces.
      acceptance_criteria:
        - All existing tests pass, with test bodies unchanged apart from the package and import lines the move forces
        - The claude subprocess client and its usage capture live in one package named for the claude CLI, and no longer in the internal root
        - Credential resolution lives in its own package, and formatting helpers live in their own package
        - Every moved symbol keeps its exported name, its signature and its behavior - the only edits are the package clause and the import paths at call sites
        - go build ./... and go vet ./... stay clean, and no import cycle is introduced
        - internal/domain still imports none of these packages, so it remains a leaf
        - The internal root package holds at most the YAML store after this task, and holds nothing after the next task
      hints:
        - The five files are internal/store.go, internal/claude.go, internal/claude_usage.go, internal/credentials.go and internal/format.go, with their existing _test.go siblings
        - The claude surface is CLI with its With* builder methods plus Prompt, Clone, SessionWithCapture, and PromptResult with GetUsage - see internal/claude.go
        - ExtractYAMLBlock and Delete are the format.go and credentials.go exports - check which callers use each before choosing package names
        - Move one package per commit and let the compiler find the call sites; do not hand-edit imports ahead of the move
        - internal/chunk/sizer.go is the only non-cli, non-ralph consumer of the root package - check what it actually needs, it may only want one symbol
    - id: narrow-the-store-dependency
      description: |
        YAMLStore is a single type with 70 methods spanning eleven unrelated
        artifact families - specs, change requests, work items, execution runs,
        drafts, concept docs, domain docs, ADRs, standards, validators,
        conversations - plus config load and save and an execution log appender.

        Current behavior: every consumer takes `*internal.YAMLStore` and
        therefore depends on all 70 methods. internal/ralph needs perhaps six of
        them; it is coupled to all of them. Test doubles are impossible without
        implementing the whole surface, which is why the tests construct real
        stores against temp directories.

        Expected behavior: the concrete store keeps all 70 methods and keeps
        writing the same bytes to the same paths. What changes is that each
        consumer declares a small interface naming only the methods it calls,
        and takes that interface instead of the concrete type. The store
        satisfies them all implicitly. This is Go's consumer-defined interface
        idiom and it is a compile-time change only.
      acceptance_criteria:
        - All existing tests pass unchanged, and the bytes written to .utopia for any given operation are identical
        - store.go is split into one file per artifact family within its package, with no method body edited during the split
        - internal/ralph, internal/chunk, internal/harvest, internal/validators and internal/discover each declare an interface listing only the store methods that package calls, and accept that interface rather than the concrete type
        - Each declared interface is defined in the consuming package, not exported from the store package
        - The concrete store satisfies every declared interface without an explicit assertion being required to compile, and a compile-time assertion is added anyway so a signature drift fails the build rather than a call site
        - No consumer's interface lists a method that consumer does not call - verified by removing any unused method and confirming the build still passes
        - The store type keeps all 70 methods and no method is renamed, so no on-disk behavior can change
        - go build ./... and go vet ./... stay clean
      hints:
        - internal/store.go:17 declares YAMLStore; the artifact families are visible in the method names - Load/Save/List/Delete prefixes over Spec, ChangeRequest, WorkItem, ExecutionRun, Draft, ConceptDoc, DomainDoc, ADR, Standards, Validator, Conversation
        - internal/ralph calls a small set - SaveWorkItemForSpec, ListWorkItemsForSpec, LoadChangeRequest, SaveExecutionRun, AppendExecutionLogEntry - confirm by grep before writing the interface
        - The directory accessors on the store (SpecsDir, ChangeRequestsDir, ConceptsDir, RunsDir, DomainDir, ADRsDir, ConversationsDir) overlap with the layout owner introduced by change request 19_unify-utopia-paths-and-frontmatter - back them onto it rather than defining the layout twice
        - Split the file first and land it, then introduce interfaces - two reviewable commits, not one unreviewable one
        - Run this change request last, after 19_unify-utopia-paths-and-frontmatter, 18_decompose-execute-work-item and 21_thin-the-cli-handlers. It moves the files all three edit, and doing it first forces them to be rewritten against new import paths
        - 21_thin-the-cli-handlers creates new packages for merge, execution orchestration and shaping. Each will need its own consumer-defined store interface, so running it first means this task sees the final package set rather than declaring interfaces that are about to move
    - id: realign-cli-organization-standard
      description: |
        The standard cli-organization.md documents the internal root package as
        deliberate. Its file-structure block reads
        `claude.go store.go format.go   # package internal: shared low-level
        primitives` (cli-organization.md:35), its stack table names
        `internal.YAMLStore` as the persistence technology
        (cli-organization.md:20), its one-way-imports paragraph lists `internal`
        as an import target, and two further sites reference
        `internal.NewYAMLStore` by that path (cli-organization.md:158 in a code
        example, cli-organization.md:186 in the anti-pattern table).

        Current behavior: the previous two tasks move every one of those symbols
        out of the root package, which leaves the standard describing a layout
        that no longer exists. The spec-intent validator reads the standards, so
        the split is liable to be judged non-conforming against a document the
        split itself invalidated.

        Expected behavior: the standard describes the layout after the split. The
        rules it states do not change - thin handlers, downward-only imports,
        resolvers over hand-rolled paths are all still the rules. Only the
        package names and paths those rules refer to change. This task edits
        documentation and must not edit Go code.
      acceptance_criteria:
        - No Go file is modified by this task - the diff touches only .utopia/standards/cli-organization.md
        - The file-structure block at cli-organization.md:35 lists the packages that exist after the split, with no line describing package internal as a home for shared low-level primitives
        - The stack table's persistence row names the store by its post-split import path rather than internal.YAMLStore
        - The one-way-imports paragraph lists the packages internal/cli imports after the split, and still states that no package imports internal/cli
        - The two remaining references to internal.NewYAMLStore are updated to the post-split path, and the code example at cli-organization.md:158 remains a bad example - it is marked wrong for hand-rolling the path, not for the package it names
        - Every rule, anti-pattern and severity in the document is unchanged in meaning - only the names of packages and paths are edited
        - The document contains no reference to a package that no longer exists after this change request, verified by grepping the standard for each removed package path
        - The document renders as valid markdown with its frontmatter intact and its id still cli-organization
      hints:
        - The six sites are .utopia/standards/cli-organization.md lines 20, 35, 138, 158, 186 and the One-way imports paragraph that follows the resolver reference
        - Line 138 reads "Handlers never hand-roll path resolution or construct YAMLStore directly" - the rule survives, only the type's home changes
        - The anti-pattern "Let a command file grow past ~400 lines" and the Rationale note that cli is "~7,400 lines" are about internal/cli, not the root package - leave both alone, they are the subject of separate work
        - Do this task last in the change request, after the moves have settled, so the standard is written against the layout that actually shipped rather than the one that was planned
        - Change request 19_unify-utopia-paths-and-frontmatter also touches this area conceptually - its layout owner replaces the filepath.Join(abs, ".utopia") shown at cli-organization.md:158, but that snippet is the deliberate bad example and stays bad
