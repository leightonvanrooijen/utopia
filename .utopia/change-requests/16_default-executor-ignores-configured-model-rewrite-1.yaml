id: 16_default-executor-ignores-configured-model-rewrite-1
type: bugfix
title: Fix the default executor to run on the configured model instead of whatever the claude CLI defaults to
status: in-progress
tasks:
    - id: resolve-default-executor-model-from-config
      description: |
        Fix the default executor's model resolution to match spec
        model-configuration, feature config-structure.

        Current behavior: internal/ralph/ralph.go:121-124 leaves
        defaultExecutorModel empty unless the --model CLI flag is set, so
        config.Models.Execute is never read. With no flag, no --model reaches the
        claude binary and the CLI's own default model runs the attempt.

        Expected behavior per the spec: the per-command execute key overrides
        models.default, and a missing execute key falls back to models.default -
        the same fallback chain every other role already gets. The --model flag
        keeps overriding the resolved value for a single invocation rather than
        being the only way to set it.
      acceptance_criteria:
        - The default executor resolves its model from models.execute, falling back to models.default when models.execute is absent, matching spec model-configuration feature config-structure
        - A --model flag still overrides the resolved model for that invocation, and the resolved config value applies when the flag is absent
        - The resolved default executor model is passed to the claude binary via --model on every default-executor attempt, including mechanical retries
        - The escalated executor, validators, validator router and scoper resolve their models exactly as they do today - this change touches the default executor only
        - Escalation still resolves from the persisted comprehension counter rather than by comparing model strings, so a project configuring models.execute and models.execute_escalated to the same model still escalates
        - Effort resolution is unchanged, and no code path raises the default executor's effort in response to a failure
      spec: model-configuration
      feature_id: config-structure
      hints:
        - internal/ralph/ralph.go:119-124 is the defect; line 120 shows the shape the model resolution should have had
        - ModelConfig.ExecutorModel() at internal/domain/discovery.go:245 already implements the fallback chain and is currently only called from internal/domain/model.go:145
        - resolveEscalatedExecutorModel at internal/ralph/escalation.go:392 is the working precedent for reading a role's model off config
        - defaultExecutorModel is threaded through executeWorkItem (ralph.go:222, :287) and compared at ralph.go:477 to decide whether an attempt overrides the base CLI - check that comparison still behaves when the base value is no longer empty
    - id: assert-configured-model-reaches-the-binary
      description: |
        Fix the gap that let this defect ship: no test asserted that a configured
        default-executor model reaches the claude binary.

        Two different contracts live at two different layers, and the previous
        wording conflated them. Keep them apart:

        Layer 1, the default executor (internal/ralph): its model resolution
        chain always terminates in a value - models.execute, else models.default,
        else the executor default sonnet (spec model-configuration feature
        backward-compatibility: "Config without models section uses sonnet for
        all commands"). There is NO default-executor code path on which the
        resolution produces nothing. Therefore --model is present on the argv of
        every default-executor spawn, including when the project has no models
        section at all - in that case it carries sonnet. Do not write a
        default-executor test expecting the flag to be absent; such a state is
        unreachable by design and a test demanding it contradicts the sibling
        task in this change request.

        Layer 2, the CLI wrapper (internal.CLI): the spec criterion "If no model
        specified, claude CLI uses its default" is a contract of this wrapper,
        not of the executor. "No model specified" means the wrapper's model
        parameter is empty - it does not mean "the project has no models
        section". The wrapper omits --model when handed an empty model, and that
        omission is asserted at the internal.CLI layer, the only layer where an
        empty model can occur.
      acceptance_criteria:
        - A test asserts that with models.execute configured and no --model flag, a default-executor attempt invokes the claude binary with --model set to the configured value
        - A test asserts that with models.execute absent but models.default present, a default-executor attempt invokes the claude binary with --model set to models.default
        - A test asserts that with no models section at all, a default-executor attempt invokes the claude binary with --model sonnet, per feature backward-compatibility ("Config without models section uses sonnet for all commands")
        - A test asserts that a --model flag overrides a configured models.execute for that invocation
        - A test at the internal.CLI layer asserts that when the wrapper's model parameter is empty, no --model flag appears on the argv, satisfying the cli-model-injection criterion "If no model specified, claude CLI uses its default" at the only layer where an empty model occurs
        - No test asserts an absent --model flag on a default-executor attempt; the default-executor assertions cover that role specifically, not only the roles that already resolved their model correctly
      spec: model-configuration
      feature_id: cli-model-injection
      hints:
        - internal/claude.go:238 is the guarded append; internal/claude_usage_test.go shows the existing pattern for asserting on constructed argv
        - A regression test that only exercises the escalated executor or a validator would have passed against the defect - the default executor is the path that needs covering
        - The wrapper-layer omit-the-flag test and the executor-layer always-present tests are complementary, not contradictory; the empty-model case simply never reaches the wrapper from the default executor
rewrite:
    supersedes: 16_default-executor-ignores-configured-model
    work_item: 16_default-executor-ignores-configured-model-assert-configured-model-reaches-the-binary
    diagnoses:
        - 'spec-intent: The diff implements the substance of the task correctly on the argv of a real default-executor spawn, but one acceptance criterion is unsatisfiable as written: it demands no --model flag for a project with no models section, while the feature it cites and the sibling task in the same change request both require the resolution chain to terminate at sonnet and be passed explicitly. The fault is in w (corrected intent: Assert on the argv of a real default-executor spawn that the resolved model always reaches the claude binary: models.execute when configured, models.default when execute is absent, the executor default sonnet when there is no models section at all, and the --model flag when it overrides. Assert the wrapper''s omit-the-flag-when-nothing-is-resolved contract at the internal.CLI layer, which is the only place no model is resolved.)'
