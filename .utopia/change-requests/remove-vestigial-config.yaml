id: remove-vestigial-config
type: refactor
title: Remove vestigial StrategyConfig and unused DiscoveryState
status: in-progress
tasks:
    - id: remove-strategy-config
      description: |
        Remove StrategyConfig type and all references. This was part of the old
        strategy registry system that was removed in lean-architecture-refactor,
        but the config type was left behind. No code reads these fields.

        Files to modify:
        - internal/domain/discovery.go: Remove StrategyConfig type and Strategies field from Config
        - internal/domain/discovery.go: Update DefaultConfig() to not set Strategies
      acceptance_criteria:
        - StrategyConfig type is removed from discovery.go
        - Config struct no longer has Strategies field
        - DefaultConfig() no longer references StrategyConfig
        - Build succeeds
        - Tests pass
    - id: remove-unused-discovery-state
      description: |
        Remove the unused DiscoveryState type. Only DomainDiscoveryState is actually
        used (for incremental domain discovery). The spec discovery doesn't use
        incremental state tracking.

        Files to modify:
        - internal/domain/discovery.go: Remove DiscoveryState type and DiscoveryScope type
          (but keep DomainDiscoveryState which IS used)
      acceptance_criteria:
        - DiscoveryState type is removed
        - DiscoveryScope type is removed (only used by DiscoveryState)
        - DomainDiscoveryState is preserved (it's used)
        - Build succeeds
        - Tests pass
    - id: update-existing-config-files
      description: |
        The .utopia/config.yaml file may have a strategies section that will now
        be ignored. This is fine - YAML ignores unknown fields. But document this
        in case users see the old field.
      acceptance_criteria:
        - Build succeeds
        - Existing config.yaml files still load (unknown fields ignored)
        - No functional changes to behavior
