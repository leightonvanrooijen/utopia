id: unified-change-request-system-fix-cr-autostart
type: bugfix
title: Fix Claude not auto-starting in CR sessions
status: draft
tasks:
  - id: fix-session-autostart
    spec: unified-change-request-system
    feature_id: cr-command
    description: |
      Fix SessionWithCapture to pass an initial prompt so Claude auto-starts.

      Current behavior: Claude CLI launches but sits waiting for user input.
      User must type "." or press enter to trigger Claude's greeting.

      Expected behavior: Claude immediately starts with its greeting as defined
      in the system prompt ("Start by warmly greeting the user...").

      Root cause: --system-prompt is passed but no initial user message.
      Claude CLI requires a user message to trigger the first assistant response.
    acceptance_criteria:
      - Behavior matches spec unified-change-request-system feature cr-command
      - Running "utopia cr" immediately shows Claude's greeting without user input
      - SessionWithCapture passes an initial prompt argument to trigger response
    hints:
      - Fix is in internal/claude.go SessionWithCapture function
      - Add initial prompt like "." after --system-prompt args
      - 'Example: args = append(args, ".")'
