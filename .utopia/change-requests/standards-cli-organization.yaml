id: standards-cli-organization
type: refactor
title: Conform internal/cli to the cli-organization standard (thin handlers, algorithms in domain packages)
status: in-progress
tasks:
    - id: extract-discover-pipeline
      description: Extract the multi-stage discovery pipeline (qualify -> refine -> draft) inlined in discover.go's RunE handlers into a new internal/discover package, invoked as one function call, following the execute.go -> internal/ralph exemplar
      acceptance_criteria:
        - discover.go's RunE handlers contain only CLI concerns (flag validation, ResolveProject, context setup, result framing) and delegate the pipeline to internal/discover as one call
        - internal/discover has its own unit tests covering the pipeline stages
        - utopia discover produces the same results and output content as before for the same inputs
        - internal/discover does not import internal/cli (one-way imports preserved)
        - discover.go shrinks below the ~400-line guideline
        - All existing tests pass
      hints:
        - The inline pipeline is at discover.go:190-293 (~103-line RunE), cited in .utopia/standards/cli-organization.md
        - Mirror the shape of internal/ralph and how execute.go calls ralph.Execute
        - Prompt-building and stdout-parsing helpers (buildIdentifyQualifyPrompt, countYAMLItems, parseDisqualifiedCandidates) move with the algorithm
        - Sequence this CR after standards-terminal-output so the extraction can use ui.Progress instead of dragging discoverProgress along
    - id: extract-harvest-pipeline
      description: Extract the harvest orchestration inlined in harvest.go (1289 lines, the second-largest cli file) into a new internal/harvest package, leaving a thin handler
      acceptance_criteria:
        - harvest.go's RunE handlers contain only CLI concerns and delegate the algorithm to internal/harvest as one call
        - internal/harvest has its own unit tests
        - utopia harvest produces the same results and output content as before for the same inputs
        - internal/harvest does not import internal/cli
        - harvest.go shrinks below the ~400-line guideline
        - All existing tests pass
      hints:
        - LLM prompt templates in harvest.go are payload, not terminal output - move them with the algorithm unchanged
        - Follow the same extraction shape as internal/discover from the previous task
