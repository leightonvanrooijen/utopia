id: adoption-enhance-discovery-quality
type: enhancement
title: Multi-agent sequential pipeline for high-quality spec discovery
status: in-progress
changes:
    - operation: modify
      spec: adoption
      feature_id: discover-command
      description: |
        Replaces single-pass discovery with a sequential multi-agent pipeline
        optimized for spec quality over speed. Each agent has a focused role
        with clear qualification criteria.

        Pipeline stages:
        1. Candidate Identification - Scan codebase, identify potential specs
        2. Qualification - Apply strict criteria, filter noise ruthlessly
        3. Refinement - Sharpen acceptance criteria, ensure testability

        Core principle: Specs document user-observable capabilities.
        They answer "what can I do?" not "how is it built?"
      criteria:
        add:
            - Discovery uses sequential multi-agent pipeline (3 stages)
            - 'Stage 1 (Candidate Agent): Scans codebase for potential user-observable capabilities'
            - 'Stage 2 (Qualifier Agent): Applies qualification/disqualification criteria to filter candidates'
            - 'Stage 3 (Refinement Agent): Sharpens descriptions and ensures acceptance criteria are testable'
            - Each stage receives output from previous stage (no parallel execution)
            - Pipeline continues only with candidates that pass qualification
            - 'Spec qualification criteria enforced: describes user-observable capability'
            - 'Spec qualification criteria enforced: can be verified by using the system'
            - 'Spec qualification criteria enforced: represents coherent bounded feature'
            - 'Spec qualification criteria enforced: answers ''what can I do?'' not ''how is it built?'''
            - 'Spec disqualification criteria enforced: implementation details (data structures, algorithms)'
            - 'Spec disqualification criteria enforced: internal code organization (services, handlers)'
            - 'Spec disqualification criteria enforced: technical plumbing users don''t interact with'
            - 'Spec disqualification criteria enforced: standard practices covered by language/framework conventions'
            - Prompts are concise and laser-focused on intent
            - Quality over speed (no quick mode)
        remove:
            - Command `utopia discover` initiates codebase analysis
            - Claude receives codebase context (code, tests, docs, comments)
            - Output is draft specs saved to `.utopia/drafts/specs/` directory
    - operation: add
      spec: adoption
      feature:
        id: spec-qualification-criteria
        description: |
            Criteria that define what qualifies as a Spec, ensuring discovered
            specs represent genuine user-observable capabilities rather than
            implementation details or code organization.

            Core principle: Specs answer "what can I do?" not "how is it built?"
        acceptance_criteria:
            - 'Qualification: capability is user-observable (command, output, interaction, behavior)'
            - 'Qualification: capability can be verified by using the system (testable from outside)'
            - 'Qualification: capability represents a coherent bounded feature users care about'
            - 'Qualification: description focuses on WHAT users can achieve, not HOW it''s implemented'
            - 'Qualification: acceptance criteria describe observable outcomes, not internal state'
            - 'Litmus test: ''Could a user verify this by using the system?'' YES = Spec worthy'
            - Qualification criteria are applied by Qualifier Agent before a candidate becomes a draft
    - operation: add
      spec: adoption
      feature:
        id: spec-disqualification-criteria
        description: |
            Criteria that disqualify content from becoming a Spec, even if
            it superficially describes system behavior. Filters out noise
            that doesn't belong in specifications.
        acceptance_criteria:
            - 'Disqualified: implementation details (data structures, algorithms, patterns used)'
            - 'Disqualified: internal code organization (services, handlers, repositories, utils)'
            - 'Disqualified: technical plumbing users don''t interact with (middleware, adapters)'
            - 'Disqualified: standard practices already covered by language/framework conventions'
            - 'Disqualified: infrastructure concerns (logging, monitoring, deployment)'
            - 'Disqualified: code quality practices (error handling patterns, validation approaches)'
            - 'Disqualified: architectural decisions (those belong in ADRs)'
            - 'Disqualified: domain vocabulary definitions (those belong in Domain docs)'
            - Disqualification criteria are checked before suggesting spec creation
            - Candidates failing disqualification are logged with reason (for transparency)
    - operation: add
      spec: adoption
      feature:
        id: discovery-agent-prompts
        description: |
            Focused, concise prompts for each discovery pipeline agent.
            Each prompt is laser-focused on its stage's responsibility.
            Prompts emphasize intent over instruction length.
        acceptance_criteria:
            - 'Candidate Agent prompt focuses on: ''Find what users can DO with this system'''
            - 'Qualifier Agent prompt focuses on: ''Is this user-observable and testable?'''
            - 'Refinement Agent prompt focuses on: ''Can someone verify this by using the system?'''
            - Each prompt fits in a single screen (concise by design)
            - Prompts include examples of good vs bad specs for calibration
            - Prompts reference qualification/disqualification criteria explicitly
            - No verbose instructions - intent over prescription
