id: execution-ralph-enhance-spend-limit-probing
type: enhancement
title: Detect org monthly spend limit and probe until recovery
status: draft
changes:
  - operation: modify
    spec: execution-ralph
    feature_id: rate-limit-handling
    description: |
      Detect Claude limit errors and respond appropriately to each kind.
      Rolling usage limits include a reset time in the message, so the loop
      waits until that time before retrying. The org monthly spend limit
      carries no reset time and no API exposes one, so the loop enters probe
      mode: it periodically retries a minimal Claude invocation and resumes
      work when a probe succeeds. Neither kind of limited attempt burns
      iterations.
    criteria:
      add:
        - Detects "You've hit your org's monthly spend limit" pattern in Claude invocation stdout/stderr
        - On spend-limit detection, prints a message explaining the org monthly spend limit was hit, that no reset time is available, and that the loop will probe periodically until usage is restored
        - In probe mode, the loop invokes a minimal Claude prompt (claude --print with a trivial prompt) every 30 minutes to check whether the limit has lifted
        - Each probe attempt is logged with a timestamp and its outcome (still limited or recovered)
        - When a probe succeeds, the loop prints a recovery message and resumes the interrupted iteration with a normally rebuilt prompt
        - Spend-limited attempts and probe attempts do not count against max iterations limit
        - Ctrl+C during a probe wait triggers the existing graceful shutdown path (state saved, resumable)
        - Session --timeout continues to elapse during probe mode and triggers graceful shutdown if reached
        - Detects the newer rolling-limit message formats "You've hit your session limit · resets {time}" and "You've hit your Opus limit · resets {time}" in addition to the legacy "Limit reached · resets {time} ({timezone})" format
        - When a rolling-limit message omits the timezone, the reset time is interpreted in the system local timezone
      edit:
        - old: "Detects \"Limit reached · resets {time} ({timezone})\" pattern in Claude invocation stderr/stdout"
          new: "Detects rolling-limit reset patterns in Claude invocation stderr/stdout (legacy and current message formats)"
    hints:
      - Existing detection lives in internal/ralph/ratelimit.go (DetectRateLimit, ParseRateLimitWait, FormatWaitMessage) - add a sibling DetectSpendLimit and keep detection separate from response strategy
      - The rate-limit handling branch is DUPLICATED in internal/ralph/ralph.go (around lines 227 and 642, two loop variants) - both branches must gain the spend-limit check, ideally extracted into one shared helper
      - Check spend-limit BEFORE rolling-limit in the branch ordering, since both messages contain the word "limit" and regex overlap could misroute to the wait-until-reset path
      - Follow the existing wait pattern at ralph.go:241 for probe sleeps - select on ctx.Done() vs time.After, never bare time.Sleep, so Ctrl+C and --timeout still interrupt
      - The rolling-limit regex in ratelimit.go:16 requires a "(timezone)" group - the newer message formats omit it, so make the timezone group optional and fall back to time.Local when absent
      - Table-driven tests for message formats already exist in internal/ralph/ratelimit_test.go - extend them with the new session/Opus/spend-limit messages
      - For the minimal probe invocation, reuse the existing Claude invocation layer in internal/claude.go rather than exec-ing directly
