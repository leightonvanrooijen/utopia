id: 12_tiered-model-routing-validation-escalation
type: initiative
title: Run the loop on a cheaper executor and escalate by validation failure class, not failure count
status: in-progress
phases:
    - type: enhancement
      status: complete
      changes:
        - operation: modify
          spec: agentic-validators
          feature_id: validator-runner
          description: |
            Execute a validator by invoking Claude with the prompt and changed
            files.

            A validator currently answers one question - did this pass - and on
            failure hands back its entire output as prose. That is enough to
            retry and not enough to decide anything: a missing import and a
            misread specification are indistinguishable to the caller, so the
            only available response is to try again identically.

            The validator now also classifies the failure. A mechanical failure
            means the intent was right and the execution slipped, so the same
            executor can retry. A comprehension failure means the intent was
            wrong, which the same executor cannot fix by trying harder. That
            distinction is the input every later phase routes on, and it is
            cheapest to produce here, where the validator has already read the
            diff and the specification.

            Because Utopia drives the claude CLI rather than the Anthropic API,
            the verdict cannot be enforced by a response schema. It is carried
            in a delimited block in stdout and parsed, and every parse failure
            resolves toward the more expensive classification rather than the
            cheaper one.
          criteria:
            add:
                - A validator emits its verdict as a single <VERDICT> block containing a JSON object
                - The verdict object carries verdict (pass or fail), failure_class (mechanical, comprehension, or null), diagnosis, corrected_intent, confidence (high or low), and spec_defect_suspected
                - failure_class is null when verdict is pass and non-null when verdict is fail
                - diagnosis is at most 400 characters
                - corrected_intent is required when failure_class is comprehension, is null otherwise, and is at most 1500 characters
                - A verdict of fail with confidence low is treated as failure_class comprehension regardless of the class it reported
                - Output containing neither <PASSED> nor a parseable <VERDICT> block is treated as a failure with failure_class comprehension
                - A <VERDICT> block whose JSON does not parse, or which omits a required field, is treated as a failure with failure_class comprehension
                - A validator emitting <PASSED> with no <VERDICT> block still passes, so validator prompts written before this contract keep working
            edit:
                - old: Runner returns structured result (passed bool, feedback string)
                  new: Runner returns structured result carrying passed bool, feedback string, and the parsed verdict
        - operation: modify
          spec: agentic-validators
          feature_id: validator-result-aggregation
          description: |
            Aggregate results from parallel validators and determine overall
            pass/fail.

            Aggregation is boolean AND over pass flags plus string
            concatenation of feedback. Once validators classify their failures,
            flattening them into one string discards exactly the field the
            routing logic needs, so the aggregate has to carry the
            classification rather than only the prose.

            Validators disagree, and the disagreement resolves toward
            escalation: one validator reporting a misread specification is not
            cancelled out by three reporting lint errors.
          criteria:
            add:
                - The aggregate carries the strongest failure_class across failing validators, where comprehension is stronger than mechanical
                - The aggregate is spec_defect_suspected when any failing validator reports spec_defect_suspected
                - Each failing validator's diagnosis and corrected_intent are retained on the aggregate rather than flattened into the feedback string
        - operation: modify
          spec: agentic-validators
          feature_id: validator-template-content
          description: |
            The scaffolded validator prompt teaches the verdict contract by
            example, so validators created from the template classify their
            failures without the author having to discover the schema.
          criteria:
            add:
                - The template instructs the validator to emit a <VERDICT> block on failure and documents every field
                - The template explains the mechanical and comprehension distinction in terms of intent - mechanical means the intent was right and the execution slipped, comprehension means the intent was wrong
                - The template instructs the validator to report confidence low rather than guess a class when the distinction is unclear
    - type: feature
      status: complete
      changes:
        - operation: add
          spec: escalation-routing
          feature:
            id: failure-class-routing
            description: |
                A failing validation gate routes on failure_class rather than on
                iteration count.

                A mechanical failure retries on the same executor and does not
                count toward escalation, because the executor was not the
                problem. A comprehension failure escalates the executor to the
                higher tier, because the same executor re-reading the same
                specification will re-derive the same wrong intent.

                Mechanical retries are bounded separately. Enough of them in a
                row is itself evidence of misunderstanding - a model that keeps
                slipping in the same place is usually solving the wrong problem
                - so the mechanical path reclassifies rather than retrying
                indefinitely.
            acceptance_criteria:
                - A validation failure with failure_class mechanical retries on the default executor model
                - A mechanical retry does not increment comprehension_count
                - Exceeding the mechanical retry cap reclassifies the failure as comprehension and routes it accordingly
                - A validation failure with failure_class comprehension increments comprehension_count
                - When comprehension_count reaches 1, execution escalates to the escalated executor model
                - When comprehension_count reaches 2, the work item routes to scoping escalation before execution is attempted again
                - A verdict with spec_defect_suspected routes to scoping escalation regardless of comprehension_count
                - Escalation state is persisted on the work item so it survives a resume rather than resetting to the default executor
                - The routing decision for each iteration is logged with the failure class, the counter values, and the model selected
            hints:
                - rate-limit-handling in execution-ralph already specifies exactly this shape of exemption - "Rate-limited attempts do not count against max iterations limit" - so reuse that mechanism for the mechanical exemption rather than inventing a parallel one, and see internal/ralph/ralph.go:277-287 for how a non-counting attempt is already handled
                - The counters belong on WorkItem next to IterationCount, which is already persisted and already survives resume - see work-item-status in execution-ralph
                - validator-relevance-router already establishes the precedent that a role may resolve a model independently of models.validators, so per-role model resolution is an existing pattern rather than a new one
                - max_iterations in verification (6 in this repo) still bounds total iterations and is deliberately left alone - it is the outer bound, and these caps are inner ones. Make the composition explicit in the log line so an operator can tell which bound stopped a work item
                - Reclassifying on mechanical-cap-exceeded rather than failing outright is the load-bearing choice - it converts a stuck retry loop into an escalation, which is the only move that can actually change the outcome
                - Phase 3 replaces the prompt this phase hands to an escalated executor. Until it lands, escalation changes the model but reuses the existing prompt builder, so expect the escalated attempt to still see prior-attempt context
        - operation: add
          spec: escalation-routing
          feature:
            id: escalation-caps
            description: |
                Every escalation path is bounded, and exhausting a bound halts
                the work item rather than looping.

                The caps are set so that the worst case is roughly cost-neutral
                against running the expensive model throughout, and the common
                case is materially cheaper. They are independently configurable
                because they are guesses, and the telemetry that would confirm
                them does not exist yet.
            acceptance_criteria:
                - The mechanical retry cap, comprehension escalation cap, opus_execution_attempts cap and scoping_escalations cap are each independently configurable
                - Default caps are 4 mechanical retries, 2 escalated execution attempts and 1 scoping escalation per change request
                - Exceeding any cap marks the work item needs_human and halts it without further attempts
                - A work item halted as needs_human is distinguishable from one that failed verification
                - Halting one work item as needs_human does not abort the run - execution continues with the next change request
                - A work item that fails on every available path terminates as needs_human rather than looping indefinitely
                - Cap configuration is validated at load time, and a non-positive cap produces a clear error before execution starts
            hints:
                - work-item-status in execution-ralph currently specifies pending, in_progress and completed, and the code also has WorkItemFailed - needs_human is a distinct terminal state, not a synonym for failed, because the operator action differs
                - sequential-executor already specifies "Stops if max iterations reached on any item" - decide deliberately whether needs_human stops the run or skips the item, and the criterion above says skip, so that one ambiguous change request cannot strand a batch
                - batch-execution in execution-ralph runs all draft change requests in filename order, which is exactly the case where halting the whole run on one bad change request is most costly
                - Validate caps alongside the existing config validation that already rejects an invalid model name at load time
        - operation: add
          spec: escalation-routing
          feature:
            id: scoping-escalation
            description: |
                Repeated comprehension failure is treated as evidence about the
                change request rather than only about the executor. Scoping
                escalation rewrites the change request instead of the code.

                The rewritten change request is the highest-value output of a
                failed iteration, so it is persisted as a first-class artefact
                and fed to harvesting. A run that produces a sharper
                specification has produced something durable even if it produced
                no working code.
            acceptance_criteria:
                - Scoping escalation sends the change request, the validator diagnoses and the relevant spec and ADR excerpts to the scoper model
                - The scoper is instructed to rewrite the change request, not to write code
                - The rewritten change request is persisted as a change request artefact rather than held in memory
                - The rewritten change request records which change request it supersedes and which diagnoses motivated the rewrite
                - The rewritten change request is discoverable by harvesting
                - Execution resumes against the rewritten change request with comprehension_count reset to 0
                - opus_execution_attempts is not reset by a scoping escalation
                - A scoping escalation that produces no parseable change request counts against the scoping_escalations cap and does not resume execution
            hints:
                - cr-validate-command in unified-change-request-system already validates a change request file - run the rewritten change request through it before resuming, so a malformed rewrite fails fast instead of at merge
                - The scoper writes into .utopia/change-requests/ and must not write to .utopia/specs/ - specs are only updated by merge, and a scoper that edits them directly breaks the merge invariant
                - harvest-command and signal-detection in harvest are where discoverability lands - a rewritten change request is a strong signal that domain language or an ADR is missing, which is the whole reason to persist it
                - Not resetting opus_execution_attempts across a scoping escalation is deliberate - it is the bound that stops rewrite-then-retry from becoming an unbounded loop through a different door
                - Record the supersedes relationship in the change request itself rather than in a side index, so the provenance survives a git clone with no database
        - operation: modify
          spec: model-configuration
          feature_id: config-structure
          description: |
            Define the models section in .utopia/config.yaml with default and
            per-command overrides.

            Execution is no longer one role. The default executor, the
            escalated executor, the validators and the scoper are four roles
            with different cost profiles and different failure consequences, so
            each resolves its own model with a fallback chain rather than
            sharing one key.
          criteria:
            add:
                - models.execute_escalated specifies the model used once execution escalates after a comprehension failure
                - models.scoper specifies the model used to rewrite a change request during scoping escalation
                - If models.execute_escalated is missing, opus is used
                - If models.scoper is missing, models.execute_escalated is used
                - models.execute_escalated and models.scoper resolve to a model at least as capable as models.execute, and a configuration that escalates downward produces a clear error at load time
            edit:
                - old: Per-command keys override the default (cr, harvest, execute, validators, discover, standards, refactor, shape, validator_create, validator_edit)
                  new: Per-command keys override the default (cr, harvest, execute, execute_escalated, scoper, validators, validator_router, discover, standards, refactor, shape, validator_create, validator_edit)
        - operation: add
          spec: model-configuration
          feature:
            id: effort-configuration
            description: |
                Each role resolves an effort level alongside its model, so
                reasoning depth is configured rather than left to the CLI
                default.

                Effort and model are separate levers with different economics.
                Raising the default executor's effort is the intuitive response
                to a failure and the wrong one: at the top of its effort range a
                cheaper model can cost more than the expensive model would have,
                for comparable quality. Escalating the model is therefore
                strictly cheaper than cranking effort, which makes the default
                executor's effort a fixed property of its role rather than a dial
                the loop turns when something fails.

                The consequence is a rule worth stating as a rule: no code path
                raises effort in response to a validation failure. Failures
                change which model runs, never how hard the cheap one tries.
            acceptance_criteria:
                - Config supports an optional effort section with per-role keys mirroring the models section
                - Effort accepts low, medium, high, xhigh or max, and any other value produces a clear error at load time
                - The default executor, escalated executor, validators and scoper each resolve their own effort level
                - Default effort is medium for the default executor, high for the escalated executor, medium for validators and high for the scoper
                - If a role's effort is missing, effort.default is used, and if that is missing the claude CLI default applies
                - No code path raises a role's effort in response to a validation failure, a retry, or an escalation
                - The default executor's effort is identical on a first attempt and on a mechanical retry
                - A --effort flag overrides the resolved effort for a single invocation, mirroring --model
            hints:
                - The CLI flag is `--effort <level>` accepting low, medium, high, xhigh, max - confirm against `claude --help` on the installed version rather than trusting this text, since it is a per-session flag rather than a config setting
                - The immutability rule is the one criterion here that is genuinely a test rather than a config check - assert that the effort passed on a mechanical retry equals the effort passed on the first attempt, because that is where a well-meaning future change would try harder instead of escalating
                - Mirror the models section shape exactly rather than inventing a second config idiom - a reader who understands models.execute should not have to learn a new pattern to understand effort.execute
                - xhigh is the setting Claude Code itself defaults to for coding and agentic work, so it is the obvious candidate if the escalated executor at high proves too shallow - change the default rather than adding a code path that escalates effort
                - This composes with 10_work-item-turn-budget-and-sizing, which adds work_items.turn_budget as --max-turns. Effort and turn budget are both cost knobs on the same invocation - effort bounds reasoning depth per turn, turn budget bounds the number of turns - so state the relationship in the config documentation or the two will be confused for each other
                - Capture an ADR on why escalation is the response to failure rather than raised effort, including the cost reasoning - it is counterintuitive enough that someone will otherwise "fix" it by adding an effort bump
        - operation: modify
          spec: model-configuration
          feature_id: cli-model-injection
          description: |
            Pass the resolved model and effort to the Claude CLI wrapper.

            Effort travels the same path as model - resolved by the caller from
            the role, threaded through the wrapper, appended as a flag. It is a
            second parameter on an existing route rather than a new mechanism.
          criteria:
            add:
                - Effort is passed to claude binary via --effort flag
                - If no effort is specified, the flag is omitted and the claude CLI default applies
            edit:
                - old: CLI struct accepts optional model parameter
                  new: CLI struct accepts optional model and effort parameters
                - old: Model flows through Prompt and SessionWithCapture methods
                  new: Model and effort flow through Prompt and SessionWithCapture methods
    - type: feature
      status: in-progress
      changes:
        - operation: add
          spec: escalation-routing
          feature:
            id: escalation-context-construction
            description: |
                An escalated attempt is built a fresh context rather than handed
                the transcript of the attempts that failed.

                Replaying failed attempts anchors the escalated model toward the
                mental model that just failed, which is the specific thing
                escalation is meant to escape. It also pays the higher tier's
                rate to read the cheaper tier's dead ends.

                What survives from a failed attempt is its conclusion, not its
                reasoning: the validator's diagnosis, the corrected intent, the
                final diff and the verbatim tooling output. What the model
                thought on the way there is discarded.
            acceptance_criteria:
                - An escalated context contains the change request, the relevant spec and ADR excerpts, each prior failure's diagnosis and corrected_intent, the final diff from the last attempt, and verbatim verification and validator output
                - An escalated context contains no prior-attempt model reasoning, no prior partial diffs other than the final diff, and no prior tool-call logs
                - The absence of prior-attempt transcript in a constructed escalated prompt is asserted by a test against the constructed prompt, not only by inspection
                - Scoping escalation contexts are constructed by the same rules as escalated execution contexts
                - A non-escalated retry keeps using the existing failure-injection prompt unchanged
            hints:
                - failure-injection in execution-ralph already specifies "Only failures from immediately previous iteration (not accumulated)", so the loop already discards history on the normal path - this feature extends that discipline to escalation rather than inventing it
                - The prompt assembly to branch is internal/ralph/ralph.go:438-444, where PROJECT STANDARDS FEEDBACK and PREVIOUS FAILURES are injected as separate sections
                - Assert on the constructed prompt string, not on model behaviour - the criterion is about what was sent, which is cheap and deterministic to test, and this is the only acceptance criterion in the design that a unit test can fully pin down
                - Keep the diff and the verbatim tooling output - they are evidence rather than reasoning, and dropping them makes the escalated attempt guess at what actually broke
                - Utopia shells out to the claude CLI with a single --print prompt at internal/claude.go:129-134, so there is no conversation to prune - the fresh context is simply a different prompt string, which makes this phase considerably cheaper than it would be against a message-history API
    - type: feature
      changes:
        - operation: add
          spec: escalation-routing
          feature:
            id: escalation-telemetry
            description: |
                Every change request outcome writes a record of how it was
                routed, so the caps and the premise behind them can be argued
                with evidence instead of intuition.

                The specific hypothesis under test is that repeated
                comprehension failure indicates a defective change request
                rather than an executor limit. That is plausible and unmeasured.
                If rewritten change requests do not improve first-pass rates,
                the rule should invert - escalate execution before rewriting the
                specification - and this record is what makes that decision
                possible.

                Token counts and monetary cost are deliberately absent. Utopia
                drives the claude CLI, which reports neither, so cost is
                approximated from attempt counts and the model each attempt used
                rather than measured. An approximation that is honest about
                being one is more useful than a fabricated dollar figure.
            acceptance_criteria:
                - One record is written per change request outcome, including outcomes that halted as needs_human
                - The record carries cr_id, spec_ref, cr_type, the executor model and effort used for each attempt, sonnet_attempts, mechanical_failures, comprehension_failures, opus_execution_attempts, scoping_escalations, spec_rewritten, outcome, and wall-clock duration
                - The recorded effort for the default executor is identical across every attempt on a change request, which is the persisted evidence that no path raised it
                - outcome is one of passed, needs_human or abandoned
                - The record is written when a change request aborts, not only when it completes
                - Escalation rate can be derived per spec and per cr_type from the persisted records without re-reading run transcripts
                - The ratio of mechanical to comprehension failures can be derived per spec from the persisted records
                - The record notes that token counts and monetary cost are not captured, so a reader does not mistake their absence for zero
                - Failure to write the record logs a warning and does not block the execution loop
            hints:
                - run-transcript-persistence in execution-ralph already writes .utopia/runs/<cr-id>/<workitem-id>.yaml per work item and already specifies the warn-but-do-not-block behaviour - extend that record rather than adding a parallel file
                - Because run records are committed to git, git history is the time series - escalation rate over time is a query over the repository with no telemetry backend involved, which is the same reasoning 07_observability-execution-spans applies to spans
                - Wall-clock is already measured - stepTimings in internal/ralph/timing.go holds the Claude, verification and validator buckets, and step-timing-logs specifies the summary line. Note that 07_observability-execution-spans replaces stepTimings with the OpenTelemetry model, so coordinate rather than building on a type that change request deletes
                - 06_observability-unified-output frames itself as covering what Utopia "did and what it cost" - align the vocabulary with it rather than inventing a second cost dialect
                - Escalation clustering by spec is the highest-value aggregation and the reason spec_ref is on the record - a spec whose change requests escalate repeatedly has a boundary problem, not a model problem, and that is a finding about the codebase rather than about routing
                - Reuse the yaml-formatting package so the record matches other Utopia YAML
                - Capture an ADR recording that Utopia sits above the Anthropic API and therefore cannot observe tokens, cache hits or cost - the design this change request came from assumed the API layer, and the next reader will make the same assumption unless it is written down
                - Capture the inverted-rule hypothesis as an ADR too, with the specific evidence that would overturn it - rewritten change requests failing to improve first-pass rates - so the open question is recorded rather than remembered
current_phase: 2
