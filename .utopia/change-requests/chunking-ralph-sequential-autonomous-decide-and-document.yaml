id: chunking-ralph-sequential-autonomous-decide-and-document
type: enhancement
title: Add a decide-and-document constraint so autonomous executors never block on human input
status: draft
changes:
  - operation: modify
    spec: chunking-ralph-sequential
    feature_id: default-constraints
    criteria:
      add:
        - >-
          Default constraints include "You are running autonomously and
          non-interactively; never ask for, or wait on, human input"
        - >-
          Default constraints include "When a genuine design choice arises,
          choose the best-justified option and implement it rather than
          deferring the decision to a human"
        - >-
          Default constraints include "Record any non-obvious decision -
          rationale and the alternatives considered - in the commit or PR body,
          so PR review is the human checkpoint"
        - >-
          The autonomous decide-and-document constraints are emitted for every
          non-refactor work item prompt, alongside the existing default
          constraints
    hints:
      - Add to the same default-constraints list that already emits "Architecture is already correct"; these are additional entries, not a replacement.
      - Root cause being fixed - an interactive "ask the human to contribute" behavior leaked into an autonomous Ralph loop, so no <COMPLETE> token was ever emitted and the loop retried until manually killed. These constraints make the executor decide-and-document instead of ask-and-block.
