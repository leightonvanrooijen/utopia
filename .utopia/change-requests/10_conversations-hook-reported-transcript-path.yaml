id: 10_conversations-hook-reported-transcript-path
type: enhancement
title: Take the interactive transcript path from Claude's SessionStart hook instead of reconstructing it
status: draft
changes:
  # conversation-persistence: stop guessing where Claude put the transcript.
  # Claude already tells us, via the SessionStart hook payload. The capture
  # itself stays exactly where it is (Utopia level, after process exit) so the
  # Ctrl+C guarantee is untouched - only path DISCOVERY moves.
  - operation: modify
    spec: conversations
    feature_id: conversation-persistence
    description: |
      Capture full transcript at session end from Claude's native session
      storage. Eliminates ANSI escape codes and terminal artifacts.

      Utopia does not reconstruct the session file location. It injects a
      SessionStart hook via inline --settings JSON; the hook writes its payload
      to a Utopia-controlled file, and that payload's transcript_path field is
      the authoritative location. Reading still happens at the Utopia level
      after the session process exits, so an interrupted session is captured
      just as reliably as a clean one - the hook only reports where to look,
      it never performs the capture.

      Reconstructing the path by encoding the working directory is retained
      only as a fallback for sessions where no payload was produced.
    criteria:
      add:
        - Utopia injects a SessionStart hook into interactive sessions via an inline --settings JSON argument
        - The injected hook writes its stdin payload to a file path chosen by Utopia
        - The transcript is read from the transcript_path field of the captured SessionStart payload
        - Utopia does not write to .claude/settings.json or ~/.claude/settings.json to install the hook
        - Hooks already configured by the user in their own settings files still fire during a Utopia session
        - Transcript capture succeeds when the project directory is reached via a symbolic link
        - When no SessionStart payload is available, capture falls back to the working-directory-encoded path
        - A payload whose transcript_path is empty, or names a file that does not exist, is treated the same as a missing payload
        - A fallback to the working-directory-encoded path is logged so silent capture loss is observable
      edit:
        - old: Capture happens at Utopia level (not Claude hooks) for reliability
          new: Capture happens at Utopia level after the session process exits; Claude hooks only report where the transcript is stored and never perform the capture
        - old: Transcripts are read from Claude's session storage (~/.claude/projects/)
          new: Transcripts are read from the session file path Claude reports, rather than from a path Utopia derives from the working directory
    hints:
      - The only function that needs to change is internal/claude.go SessionWithCapture (line 257) and readSessionTranscript (line 301). All 9 call sites go through SessionWithCapture and its signature does not need to change.
      - Keep the existing defer at internal/claude.go:286. That defer is what implements the "cannot be bypassed via Ctrl+C" criterion - it runs after cmd.Run() returns, so the transcript is read no matter how the session ended. The hook must not replace it.
      - readSessionTranscript currently takes a sessionID and derives a path. Change it to take an already-resolved absolute path; leave parseSessionJSONL and the extract* helpers alone.
      - |
        The --settings flag accepts an inline JSON string, not just a file path,
        so no temp settings file is needed. Verified working on claude 2.1.220:

            claude --settings '{"hooks":{"SessionStart":[{"matcher":"","hooks":[{"type":"command","command":"cat > /tmp/payload.json"}]}]}}'

        The hook receives the payload on stdin, so "cat > <sidecar>" is the
        whole hook implementation - no helper script needs to be shipped.
      - The SessionStart payload has these fields (verified empirically on claude 2.1.220) - session_id, transcript_path, cwd, hook_event_name, source. SessionStart fires at startup, before the user types anything, which is why it beats Stop or SessionEnd for this purpose.
      - The bug this fixes - claude.go:316-317 does strings.ReplaceAll on os.Getwd(), but Claude encodes the RESOLVED path. On macOS a cwd of /tmp/x resolves to /private/tmp/x, so the derived directory is "-tmp-x" while Claude wrote to "-private-tmp-x", and readSessionTranscript silently returns an error that SessionWithCapture discards.
      - Use a temp file for the payload sidecar (os.CreateTemp) and clean it up. Do not put it in .utopia/ - it is transient, not an artifact.
      - claude --help describes --settings as loading "additional settings", implying a merge rather than a replace. Confirm that a user-configured hook still fires while Utopia's injected hook is active before considering the criterion met.
