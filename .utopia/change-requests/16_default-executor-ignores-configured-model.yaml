id: 16_default-executor-ignores-configured-model
type: bugfix
title: Fix the default executor to run on the configured model instead of whatever the claude CLI defaults to
status: in-progress
tasks:
    - id: resolve-default-executor-model-from-config
      description: |
        Fix the default executor's model resolution to match spec
        model-configuration, feature config-structure.

        Current behavior: internal/ralph/ralph.go:121-124 leaves
        defaultExecutorModel empty unless the --model CLI flag is set, so
        config.Models.Execute is never read. With no flag, no --model reaches the
        claude binary and the CLI's own default model runs the attempt.

        Expected behavior per the spec: the per-command execute key overrides
        models.default, and a missing execute key falls back to models.default -
        the same fallback chain every other role already gets. The --model flag
        keeps overriding the resolved value for a single invocation rather than
        being the only way to set it.
      acceptance_criteria:
        - The default executor resolves its model from models.execute, falling back to models.default when models.execute is absent, matching spec model-configuration feature config-structure
        - A --model flag still overrides the resolved model for that invocation, and the resolved config value applies when the flag is absent
        - The resolved default executor model is passed to the claude binary via --model on every default-executor attempt, including mechanical retries
        - The escalated executor, validators, validator router and scoper resolve their models exactly as they do today - this change touches the default executor only
        - Escalation still resolves from the persisted comprehension counter rather than by comparing model strings, so a project configuring models.execute and models.execute_escalated to the same model still escalates
        - Effort resolution is unchanged, and no code path raises the default executor's effort in response to a failure
      spec: model-configuration
      feature_id: config-structure
      hints:
        - internal/ralph/ralph.go:119-124 is the defect; line 120 shows the shape the model resolution should have had
        - ModelConfig.ExecutorModel() at internal/domain/discovery.go:245 already implements the fallback chain and is currently only called from internal/domain/model.go:145
        - resolveEscalatedExecutorModel at internal/ralph/escalation.go:392 is the working precedent for reading a role's model off config
        - defaultExecutorModel is threaded through executeWorkItem (ralph.go:222, :287) and compared at ralph.go:477 to decide whether an attempt overrides the base CLI - check that comparison still behaves when the base value is no longer empty
    - id: assert-configured-model-reaches-the-binary
      description: |
        Fix the gap that let this defect ship: no test asserted that a configured
        default-executor model reaches the claude binary.

        The existing criterion "If no model specified, claude CLI uses its default"
        is correct and must stay - it covers a project with no models section. What
        was missing is the counterpart: when a model IS configured, --model must be
        on the argv. The defect satisfied every existing test by taking the
        no-model-specified branch for a project that had in fact specified one.
      acceptance_criteria:
        - A test asserts that with models.execute configured and no --model flag, the claude binary is invoked with --model set to the configured value
        - A test asserts that with no models section at all, no --model flag is passed and the claude CLI default applies, per feature backward-compatibility
        - A test asserts that a --model flag overrides a configured models.execute for that invocation
        - The assertions cover a default-executor attempt specifically, not only the roles that already resolved their model correctly
      spec: model-configuration
      feature_id: cli-model-injection
      hints:
        - internal/claude.go:238 is the guarded append; internal/claude_usage_test.go shows the existing pattern for asserting on constructed argv
        - A regression test that only exercises the escalated executor or a validator would have passed against the defect - the default executor is the path that needs covering
