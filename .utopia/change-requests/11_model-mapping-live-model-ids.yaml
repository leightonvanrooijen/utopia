id: 11_model-mapping-live-model-ids
type: enhancement
title: Stop pinning model aliases to dated identifiers and pass them through to the CLI
status: in-progress
changes:
    - operation: modify
      spec: model-configuration
      feature_id: model-mapping
      description: |
        Validate model aliases and pass them through to the claude CLI unchanged.

        Utopia used to expand each alias into a dated model identifier before
        handing it to the CLI. That expansion is the reason the aliases broke: the
        CLI already resolves 'sonnet' and 'opus' to the current generation, so
        translating them into claude-sonnet-4-20250514 replaced a self-updating
        alias with a pin that silently expired when those models retired.

        Utopia stores no model identifiers. It validates that an alias is one it
        recognises, so a typo in config fails at load time rather than at the
        first Claude invocation, and then forwards the string. A full model
        identifier is also accepted and forwarded unchanged, so a caller who needs
        a specific pinned model can still have one - deliberately, rather than by
        accident.
      criteria:
        add:
            - A recognised alias is passed to the claude CLI unchanged rather than expanded to a model identifier
            - The recognised aliases are haiku, sonnet, opus and fable
            - A full model identifier is accepted and passed through unchanged, so a specific model can be pinned when that is wanted
            - No dated model identifier is stored anywhere in Utopia
            - An unrecognised value that is neither a known alias nor a plausible model identifier produces a clear error at load time rather than at first invocation
        remove:
            - haiku maps to claude-3-5-haiku-20241022
            - sonnet maps to claude-sonnet-4-20250514
            - opus maps to claude-opus-4-20250514
