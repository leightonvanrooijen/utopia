id: 06_observability-unified-output
type: initiative
title: Unify all output onto one leveled, structured output system
status: in-progress
phases:
    - type: refactor
      status: complete
      tasks:
        - id: move-output-package-out-of-cli
          description: |
            internal/ralph, internal/harvest and internal/discover already import
            internal/cli/ui, so domain packages depend on the CLI layer today. That
            inversion is why the unification has never happened: the package is
            reachable, but it lives in the wrong place and nothing outside
            internal/cli is given a Printer to use, so those packages fall back to
            bare fmt.Printf.

            Move the package out from under internal/cli to a neutral location that
            any layer may import, and leave everything else alone. Pure relocation -
            no new methods, no behaviour change, no call-site rewrites beyond the
            import path.
          acceptance_criteria:
            - The output package no longer lives under internal/cli
            - No package outside the CLI layer imports internal/cli
            - Printer, Progress, Summary, Duration and ConfidenceGlyph keep their existing exported names and signatures
            - Every existing call site compiles with only its import path changed
            - Output is byte-identical to before the change, on the same streams
            - go test ./... passes
          hints:
            - Current importers outside the CLI layer are internal/discover/collect.go, internal/discover/discover.go, internal/harvest/harvest.go, internal/ralph/engine.go, internal/ralph/ralph.go and internal/ralph/timing.go
            - The package is 4 files and roughly 220 non-test lines - ui.go, summary.go, progress.go, duration.go
            - Suggested destination is internal/output, but any location outside internal/cli that expresses "results and diagnostics" is acceptable
            - This should be close to a git mv plus an import rewrite - resist the urge to improve the API in this phase
    - type: refactor
      status: complete
      tasks:
        - id: route-all-output-through-one-printer
          description: |
            Roughly 119 bare fmt call sites bypass the Printer entirely, across
            internal/ralph (31 in ralph.go, 7 in ratelimit.go, 3 in engine.go),
            internal/harvest (20), internal/validators (10 in create.go, 8 in
            edit.go), internal/discover (8 in discover.go, 2 in domain.go),
            internal/claude.go (2), internal/store.go (1) and internal/cli/root.go
            (1). None of them can be redirected or captured, because ralph.Execute
            and its peers accept no writer.

            Route every one of them through the relocated Printer, and thread a
            Printer into the packages that need one. Output must not change - not
            the text, not the stream. This phase only makes the output redirectable
            so later phases can level it and reclassify it.
          acceptance_criteria:
            - Every diagnostic and result emitted by internal/ralph, internal/harvest, internal/discover and internal/validators goes through the shared Printer
            - ralph.Execute receives a Printer from its caller rather than writing to the process stdout implicitly
            - No fmt.Print, fmt.Printf or fmt.Println call that writes to the process stdout remains outside the output package itself
            - No direct os.Stdout or os.Stderr reference remains outside the output package, except where a subprocess stream is deliberately wired in internal/claude.go
            - Every message printed before the change is still printed, with byte-identical text, on the same stream
            - A test injects a buffer into ralph.Execute and asserts on captured output, proving redirection works
            - go test ./... passes
          hints:
            - internal/cli already constructs the Printer correctly in 17 places via ui.NewPrinter(cmd.OutOrStdout(), cmd.ErrOrStderr()) - extend that construction outward rather than inventing a second pattern
            - Prefer threading the Printer through the existing config or params structs over adding a positional parameter to ralph.Execute, since the call tree is wide
            - internal/discover/discover.go:32 constructs ui.NewProgress(os.Stdout, ...) directly - it should receive the writer instead
            - Do not touch the failure-output printing paths in internal/ralph/ralph.go around lines 332-343, 355-359 and 570-575; change request 05_unify-failure-output-printing owns those and will land its own shared helper there
            - Interactive prompts in internal/validators/create.go and edit.go are a result, not a diagnostic - route them through the result channel
    - type: feature
      status: in-progress
      changes:
        - operation: add
          spec: observability
          feature:
            id: structured-diagnostics
            description: |
                Diagnostics are emitted through log/slog rather than pre-formatted prose,
                so each one carries a severity and typed key-value attributes. The result
                channel is not routed through slog - a "Created 3 drafts" line is not an
                INFO record, it is the command's answer, and it stays rendered for humans
                on stdout.
            acceptance_criteria:
                - Diagnostics are emitted via log/slog from the standard library
                - No third-party logging dependency is added to go.mod
                - Every diagnostic carries a severity of debug, info, warn or error
                - Contextual values are attached as typed slog attributes rather than interpolated into the message string
                - Diagnostics emitted during an execution run carry cr_id and work_item_id attributes where those are known
                - The default handler renders diagnostics in the existing human-readable form, so terminal output is unchanged for a user who configures nothing
                - The result methods Printf, Successf, Banner, Rule and Summary write to stdout and are not routed through slog
                - A test asserts on a diagnostic by attribute rather than by substring matching the rendered line
            hints:
                - log/slog is in the standard library as of Go 1.21 and this module is on Go 1.25
                - Put the slog.Handler behind the existing diagnostic methods (Progressf, Warnf) so the roughly 172 existing call sites keep working unchanged
                - Add attribute-carrying methods alongside the formatted ones rather than replacing them, so migration to attributes can be incremental
        - operation: add
          spec: observability
          feature:
            id: diagnostic-level-control
            description: |
                A user can raise or lower diagnostic verbosity globally, so a quiet run
                and a deep-debugging run are the same command with a different level. The
                result channel is never suppressed - lowering verbosity must never hide a
                command's answer.
            acceptance_criteria:
                - A UTOPIA_LOG_LEVEL environment variable accepts debug, info, warn and error
                - A --log-level persistent flag on the root command accepts the same values and takes precedence over the environment variable
                - The default level is info
                - Diagnostics below the active level are written to no stream
                - Result output is emitted at every level, including error
                - An invalid level value fails with a clear error naming the accepted values, rather than silently defaulting
                - The existing --verbose and -v flags on discover and discover domain continue to work, and are documented as equivalent to --log-level debug
            hints:
                - Verbose gating currently exists only in Progress.verbose and claude.CLI.WithVerbose - there is no global level today
                - Register the persistent flag in internal/cli/root.go where the Printer is already constructed
    - type: feature
      changes:
        - operation: add
          spec: observability
          feature:
            id: diagnostic-channel-discipline
            description: |
                Progress and status chatter is a diagnostic and belongs on stderr, so
                piping a Utopia command's stdout yields only its result. internal/cli
                already honours this - see the note at internal/cli/root.go that a
                diagnostic "must not land in the stdout a caller pipes". The execution
                loop, harvest and discover do not: roughly 70 semantically diagnostic
                lines land on stdout.
            acceptance_criteria:
                - Progress and status lines emitted by internal/ralph, internal/harvest and internal/discover are written to stderr
                - Piping the stdout of utopia execute yields only result output, with no progress chatter interleaved
                - A test asserts that the Ralph execution loop writes no progress or status line to stdout
                - The step-timing summary is still emitted, on the diagnostic channel
                - The handle resolution ledger from internal/ralph/engine.go is still emitted, on the diagnostic channel
                - Interactive prompts in internal/validators remain on stdout
                - No acceptance criterion in any other spec that requires output on stdout is broken
            hints:
                - Failure-output blocks are deliberately out of scope; the stdout requirements in verification failure-stdout-logging and agentic-validators failure-stdout-logging stay satisfied, and change request 05_unify-failure-output-printing owns those paths
                - The misclassified sites are concentrated in internal/ralph/ralph.go, internal/ralph/ratelimit.go, internal/ralph/engine.go, internal/harvest/harvest.go and internal/discover
                - The roughly 157 existing Progressf call sites are already correctly classified and need no change
    - type: enhancement
      changes:
        - operation: modify
          spec: execution-ralph
          feature_id: step-timing-logs
          description: |
            The execution loop measures and logs the wall-clock duration of each
            expensive step it brackets - the Claude invocation, the verification
            command, and each validator run - so operators can see where time goes
            per iteration. On work-item completion the loop emits a summary that
            breaks the total wall-clock time down by step category.

            Durations augment the existing status lines rather than replacing them,
            keeping the human-readable form. Those lines are diagnostics and are
            emitted on the diagnostic channel, so a caller piping stdout receives
            only the command's result. Timing is captured in the loop itself (start
            marker before the step, elapsed after it), so the Claude and validator
            agents are timed as black-box calls without changing their APIs.
current_phase: 2
