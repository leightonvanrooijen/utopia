id: remove-dead-code
type: refactor
title: Remove all dead code identified by deadcode tool
status: in-progress
tasks:
    - id: remove-analysis-types-dead-files
      description: |
        Delete entirely unused files from internal/analysis/types/:
        - schema.go (and schema_test.go) - SQL/Prisma schema analyzer never integrated
        - relationships.go (and relationships_test.go) - relationship analyzer never used
      acceptance_criteria:
        - schema.go is deleted
        - schema_test.go is deleted
        - relationships.go is deleted
        - relationships_test.go is deleted
        - Build succeeds after deletion
    - id: remove-bounded-context-dead-functions
      description: |
        Remove dead functions from internal/analysis/types/bounded_context.go:
        - contextTitle (line 136)
        - DiscoverBoundedContexts (line 148)
      acceptance_criteria:
        - contextTitle function is removed
        - DiscoverBoundedContexts function is removed
        - Unused imports are removed
        - Build succeeds
    - id: remove-generic-filter-dead-functions
      description: |
        Remove dead functions from internal/analysis/types/generic_filter.go:
        - FilterTerms (line 285)
        - IsPureGenericTerm (line 316)
        - HasGenericSuffix (line 321)
        - HasGenericPrefix (line 331)
        - ExtractDomainTerm (line 352)
      acceptance_criteria:
        - All listed functions are removed
        - Build succeeds
    - id: remove-analyzer-dead-functions
      description: |
        Remove dead functions from internal/analysis/types/analyzer.go:
        - AggregateTerms (line 797)
        - GetHighConfidenceTerms (line 870)
      acceptance_criteria:
        - AggregateTerms function is removed
        - GetHighConfidenceTerms function is removed
        - Build succeeds
    - id: remove-testutil-dead-code
      description: |
        Remove dead code from internal/testutil/:
        - assertions.go: AssertNoError, AssertErrorContains, AssertContains
        - builders.go: CRWithFeatures, NewTestFeature, WithTitle, WithStatus, WithType,
          WithParentSpec, WithAddFeatures, NewTestChangeRequest, NewTestWorkItem, NewTestSpec
        - filesystem.go: SetupTestProject

        If entire files become empty, delete them.
      acceptance_criteria:
        - All listed functions are removed
        - Empty files are deleted
        - Build succeeds
    - id: remove-chunk-dead-functions
      description: |
        Remove dead functions from internal/chunk/chunk.go:
        - looksLikeConstraint (line 423)
        - BuildPrompt (line 488)
      acceptance_criteria:
        - looksLikeConstraint function is removed
        - BuildPrompt function is removed
        - Build succeeds
    - id: remove-domain-discovery-dead-function
      description: |
        Remove dead function from internal/domain/discovery.go:
        - IsSpecWorthy method on SpecQualificationCriteria (line 150)
      acceptance_criteria:
        - IsSpecWorthy function is removed
        - Build succeeds
    - id: remove-claude-dead-functions
      description: |
        Remove dead functions from internal/claude.go:
        - WithBinaryPath (line 49)
        - WithPermissionMode (line 55)
      acceptance_criteria:
        - WithBinaryPath function is removed
        - WithPermissionMode function is removed
        - Build succeeds
    - id: remove-store-dead-functions
      description: |
        Remove dead functions from internal/store.go:
        - SaveADR (line 511)
        - LoadADR (line 519)
      acceptance_criteria:
        - SaveADR function is removed
        - LoadADR function is removed
        - Build succeeds
    - id: verify-no-dead-code-remains
      description: |
        Run deadcode tool to verify all dead code has been removed
      acceptance_criteria:
        - deadcode ./... returns no unreachable functions
        - All tests pass
        - Build succeeds
