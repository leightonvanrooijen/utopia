id: adoption-parallel-refinement-agents
type: enhancement
title: Parallel refinement agents with tool-based codebase exploration
status: draft
changes:
  - operation: modify
    spec: adoption
    feature_id: discover-command
    description: |
      Replace the sequential 3-stage pipeline with a 2-stage architecture:

      Stage 1 (Identify + Qualify): Scans codebase, identifies candidates, and
      applies qualification criteria to filter. Merges current stages 1 & 2.

      Stage 2 (Parallel Refinement): Spawns one Claude Code agent per qualified
      candidate. Each agent has full tool access (Read, Grep, Glob) to explore
      the codebase deeply based on what's in the candidate spec. Agents refine
      until quality threshold is met.

      Key changes:
      - Later stages no longer lose code context (agents can fetch what they need)
      - Parallel execution for faster discovery on large codebases
      - Each spec gets dedicated deep attention rather than shared context budget
      - Quality can be iteratively improved per-spec
    criteria:
      add:
        - "Stage 2 spawns one agent per qualified candidate (parallel execution)"
        - "Each refinement agent has access to Claude Code tools: Read, Grep, Glob"
        - "Agents explore codebase based on source_files and evidence from candidate"
        - "Refinement agents run for a fixed number of iterations (default: 3)"
        - "Each iteration improves the spec and may discover missing details"
        - "No quality threshold checks - iteration naturally improves output"
        - "After all iterations, spec is saved regardless of quality"
        - "Specs that still have gaps after iteration are saved as low-confidence drafts"
        - "Concurrency managed by Claude Code (no custom batching needed)"
      remove:
        - "Discovery uses sequential multi-agent pipeline (3 stages)"
        - "'Stage 1 (Candidate Agent): Scans all text files to find potential user-observable capabilities'"
        - "'Stage 2 (Qualifier Agent): Applies qualification/disqualification criteria to filter candidates'"
        - "'Stage 3 (Refinement Agent): Sharpens descriptions and ensures acceptance criteria are testable'"
        - "Each stage receives output from previous stage (no parallel execution)"
