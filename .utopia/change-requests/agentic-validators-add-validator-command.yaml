id: agentic-validators-add-validator-command
type: feature
title: Add AI-assisted validator management commands
status: in-progress
changes:
    - operation: add
      spec: agentic-validators
      feature:
        id: validator-command
        description: |
            Base command for managing validators with subcommands for create, edit, and delete.
        acceptance_criteria:
            - Running `utopia validator` with no subcommand shows help with available subcommands
            - Subcommands are create, edit, and delete
            - Command follows existing CLI patterns in the codebase
    - operation: add
      spec: agentic-validators
      feature:
        id: validator-create-command
        description: |
            Interactive AI assistant that guides users through creating new validators.
            The AI understands best practices for writing effective validation prompts
            and can ingest existing documents or code as reference material.
        acceptance_criteria:
            - Running `utopia validator create` starts an interactive AI conversation
            - AI asks what aspect of code the user wants to validate
            - AI can read existing files when user references them (docs, code examples)
            - AI extracts patterns from referenced files to inform validator creation
            - AI generates a complete validator .md file with frontmatter and prompt
            - AI explains its choices and asks for confirmation before writing
            - Created validator is saved to .utopia/validators/ directory
            - User is prompted to add validator to config if not already listed
        hints:
            - Use Claude CLI for the AI conversation (similar to Ralph execution)
            - The AI prompt should be stored as an embedded resource or template
            - Look at internal/execution/ralph.go for patterns on invoking Claude
    - operation: add
      spec: agentic-validators
      feature:
        id: validator-edit-command
        description: |
            Interactive AI assistant for modifying existing validators.
            Lists available validators, lets user select one, then provides
            AI-assisted editing with the same knowledge as the create command.
        acceptance_criteria:
            - Running `utopia validator edit` lists all configured validators
            - User can select a validator by number or name
            - AI loads the selected validator and understands its current state
            - AI asks what changes the user wants to make
            - AI can read additional files if user references them for context
            - AI shows proposed changes and asks for confirmation before saving
            - Original validator is updated in place
        hints:
            - Share the core AI assistant prompt with validator-create-command
            - Inject the existing validator content as context for the AI
    - operation: add
      spec: agentic-validators
      feature:
        id: validator-delete-command
        description: |
            Remove a validator file and optionally update the project config.
        acceptance_criteria:
            - Running `utopia validator delete` lists all configured validators
            - User can select a validator by number or name
            - Command asks for confirmation before deleting
            - Validator file is removed from .utopia/validators/
            - User is prompted to remove validator from config if still listed
            - Provides clear feedback on what was deleted
    - operation: add
      spec: agentic-validators
      feature:
        id: validator-assistant-prompt
        description: |
            The system prompt that powers the AI assistant for create and edit commands.
            Encodes best practices for writing effective validation agents including
            prompt engineering, agent evaluation patterns, and verbose feedback.
        acceptance_criteria:
            - Prompt includes knowledge of validator file format (YAML frontmatter + markdown)
            - Prompt includes best practices for grading outputs vs. prescribing paths
            - Prompt includes guidance on writing verbose, actionable feedback messages
            - Prompt includes guidance on unambiguous pass/fail criteria
            - Prompt includes knowledge of run triggers (after-workitem, after-phase, on-demand)
            - Prompt includes knowledge of allowed_tools options and their purposes
            - Prompt instructs AI to read referenced files when user mentions them
            - Prompt instructs AI to extract patterns from example code/docs
            - Prompt instructs AI to explain trade-offs and ask clarifying questions
            - Prompt is stored as an embedded template (not hardcoded in Go)
        hints:
            - Consider using Go embed for the prompt template
            - |
              Key best practices to encode from research:
              - "Grade what the agent produced, not the path it took"
              - "Make validation scripts verbose with specific error messages"
              - "Include both positive cases and negative cases"
              - "Create tasks where domain experts would independently reach the same pass/fail verdict"
            - Reference https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents
            - Reference https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices
