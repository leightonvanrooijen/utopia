id: log-validation-failures-to-stdout
type: feature
title: Log validation failures to stdout
status: in-progress
changes:
    - operation: add
      spec: verification
      feature:
        id: failure-stdout-logging
        description: |
            Print verification failure output to stdout so humans can see the same
            information that gets fed to the AI runner.
        acceptance_criteria:
            - When verification fails, captured output is printed to stdout
            - Output is printed before being injected into the AI retry prompt
            - Uses the same content that would be fed to the AI (truncated if applicable)
    - operation: add
      spec: agentic-validators
      feature:
        id: failure-stdout-logging
        description: |
            Print validator failure output to stdout so humans can see the same
            information that gets fed to the AI runner.
        acceptance_criteria:
            - When a validator fails, its ID and failure feedback are printed to stdout
            - Output is printed before being injected into the AI retry prompt
            - Uses the same content that would be fed to the AI for retry
