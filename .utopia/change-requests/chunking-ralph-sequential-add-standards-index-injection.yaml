id: chunking-ralph-sequential-add-standards-index-injection
type: feature
title: Inject standards index into work-item prompts for on-demand loading
status: in-progress
changes:
    - operation: add
      spec: chunking-ralph-sequential
      feature:
        id: standards-index-injection
        description: |
            When building work-item prompts, the chunker reads the YAML frontmatter
            of every doc in .utopia/standards/ and injects a compact STANDARDS index
            section into the prompt. The index works like skill discovery via
            progressive disclosure: only lightweight metadata (id, description,
            tags, path) is always present, and the executor reads the full docs it
            judges relevant before implementing. This keeps the chunker
            deterministic while placing semantic relevance matching with the
            executor, who knows which files the task actually touches.
        acceptance_criteria:
            - Work-item prompts include a STANDARDS section when .utopia/standards/ contains at least one doc
            - The STANDARDS section lists each doc's id, description, tags, and file path
            - The STANDARDS section instructs the executor to read relevant standards docs from .utopia/standards/ before implementing
            - Only frontmatter metadata is injected into the prompt, never full doc content
            - No STANDARDS section is injected when .utopia/standards/ is missing or empty
            - Docs with unparseable frontmatter are skipped without failing the chunk operation
        hints:
            - Follow the hints-injection pattern in internal/chunk/chunk.go - add a Standards field to the prompt template data and a STANDARDS section to the prompt template
            - Frontmatter format is defined by the standards-generation feature of the standards spec (id, title, description, tags)
            - Retry prompts rebuilt via BuildPromptWithConstraints should include the index for free - verify this path is covered
