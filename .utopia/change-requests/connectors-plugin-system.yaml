id: connectors-plugin-system
type: initiative
title: Lifecycle event connectors - language-agnostic plugin system for the ralph loop
status: in-progress
phases:
    - type: refactor
      status: complete
      tasks:
        - id: ralph-lifecycle-event-dispatcher
          description: |
            Refactor the ralph execution loop to emit named lifecycle events through an
            internal dispatcher, instead of hardcoding extension call sites. The dispatcher
            is internal Go plumbing only in this phase - no subscribers are configurable yet.
            All existing behavior (verification, validators, git commits, failure injection)
            is preserved exactly.

            Events emitted, in loop order:
            - execution-started: before the first work item begins
            - workitem-started: when a work item begins execution
            - workitem-verified: after verification passes, before the work item commit
            - workitem-committed: after the work item commit
            - phase-verified: after all work items complete and after-phase validators pass, before the after-phase commit
            - phase-completed: after the after-phase commit
            - execution-completed: when the loop exits with all work items completed
            - execution-failed: when the loop exits with a failure
          acceptance_criteria:
            - An Event type exists carrying the event name and a structured payload
            - Payload includes cr_id, cr_title, and spec_id on every event
            - workitem-scoped events additionally include work_item_id and iteration_count
            - post-commit events (workitem-committed, phase-completed) additionally include commit_sha
            - execution-failed additionally includes a failure reason
            - The ralph loop emits all eight events at the documented points in loop order
            - A dispatcher component receives every emitted event and supports registered subscribers
            - With no subscribers registered, utopia execute behaves identically to before the refactor
            - Existing verification, validator, and git commit behavior is unchanged
            - Existing ralph loop tests pass without modification to their assertions
          hints:
            - Call sites live in internal/ralph/ralph.go - Execute, executeWorkItem, gitCommitWorkItem, runAfterPhaseValidators, gitCommitAfterPhase
            - Follow the dependency-wiring style used for validators.Runner in Execute
            - Do not port verification/validators onto the dispatcher in this phase - just add emission alongside them
    - type: feature
      status: in-progress
      changes:
        - operation: add
          spec: connectors
          feature:
            id: connector-config
            description: |
                Users register connectors in project config. Each entry names the connector,
                lists the lifecycle events it subscribes to, the command to execute, and its mode.
            acceptance_criteria:
                - Config has an optional connectors array
                - Each entry has name (string), on (list of lifecycle event names), command (string), and optional mode
                - mode is one of gating or notify, defaulting to notify
                - Each entry has an optional timeout field (duration string)
                - Config validation rejects unknown event names in on
                - Config validation rejects mode gating on events where gating has no semantics (workitem-committed, phase-completed, execution-completed, execution-failed)
            hints:
                - Config struct lives in internal/domain/discovery.go - follow the Validators []ValidatorConfig pattern
        - operation: add
          spec: connectors
          feature:
            id: connector-runner
            description: |
                Executes connector commands when their subscribed events fire. The command
                receives the event payload as JSON on stdin plus UTOPIA_EVENT, UTOPIA_CR_ID,
                and UTOPIA_PROJECT_DIR environment variables, making connectors writable in
                any language that can read stdin and parse JSON.
            acceptance_criteria:
                - When an event fires, all connectors subscribed to it run sequentially in config order
                - The connector process receives the full event payload as JSON on stdin
                - The connector process receives UTOPIA_EVENT, UTOPIA_CR_ID, and UTOPIA_PROJECT_DIR environment variables
                - Commands run with the project directory as working directory
                - Connector stdout and stderr are captured
                - A connector exceeding its timeout is killed and treated as failed
            hints:
                - Follow the exec.Command shell-out pattern in internal/git/git.go
                - Wire the runner as a dispatcher subscriber from phase 1, not as new hardcoded call sites in ralph.go
        - operation: add
          spec: connectors
          feature:
            id: connector-gating-mode
            description: |
                Gating connectors block loop progression using git-hook semantics - exit code 0
                means proceed, non-zero means block. What blocking means depends on the event
                where the gate sits.
            acceptance_criteria:
                - A gating connector exiting 0 lets the loop proceed unchanged
                - A gating connector exiting non-zero on execution-started or workitem-started aborts the run with the connector's stdout in the error
                - A gating connector exiting non-zero on workitem-verified injects its stdout as feedback into the next loop iteration and prevents the work item commit
                - A gating connector exiting non-zero on phase-verified injects its stdout as feedback into an after-phase fix iteration and prevents the after-phase commit
                - A gating connector timeout is treated as a non-zero exit
            hints:
                - Feedback injection channel already exists - item.LastValidatorFeedback woven into the next prompt in internal/ralph/ralph.go
        - operation: add
          spec: connectors
          feature:
            id: connector-notify-mode
            description: |
                Notify connectors are fire-and-forget side effects. Failures are logged and
                never block or fail the run.
            acceptance_criteria:
                - A notify connector exiting non-zero does not stop the loop or change the run result
                - Notify connector failures are logged with the connector name, exit code, and captured output
                - A notify connector timeout is logged and does not block the run
current_phase: 1
