transcript: |-
  --- iteration 1 ---
  I'll look at the existing test patterns and the executor code.Verification pass. All six criteria already covered in HEAD; no code or test change needed.

  **Executor layer** - `internal/ralph/execute_model_test.go:24` `TestExecute_DefaultExecutorModelReachesTheBinary` drives real `Execute` attempts against stand-in claude on PATH, asserts recorded argv, one spawn per case:
  - `models.execute` = sonnet reaches binary
  - `models.default` = haiku reaches binary when execute absent
  - `models` nil yields `--model sonnet` (backward-compat)
  - `--model fable` overrides configured `models.execute`, `notWant` proves replacement

  **Wrapper layer** - `internal/claude_test.go:352` `no model omits the flag` asserts empty model parameter puts no `--model` on argv, covering "claude CLI uses its default" where an empty model can actually occur (`internal/claude.go:238` guarded append).

  **Sixth criterion negative** - grep `--model` across `internal/ralph/*_test.go`: only the four positive cases plus comment prose. No absent-flag assertion at executor layer, so nothing contradicts the sibling task.

  Rejected alternative (recorded in commit): fifth executor case with `models` nil expecting no flag - unreachable state, would fail against correct behavior.

  `go build ./... && go test ./internal/...` green, 1466 tests.

  <COMPLETE>
  --- iteration 2 ---
  I'll start by reading the relevant files to understand the current state.Now I'll rewrite the test cases so each fixture value is distinguishable from every other branch of the resolution chain.Now I'll mutation-test: temporarily break the resolution to confirm each case actually fails.Case 1 now catches the exact defect. Now the original defect shape:Root cause of prior failure: case 1 fixture `Execute: "sonnet"` collided with the chain's terminal fallback, so the assertion could not fail for the behaviour it named.

  Fix - each case pins a value no other branch can produce:

  | case | fixture | want | notWant |
  |---|---|---|---|
  | models.execute | `Execute: "opus", Default: "haiku"` | `--model opus` | `--model haiku`, `--model sonnet` |
  | models.default | `Default: "haiku"` | `--model haiku` | `--model sonnet` |
  | no models section | `nil` | `--model sonnet` | - |
  | `--model` override | `Execute: "opus"`, override `fable` | `--model fable` | `--model opus`, `--model sonnet` |

  `notWant` widened to `[]string`. Entries match `--model <value>` not bare name - recorded argv includes prompt text, bare `sonnet` risks false match.

  Verified by mutation, not inspection:
  - `return override` (original defect) - cases 1, 2, 3 fail
  - skip `models.execute`, read only `models.default` - case 1 fails, the exact gap the previous version missed

  Criterion 5 already held at `internal/claude_test.go:353` (`no model omits the flag`). Criterion 6 holds - no default-executor case asserts an absent `--model`; grep for bare `"--model"` in `internal/ralph/` returns nothing.

  Full suite: 1466 passed, 15 packages.

