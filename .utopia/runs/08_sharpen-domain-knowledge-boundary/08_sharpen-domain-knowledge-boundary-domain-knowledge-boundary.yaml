  {"type":"user","message":{"role":"user","content":[{"tool_use_id":"toolu_01Ni6Ac4Npa35kMN3b6h2TbK","type":"tool_result","content":"    - id: domain-qualification-criteria\n      description: |\n        Criteria that define what qualifies as Domain documentation, based on\n        Domain-Driven Design's Ubiquitous Language concept. Domain docs capture\n        canonical vocabulary within a bounded context.\n      acceptance_criteria:\n        - 'Qualification: term is specific to this project''s domain, not general programming'\n        - 'Qualification: term has a precise meaning that could be misunderstood without definition'\n        - 'Qualification: term should be used consistently across code, docs, and communication'\n        - 'Qualification: domain experts would recognize and validate this term'\n        - 'Qualification: ambiguity would arise without a canonical definition'\n        - 'Qualification: term appears in code (class names, methods, variables) or should'\n        - 'Litmus test: ''Would ambiguity arise without this definition?'' YES = Document'\n        - Qualification test is applied before suggesting Domain doc creation\n\n    - id: domain-disqualification-criteria\n      description: |\n        Criteria that disqualify content from being Domain documentation,\n        even if it superficially defines a term.\n      acceptance_criteria:\n        - 'Disqualified: term is general programming knowledge (e.g., ''function'', ''class'', ''API'')'\n        - 'Disqualified: term is a standard industry term used in its standard way'\n        - 'Disqualified: term is temporary or experimental (prototype names, working titles)'\n        - 'Disqualified: term is an implementation detail not representing a domain concept'\n        - 'Disqualified: term is already well-defined in external documentation we reference'\n        - 'Disqualified: definition is a one-off explanation, not canonical vocabulary'\n        - Disqualification criteria are checked before suggesting Domain doc creation\n\n    - id: domain-bounded-context\n      description: |\n        Domain documentation is organized by bounded context per DDD principles.\n        The same term can have different meanings in different contexts.\n      acceptance_criteria:\n        - Each Domain doc belongs to exactly one bounded context\n        - Bounded context is identified by a clear scope (e.g., \"execution\", \"change-requests\", \"verification\")\n        - Terms are precise within their bounded context, not globally\n        - When the same word means different things in different contexts, create separate terms in each context's Domain doc\n        - Cross-context term usage should be explicitly noted when relevant\n\n    - id: domain-code-alignment\n      description: |\n        Domain terms must align with code naming. If a term is documented,\n        the code should use that exact term. If code uses a term, it should\n        be documented.\n      acceptance_criteria:\n        - Documented terms should appear in code (class names, method names, variable names)\n        - Code naming should match documented canonical terms, not synonyms\n        - Aliases capture alternative names that might appear but canonical term is preferred\n        - Misalignment between code and docs is a signal to update one or the other","is_error":false}]},"parent_tool_use_id":null,"session_id":"049fb563-b444-49a8-8b1d-63b4fe89edf7","uuid":"60e38e32-eaac-441d-832a-35699471de7d","timestamp":"2026-07-31T09:46:38.710Z","tool_use_result":{"stdout":"    - id: domain-qualification-criteria\n      description: |\n        Criteria that define what qualifies as Domain documentation, based on\n        Domain-Driven Design's Ubiquitous Language concept. Domain docs capture\n        canonical vocabulary within a bounded context.\n      acceptance_criteria:\n        - 'Qualification: term is specific to this project''s domain, not general programming'\n        - 'Qualification: term has