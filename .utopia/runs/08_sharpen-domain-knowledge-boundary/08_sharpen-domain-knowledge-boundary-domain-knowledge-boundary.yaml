  {"type":"user","message":{"role":"user","content":[{"tool_use_id":"toolu_01XGvnJczCsRBcgQXz6TXVE8","type":"tool_result","content":"330\t}\n331\t\n332\t// =============================================================================\n333\t// Spec Qualification Types\n334\t// =============================================================================\n335\t\n336\t// SpecQualificationCriteria defines what makes a candidate spec-worthy.\n337\t// Core principle: Specs answer \"what can I do?\" not \"how is it built?\"\n338\t//\n339\t// Qualification criteria are applied by the Qualifier Agent during discovery\n340\t// to filter candidates before they become draft specifications.\n341\ttype SpecQualificationCriteria struct{}\n342\t\n343\t// QualificationResult represents whether a candidate passes qualification\n344\t// and why.\n345\ttype QualificationResult struct {\n346\t\tQualified bool\n347\t\tReason    string\n348\t}\n349\t\n350\t// Qualifications returns the criteria that must ALL be satisfied for a\n351\t// candidate to become a draft spec.\n352\t//\n353\t// A spec-worthy candidate:\n354\t//  1. Describes a user-observable capability (command, output, interaction, behavior)\n355\t//  2. Can be verified by using the system (testable from outside)\n356\t//  3. Represents a coherent, bounded feature users care about\n357\t//  4. Description focuses on WHAT users can achieve, not HOW it's implemented\n358\tfunc (c SpecQualificationCriteria) Qualifications() []string {\n359\t\treturn []string{\n360\t\t\t\"Capability is user-observable (command, output, interaction, behavior)\",\n361\t\t\t\"Capability can be verified by using the system (testable from outside)\",\n362\t\t\t\"Capability represents a coherent bounded feature users care about\",\n363\t\t\t\"Description focuses on WHAT users can achieve, not HOW it's implemented\",\n364\t\t}\n365\t}\n366\t\n367\t// AcceptanceCriteriaRequirements returns the constraints on acceptance criteria\n368\t// for qualified specs.\n369\tfunc (c SpecQualificationCriteria) AcceptanceCriteriaRequirements() []string {\n370\t\treturn []string{\n371\t\t\t\"Acceptance criteria describe observable outcomes, not internal state\",\n372\t\t}\n373\t}\n374\t\n375\t// Disqualifications returns criteria where ANY match disqualifies a candidate.\n376\t// These are implementation details that should not become specs.\n377\tfunc (c SpecQualificationCriteria) Disqualifications() []string {\n378\t\treturn []string{\n379\t\t\t\"Implementation details (data structures, algorithms, patterns used)\",\n380\t\t\t\"Internal code organization (services, handlers, repositories, utils)\",\n381\t\t\t\"Technical plumbing users don't interact with (middleware, adapters)\",\n382\t\t\t\"Standard practices covered by language/framework conventions\",\n383\t\t\t\"Infrastructure concerns (logging, monitoring, deployment)\",\n384\t\t\t\"Code quality practices (error handling patterns, validation approaches)\",\n385\t\t\t\"Architectural decisions (those belong in ADRs)\",\n386\t\t\t\"Domain vocabulary definitions (those belong in Domain docs)\",\n387\t\t}\n388\t}\n389\t\n390\t// LitmusTest returns the core question to determine spec-worthiness.\n391\t// If the answer is YES, the candidate is spec-worthy.\n392\tfunc (c SpecQualificationCriteria) LitmusTest() string {\n393\t\treturn \"Could a user verify this by using the system?\"\n394\t}\n395\t\n396\t// FormatForAgent returns the qualification criteria formatted for inclusion\n397\t// in agent prompts. This ensures consistency between the domain definition\n398\t// and the agent's instructions.\n399\tfunc (c SpecQualificationCriteria) FormatForAgent() string {\n400\t\tvar sb strings.Builder\n401\t\n402\t\tsb.WriteString(\"## Qualification Criteria (ALL must be true)\\n\")\n403\t\tfor i, q := range c.Qualifications() {\n404\t\t\tsb.WriteString(fmt.Sprintf(\"%d. %s\\n\", i+1, q))\n405\t\t}\n406\t\tfor i, r := range c.AcceptanceCriteriaRequirements() {\n407\t\t\tsb.WriteString(fmt.Sprintf(\"%d. %s\\n\", len(c.Qualifications())+i+1, r))\n408\t\t}\n409\t\n410\t\tsb.WriteString(\"\\n## Litmus Test\\n\")\n411\t\tsb.WriteString(fmt.Sprintf(\"Ask: %q\\n\", c.LitmusTest()))\n412\t\tsb.WriteString(\"YES = Spec worthy\\n\")\n413\t\tsb.WriteString(\"NO = Implementation detail, disqualify\\n\")\n414\t\n415\t\tsb.WriteString(\"\\n## Disqualification Criteria (ANY disqualifies)\\n\")\n416\t\tfor _, d := range c.Disqualifications() {\n417\t\t\tsb.WriteString(fmt.Sprintf(\"- %s\\n\", d))\n418\t\t}\n419\t\n420\t\treturn strings.TrimSuffix(sb.String(), \"\\n\")\n421\t}\n422\t\n423\t// =============================================================================\n424\t// Draft Spec Types\n425\t// =============================================================================\n426\t\n427\t// DraftConfidence indicates how confident we are in a draft spec\n428\ttype DraftConfidence string\n429\t"}]},"parent_tool_use_id":null,"session_id":"049fb563-b444-49a8-8b1d-63b4fe89edf7","uuid":"310d0796-4c23-4dd5-ac6f-45173375aaca","timestamp":"2026-07-31T09:46:59.762Z","tool_use_result":{"type":"text","file":{"filePath":"/Users/leighton.vanrooijen/projects/utopia/internal/domain/discovery.go","content":"}\n\n// =============================================================================\n// Spec Qualification Types\n// =============================================================================\n\n// SpecQualificationCriteria defines what makes a candidate spec-worthy.\n// Core principle: Specs answer \"what can I do?\" not \"how is it built?\"\n//\n// Qualification criteria are applied by the Qualifier Agent during discovery\n// to filter candidates before they become draft specifications.\ntype SpecQualificationCriteria struct{}\n\n// QualificationResult represents whether a candidate passes qualification\n// and why.\ntype QualificationResult struct {\n\tQualified bool\n\tReason    string\n}\n\n// Qualifications returns the criteria that must ALL be satisfied for a\n// candidate to become a draft spec.\n//\n// A spec-worthy candidate:\n//  1. Describes a user-observable capability (command, output, interaction, behavior)\n//  2. Can be verified by using the system (testable from outside)\n//  3. Represents a coherent, bounded feature users care about\n//  4. Description focuses on WHAT users can achieve, not HOW it's implemented\nfunc (c SpecQualificationCriteria) Qualifications() []string {\n\treturn []string{\n\t\t\"Capability is user-observable (command, output, interaction, behavior)\",\n\t\t\"Capability can be verified by using the system (testable from outside)\",\n\t\t\"Capability represents a coherent bounded feature users care about\",\n\t\t\"Description focuses on WHAT users can achieve, not HOW it's implemented\",\n\t}\n}\n\n// AcceptanceCriteriaRequirements returns the constraints on acceptance criteria\n// for qualified specs.\nfunc (c SpecQualificationCriteria) AcceptanceCriteriaRequirements() []string {\n\treturn []string{\n\t\t\"Acceptance criteria describe observable outcomes, not internal state\",\n\t}\n}\n\n// Disqualifications returns criteria where ANY match disqualifies a candidate.\n// These are implementation details that should not become specs.\nfunc (c SpecQualificationCriteria) Disqualifications() []string {\n\treturn []string{\n\t\t\"Implementation details (data structures, algorithms, patterns used)\",\n\t\t\"Internal code organization (services, handlers, repositories, utils)\",\n\t\t\"Technical plumbing users don't interact with (middleware, adapters)\",\n\t\t\"Standard practices covered by language/framework conventions\",\n\t\t\"Infrastructure concerns (logging, monitoring, deployment)\",\n\t\t\"Code quality practices (error handling patterns, validation approaches)\",\n\t\t\"Architectural decisions (those belong in ADRs)\",\n\t\t\"Domain vocabulary definitions (those belong in Domain docs)\",\n\t}\n}\n\n// LitmusTest returns the core question to determine spec-worthiness.\n// If the answer is YES, the candidate is spec-worthy.\nfunc (c SpecQualificationCriteria) LitmusTest() string {\n\treturn \"Could a user verify this by using the system?\"\n}\n\n// FormatForAgent returns the qualification criteria formatted for inclusion\n// in agent prompts. This ensures consistency between the domain definition\n// and the agent's instructions.\nfunc (c SpecQualificationCriteria) FormatForAgent() string {\n\tvar sb strings.Builder\n\n\tsb.WriteString(\"## Qualification Criteria (ALL must be true)\\n\")\n\tfor i, q := range c.Qualifications() {\n\t\tsb.WriteString(fmt.Sprintf(\"%d. %s\\n\", i+1, q))\n\t}\n\tfor i, r := range c.AcceptanceCriteriaRequirements() {\n\t\tsb.WriteString(fmt.Sprintf(\"%d. %s\\n\", len(c.Qualifications())+i+1, r))\n\t}\n\n\tsb.WriteString(\"\\n## Litmus Test\\n\")\n\tsb.WriteString(fmt.Sprintf(\"Ask: %q\\n\", c.LitmusTest()))\n\tsb.WriteString(\"YES = Spec worthy\\n\")\n\tsb.WriteString(\"NO = Implementation detail, disqualify\\n\")\n\n\tsb.WriteString(\"\\n## Disqualification Criteria (ANY disqualifies)\\n\")\n\tfor _, d := range c.Disqualifications() {\n\t\tsb.WriteString(fmt.Sprintf(\"- %s\\n\", d))\n\t}\n\n\treturn strings.TrimSuffix(sb.String(), \"\\n\")\n}\n\n// =============================================================================\n// Draft Spec Types\n// =============================================================================\n\n// DraftConfidence indicates how confident we are in a draft spec\ntype DraftConfidence string\n","numLines":100,"startLine":330,"totalLines":566}}}
