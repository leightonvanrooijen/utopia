  {"type":"user","message":{"role":"user","content":[{"tool_use_id":"toolu_01KC5WPyLmKstPEi5W7SxH9J","type":"tool_result","content":"278\t**Litmus Test:** \"Would ambiguity arise without this canonical definition?\"\n279\t- YES = Document this term\n280\t- NO = Don't clutter the domain vocabulary\n281\t\n282\t**Only suggest Domain doc creation when:**\n283\t- The term passes Domain Specificity (specific to our domain), AND\n284\t- The term passes Precision Test (could be misunderstood), AND\n285\t- The term passes Consistency Test (should be used consistently), AND\n286\t- The term passes Code Alignment Test (appears or should appear in code), AND\n287\t- None of the disqualification criteria apply, AND\n288\t- The litmus test passes (ambiguity would arise without definition)\n289\t\n290\t**Applying this test to terms introduced in execution runs:**\n291\tRuns are where vocabulary gets coined - the name is chosen at the code, often with no\n292\tconversation behind it, and it is load-bearing the moment it is committed. Apply the\n293\tSAME test, unchanged. The ambiguity litmus test decides; where the term was coined\n294\tdoes not.\n295\t- A run-coined term passes the Code Alignment Test by construction - it is already in\n296\t  the code. That is one test of five, not a free pass: the term must still be specific\n297\t  to our domain and ambiguous without a definition. Do NOT promote every identifier a\n298\t  run introduces\n299\t- \"Implementation detail\" disqualifies internal naming that stands for no domain concept -\n300\t  a helper function, a loop variable, a test fixture. A run that names a new type, a\n301\t  status value, a persisted artifact, or the directory it lives in has named a concept\n302\t- A run that uses a DIFFERENT word for an already-documented term has introduced an\n303\t  alias, not a new term - suggest UPDATE of the existing bounded context to record the\n304\t  alias, and name the term that drifted. The Domain Docs section above lists each term's\n305\t  recorded aliases: a word already listed there is documented drift, not a candidate\n306\t- A term the run coined and then abandoned is a working title - disqualified\n307\t- Cross-reference every term surfaced from a run to its CR and its originating\n308\t  conversation, and record the run when creating or updating the document\n309\t\n310\tFor EACH qualified candidate, capture:\n311\t- **ID**: Unique identifier (adr-1, concept-1, domain-1, etc.)\n312\t- **Type**: adr, concept, or domain"}]},"parent_tool_use_id":null,"session_id":"049fb563-b444-49a8-8b1d-63b4fe89edf7","uuid":"ee41974e-7117-4230-80ce-9f359380b05e","timestamp":"2026-07-31T09:47:40.955Z","tool_use_result":{"type":"text","file":{"filePath":"/Users/leighton.vanrooijen/projects/utopia/internal/harvest/harvest.go","content":"**Litmus Test:** \"Would ambiguity arise without this canonical definition?\"\n- YES = Document this term\n- NO = Don't clutter the domain vocabulary\n\n**Only suggest Domain doc creation when:**\n- The term passes Domain Specificity (specific to our domain), AND\n- The term passes Precision Test (could be misunderstood), AND\n- The term passes Consistency Test (should be used consistently), AND\n- The term passes Code Alignment Test (appears or should appear in code), AND\n- None of the disqualification criteria apply, AND\n- The litmus test passes (ambiguity would arise without definition)\n\n**Applying this test to terms introduced in execution runs:**\nRuns are where vocabulary gets coined - the name is chosen at the code, often with no\nconversation behind it, and it is load-bearing the moment it is committed. Apply the\nSAME test, unchanged. The ambiguity litmus test decides; where the term was coined\ndoes not.\n- A run-coined term passes the Code Alignment Test by construction - it is already in\n  the code. That is one test of five, not a free pass: the term must still be specific\n  to our domain and ambiguous without a definition. Do NOT promote every identifier a\n  run introduces\n- \"Implementation detail\" disqualifies internal naming that stands for no domain concept -\n  a helper function, a loop variable, a test fixture. A run that names a new type, a\n  status value, a persisted artifact, or the directory it lives in has named a concept\n- A run that uses a DIFFERENT word for an already-documented term has introduced an\n  alias, not a new term - suggest UPDATE of the existing bounded context to record the\n  alias, and name the term that drifted. The Domain Docs section above lists each term's\n  recorded aliases: a word already listed there is documented drift, not a candidate\n- A term the run coined and then abandoned is a working title - disqualified\n- Cross-reference every term surfaced from a run to its CR and its originating\n  conversation, and record the run when creating or updating the document\n\nFor EACH qualified candidate, capture:\n- **ID**: Unique identifier (adr-1, concept-1, domain-1, etc.)\n- **Type**: adr, concept, or domain","numLines":35,"startLine":278,"totalLines":1131}}}
