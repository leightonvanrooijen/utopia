iled to write fake claude: %v\", err)\n\t}\n\tt.Setenv(\"PATH\", dir+string(os.PathListSeparator)+os.Getenv(\"PATH\"))\n}\n\n// initGitRepo makes projectDir a repository with one commit, so the validators'\n// diff computes and the gate blocks on the validator invocation under test rather\n// than on a missing repository.\nfunc initGitRepo(t *testing.T, dir string) {\n\tt.Helper()\n\n\trun := func(args ...string) {\n\t\tcmd := exec.Command(\"git\", args...)\n\t\tcmd.Dir = dir\n\t\tif out, err := cmd.CombinedOutput(); err != nil {\n\t\t\tt.Fatalf(\"git %v = %v: %s\", args, err, out)\n\t\t}\n\t}\n\trun(\"init\")\n\trun(\"config\", \"user.email\", \"test@example.com\")\n\trun(\"config\", \"user.name\", \"Test User\")\n\tif err := os.WriteFile(filepath.Join(dir, \"file.txt\"), []byte(\"initial\\n\"), 0o644); err != nil {\n\t\tt.Fatalf(\"failed to write file: %v\", err)\n\t}\n\trun(\"add\", \".\")\n\trun(\"commit\", \"-m\", \"initial\")\n}"},"caller":{"type":"direct"}}],"stop_reason":null,"stop_sequence":null,"stop_details":null,"usage":{"input_tokens":2,"cache_creation_input_tokens":839,"cache_read_input_tokens":103492,"cache_creation":{"ephemeral_5m_input_tokens":0,"ephemeral_1h_input_tokens":839},"output_tokens":55,"service_tier":"standard","inference_geo":"not_available"},"diagnostics":null,"context_management":null},"parent_tool_use_id":null,"session_id":"5fa8296d-43cc-4cc8-b010-9d1068f6b287","uuid":"bebe792f-db99-40b7-ab2e-4cb0e402286c","timestamp":"2026-07-31T01:49:32.757Z","request_id":"req_011CdZJ4yhkuaaYN1913u2tC"}
