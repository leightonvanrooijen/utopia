  {"type":"user","message":{"role":"user","content":[{"tool_use_id":"toolu_018iMvtMnvFZpZtSc71TMffd","type":"tool_result","content":"1\tpackage ralph\n2\t\n3\timport (\n4\t\t\"errors\"\n5\t\t\"fmt\"\n6\t\n7\t\t\"github.com/leightonvanrooijen/utopia/internal\"\n8\t\t\"github.com/leightonvanrooijen/utopia/internal/domain\"\n9\t\t\"github.com/leightonvanrooijen/utopia/internal/validators\"\n10\t)\n11\t\n12\t// DefaultEscalatedExecutorModel is the model an escalated execution attempt runs\n13\t// on when config sets no models.execute_escalated override. The escalated\n14\t// executor resolves its own model rather than deriving one from models.execute,\n15\t// following the precedent the validator relevance router set: a role with a\n16\t// different cost profile and a different failure consequence resolves\n17\t// independently.\n18\tconst DefaultEscalatedExecutorModel = domain.DefaultEscalatedModel\n19\t\n20\t// Escalation caps. They are the inner bounds on the retry paths, sitting inside\n21\t// verification.max_iterations, which still bounds total iterations for a work\n22\t// item. The values are guesses chosen so the worst case is roughly cost-neutral\n23\t// against running the expensive model throughout; the telemetry that would\n24\t// confirm them does not exist yet, which is why they are named rather than\n25\t// inlined.\n26\tconst (\n27\t\t// DefaultMechanicalRetryCap is how many consecutive mechanical failures are\n28\t\t// retried on the same executor before the failure is reclassified as\n29\t\t// comprehension. Enough mechanical slips in the same place is itself evidence\n30\t\t// the executor is solving the wrong problem.\n31\t\tDefaultMechanicalRetryCap = 4\n32\t\t// DefaultComprehensionEscalationCap is the comprehension_count at which the\n33\t\t// work item stops escalating the executor and escalates the scoping instead.\n34\t\t// One comprehension failure escalates the executor; the second says the\n35\t\t// change request, not the executor, is what needs rewriting.\n36\t\tDefaultComprehensionEscalationCap = 2\n37\t\t// DefaultOpusExecutionAttemptCap is how many execution attempts may run on the\n38\t\t// escalated executor before the work item halts. Two attempts on the expensive\n39\t\t// model is what keeps the worst case roughly cost-neutral against having run\n40\t\t// the expensive model throughout.\n41\t\tDefaultOpusExecutionAttemptCap = 2\n42\t\t// DefaultScopingEscalationCap is how many times one change request may be\n43\t\t// routed to scoping escalation. One rewrite is the bound: a change request that\n44\t\t// is still misread after being rewritten is not a change request a second\n45\t\t// rewrite fixes.\n46\t\tDefaultScopingEscalationCap = 1\n47\t\t// DefaultInvocationErrorCap is how many consecutive claude invocations may fail\n48\t\t// to run at all before the work item halts. Three is enough to ride out a\n49\t\t// transient fault - a dropped connection, a momentarily unavailable binary -\n50\t\t// and few enough that a claude that fails every time is read by a human long\n51\t\t// before it has spent the item's iterations.\n52\t\tDefaultInvocationErrorCap = 3\n53\t)\n54\t\n55\t// EscalationCaps bounds each escalation path. Every cap is independently\n56\t// configurable because every one of them is a guess.\n57\t//\n58\t// The caps compose as a chain of last resorts, and only the end of the chain\n59\t// halts. Exceeding MechanicalRetries reclassifies the failure as comprehension,\n60\t// because an escalation is the only move that can change a stuck retry's\n61\t// outcome. Reaching ComprehensionEscalations routes to scoping escalation, for\n62\t// the same reason one step further out. Exhausting OpusExecutionAttempts or\n63\t// ScopingEscalations leaves nothing further to route to, so the work item halts\n64\t// as needs_human. verification.max_iterations remains the outer bound on the\n65\t// item as a whole.\n66\ttype EscalationCaps struct {\n67\t\t// MechanicalRetries caps consecutive mechanical retries on the same executor.\n68\t\tMechanicalRetries int\n69\t\t// ComprehensionEscalations caps comprehension failures before the work item\n70\t\t// routes to scoping escalation.\n71\t\tComprehensionEscalations int\n72\t\t// OpusExecutionAttempts caps execution attempts on the escalated executor.\n73\t\tOpusExecutionAttempts int\n74\t\t// ScopingEscalations caps scoping escalations for one change request.\n75\t\tScopingEscalations int\n76\t\t// InvocationErrors caps consecutive claude invocations that failed to run.\n77\t\t// It sits apart from the caps above rather than beside them in the chain: an\n78\t\t// invocation that never produced a verdict is not evidence the executor got\n79\t\t// anything wrong, so escalating on it would spend the expensive model on a\n80\t\t// fault the expensive model cannot fix. Exhausting it halts the work item,\n81\t\t// because nothing in the loop can repair a broken subprocess either.\n82\t\tInvocationErrors int\n83\t}\n84\t\n85\t// DefaultEscalationCaps returns the caps the loop runs with absent configuration.\n86\tfunc DefaultEscalationCaps() EscalationCaps {\n87\t\treturn EscalationCaps{\n88\t\t\tMechanicalRetries:        DefaultMechanicalRetryCap,\n89\t\t\tComprehensionEscalations: DefaultComprehensionEscalationCap,\n90\t\t\tOpusExecutionAttempts:    DefaultOpusExecutionAttemptCap,\n91\t\t\tScopingEscalations:       DefaultScopingEscalationCap,\n92\t\t\tInvocationErrors:         DefaultInvocationErrorCap,\n93\t\t}\n94\t}\n95\t\n96\t// EscalationCapsFrom resolves the caps one run executes with: each configured cap\n97\t// overrides its default independently, and an omitted section or key keeps the\n98\t// default. The values are known-positive here because config load already\n99\t// rejected a non-positive cap.\n100\tfunc EscalationCapsFrom(ec *domain.EscalationConfig) EscalationCaps {\n101\t\tcaps := DefaultEscalationCaps()\n102\t\tif ec == nil {\n103\t\t\treturn caps\n104\t\t}\n105\t\tcaps.MechanicalRetries = domain.CapOr(ec.MechanicalRetries, caps.MechanicalRetries)\n106\t\tcaps.ComprehensionEscalations = domain.CapOr(ec.ComprehensionEscalations, caps.ComprehensionEscalations)\n107\t\tcaps.OpusExecutionAttempts = domain.CapOr(ec.OpusExecutionAttempts, caps.OpusExecutionAttempts)\n108\t\tcaps.ScopingEscalations = domain.CapOr(ec.ScopingEscalations, caps.ScopingEscalations)\n109\t\tcaps.InvocationErrors = domain.CapOr(ec.InvocationErrors, caps.InvocationErrors)\n110\t\treturn caps\n111\t}\n112\t\n113\t// Route is what the loop does next with a work item whose validation gate failed.\n114\ttype Route string\n115\t\n116\tconst (\n117\t\t// RouteMechanicalRetry retries on the default executor. The intent was right\n118\t\t// and the execution slipped, so the executor was not the problem.\n119\t\tRouteMechanicalRetry Route = \"mechanical-retry\"\n120\t\t// RouteEscalateExecutor retries on the escalated executor. The same executor\n121\t\t// re-reading the same specification would re-derive the same wrong intent.\n122\t\tRouteEscalateExecutor Route = \"escalate-executor\"\n123\t\t// RouteScopingEscalation stops execution and escalates the change request.\n124\t\t// Repeated comprehension failure is evidence about the specification rather\n125\t\t// than only about the executor.\n126\t\tRouteScopingEscalation Route = \"scoping-escalation\"\n127\t\t// RouteNeedsHuman halts the work item. Every path that could have changed the\n128\t\t// outcome is exhausted, so a further attempt would only spend money to fail\n129\t\t// the same way.\n130\t\tRouteNeedsHuman Route = \"needs-human\"\n131\t)\n132\t\n133\t// RoutingDecision records how one failing validation gate was routed, including\n134\t// the counter values it routed on. It is what the per-iteration log line reports,\n135\t// so an operator can reconstruct the routing from the run output alone.\n136\ttype RoutingDecision struct {\n137\t\t// Route is the path taken.\n138\t\tRoute Route\n139\t\t// Class is the failure class routed on, after any reclassification.\n140\t\tClass validators.FailureClass\n141\t\t// Reclassified is true when a mechanical failure exceeded the mechanical cap\n142\t\t// and was routed as comprehension instead.\n143\t\tReclassified bool\n144\t\t// SpecDefect is true when a validator suspected the specification itself,\n145\t\t// which routes to scoping escalation whatever the counters say.\n146\t\tSpecDefect bool\n147\t\t// Model is the executor model the next attempt runs on, empty on the scoping\n148\t\t// escalation path where no execution attempt follows. An empty model on a\n149\t\t// retry path means no override: the claude CLI default applies.\n150\t\tModel string\n151\t\t// MechanicalRetries, ComprehensionCount and ScopingEscalations are the counters\n152\t\t// after this decision was applied to the work item.\n153\t\tMechanicalRetries  int\n154\t\tComprehensionCount int\n155\t\tScopingEscalations int\n156\t\t// CapExhausted names the config key whose cap left no path to route to, set\n157\t\t// only on RouteNeedsHuman. It is what the halt reports, so an operator can see\n158\t\t// which bound to raise rather than guessing.\n159\t\tCapExhausted string\n160\t}\n161\t\n162\t// reportedFailureClass is the class a failing validation gate reported, before any\n163\t// cap reclassifies it. A gate carrying no aggregate - a gating connector rather\n164\t// than a validator - is mechanical: a connector never claimed anything about\n165\t// intent, so it cannot have concluded the specification was misread.\n166\tfunc reportedFailureClass(agg *validators.AggregateResult) validators.FailureClass {\n167\t\tif agg != nil && agg.FailureClass != \"\" {\n168\t\t\treturn agg.FailureClass\n169\t\t}\n170\t\treturn validators.FailureMechanical\n171\t}\n172\t\n173\t// routeValidationFailure decides what to do with a work item whose validation\n174\t// gate failed, and applies the decision's counter changes to the item so they are\n175\t// persisted with it and survive a resume.\n176\t//\n177\t// The classification comes from the validators' aggregate. A gate that carries no\n178\t// aggregate - a gating connector rather than a validator - is routed as\n179\t// mechanical: a connector never claimed anything about intent, and a connector\n180\t// that keeps blocking is reclassified by the mechanical cap like any other\n181\t// repeated slip.\n182\tfunc routeValidationFailure(item *domain.WorkItem, agg *validators.AggregateResult, caps EscalationCaps, defaultModel, escalatedModel string) RoutingDecision {\n183\t\tclass := reportedFailureClass(agg)\n184\t\tspecDefect := agg != nil && agg.SpecDefectSuspected\n185\t\n186\t\t// Tally the reported class before any of the routing below reclassifies it, so\n187\t\t// the persisted ratio of mechanical to comprehension failures measures what the\n188\t\t// validators concluded rather than what the caps did with it.\n189\t\trecordReportedFailureClass(item, class)\n190\t\n191\t\t// A suspected spec defect is a claim about the specification, so it routes to\n192\t\t// scoping escalation without consulting or moving the executor counters - they\n193\t\t// measure the executor, which is not what is being doubted. The scoping counter\n194\t\t// still moves: it bounds rewrites, and a spec defect asks for one.\n195\t\tif specDefect {\n196\t\t\treturn routeScoping(item, caps, RoutingDecision{\n197\t\t\t\tClass:              class,\n198\t\t\t\tSpecDefect:         true,\n199\t\t\t\tMechanicalRetries:  item.MechanicalRetryCount,\n200\t\t\t\tComprehensionCount: item.ComprehensionCount,\n201\t\t\t})\n202\t\t}\n203\t\n204\t\treclassified := false\n205\t\tif class == validators.FailureMechanical {\n206\t\t\titem.MechanicalRetryCount++\n207\t\t\tif item.MechanicalRetryCount <= caps.MechanicalRetries {\n208\t\t\t\treturn RoutingDecision{\n209\t\t\t\t\tRoute:              RouteMechanicalRetry,\n210\t\t\t\t\tClass:              validators.FailureMechanical,\n211\t\t\t\t\tModel:              defaultModel,\n212\t\t\t\t\tMechanicalRetries:  item.MechanicalRetryCount,\n213\t\t\t\t\tComprehensionCount: item.ComprehensionCount,\n214\t\t\t\t}\n215\t\t\t}\n216\t\t\t// The cap is exceeded. Reclassifying rather than failing outright is the\n217\t\t\t// load-bearing choice: it converts a stuck retry loop into an escalation,\n218\t\t\t// which is the only move that can change the outcome.\n219\t\t\treclassified = true\n220\t\t\trecordReclassifiedFailure(item)\n221\t\t\tclass = validators.FailureComprehension\n222\t\t}\n223\t\n224\t\t// The mechanical counter counts consecutive slips, so a comprehension failure\n225\t\t// - reported or reclassified - clears it.\n226\t\titem.MechanicalRetryCount = 0\n227\t\titem.ComprehensionCount++\n228\t\n229\t\tdecision := RoutingDecision{\n230\t\t\tClass:              class,\n231\t\t\tReclassified:       reclassified,\n232\t\t\tMechanicalRetries:  item.MechanicalRetryCount,\n233\t\t\tComprehensionCount: item.ComprehensionCount,\n234\t\t\tScopingEscalations: item.ScopingEscalationCount,\n235\t\t}\n236\t\tif item.ComprehensionCount >= caps.ComprehensionEscalations {\n237\t\t\treturn routeScoping(item, caps, decision)\n238\t\t}\n239\t\tdecision.Route = RouteEscalateExecutor\n240\t\tdecision.Model = escalatedModel\n241\t\treturn decision\n242\t}\n243\t\n244\t// routeScoping completes a decision that has reached the scoping escalation path,\n245\t// counting the escalation against the scoping cap. Exhausting that cap halts the\n246\t// item: rewriting a change request is the last path available, so there is\n247\t// nothing beyond it to route to.\n248\tfunc routeScoping(item *domain.WorkItem, caps EscalationCaps, decision RoutingDecision) RoutingDecision {\n249\t\titem.ScopingEscalationCount++\n250\t\tdecision.ScopingEscalations = item.ScopingEscalationCount\n251\t\tif item.ScopingEscalationCount > caps.ScopingEscalations {\n252\t\t\tdecision.Route = RouteNeedsHuman\n253\t\t\tdecision.CapExhausted = \"escalation.scoping_escalations\"\n254\t\t\treturn decision\n255\t\t}\n256\t\tdecision.Route = RouteScopingEscalation\n257\t\treturn decision\n258\t}\n259\t\n260\t// logLine renders the routing decision for one iteration: the failure class, both\n261\t// counters against their caps, the iteration against max_iterations, and the model\n262\t// the next attempt runs on. Both bounds are on the line because they compose - the\n263\t// caps are the inner bounds and max_iterations the outer one - so an operator can\n264\t// tell which one stopped a work item.\n265\tfunc (d RoutingDecision) logLine(iteration, maxIterations int, caps EscalationCaps) string {\n266\t\tclass := string(d.Class)\n267\t\tif d.Reclassified {\n268\t\t\tclass += \" (reclassified from mechanical at the retry cap)\"\n269\t\t}\n270\t\tif d.SpecDefect {\n271\t\t\tclass += \" (spec defect suspected)\"\n272\t\t}\n273\t\n274\t\touter := \"unlimited\"\n275\t\tif maxIterations > 0 {\n276\t\t\touter = fmt.Sprintf(\"%d\", maxIterations)\n277\t\t}\n278\t\n279\t\tline := fmt.Sprintf(\"routing: class=%s mechanical=%d/%d comprehension=%d/%d scoping=%d/%d iteration=%d/%s route=%s\",\n280\t\t\tclass,\n281\t\t\td.MechanicalRetries, caps.MechanicalRetries,\n282\t\t\td.ComprehensionCount, caps.ComprehensionEscalations,\n283\t\t\td.ScopingEscalations, caps.ScopingEscalations,\n284\t\t\titeration, outer,\n285\t\t\td.Route)\n286\t\n287\t\tswitch d.Route {\n288\t\tcase RouteNeedsHuman:\n289\t\t\treturn line + \" model=none (\" + d.CapExhausted + \" exhausted, work item halted)\"\n290\t\tcase RouteScopingEscalation:\n291\t\t\treturn line + \" model=none (execution halted pending scoping escalation)\"\n292\t\tdefault:\n293\t\t\tmodel := d.Model\n294\t\t\tif model == \"\" {\n295\t\t\t\tmodel = \"claude CLI default\"\n296\t\t\t}\n297\t\t\treturn line + \" model=\" + model\n298\t\t}\n299\t}\n300\t\n301\t// ScopingEscalationError reports a work item whose repeated comprehension\n302\t// failures - or a suspected spec defect - routed it to scoping escalation. It is a\n303\t// typed error so the caller can branch on it rather than parsing a message: the\n304\t// work item did not fail verification, it is waiting for its change request to be\n305\t// rewritten.\n306\ttype ScopingEscalationError struct {\n307\t\t// WorkItemID is the item that routed to scoping escalation.\n308\t\tWorkItemID string\n309\t\t// ComprehensionCount is the item's comprehension counter at the decision.\n310\t\tComprehensionCount int\n311\t\t// SpecDefectSuspected is true when a validator suspected the specification\n312\t\t// rather than the execution, which routes here whatever the counter says.\n313\t\tSpecDefectSuspected bool\n314\t\t// Diagnoses carries the failing validators' diagnoses, which are the evidence\n315\t\t// a rewrite is built from.\n316\t\tDiagnoses []string\n317\t}\n318\t\n319\tfunc (e *ScopingEscalationError) Error() string {\n320\t\treason := fmt.Sprintf(\"comprehension failures (%d)\", e.ComprehensionCount)\n321\t\tif e.SpecDefectSuspected {\n322\t\t\treason = \"a suspected spec defect\"\n323\t\t}\n324\t\treturn fmt.Sprintf(\"work item %s routed to scoping escalation after %s\", e.WorkItemID, reason)\n325\t}\n326\t\n327\t// Is allows errors.Is to match any ScopingEscalationError.\n328\tfunc (e *ScopingEscalationError) Is(target error) bool {\n329\t\t_, ok := target.(*ScopingEscalationError)\n330\t\treturn ok\n331\t}\n332\t\n333\t// scopingEscalationError builds the error for a work item routed to scoping\n334\t// escalation, carrying the diagnoses behind the decision when the gate supplied\n335\t// an aggregate.\n336\tfunc scopingEscalationError(item *domain.WorkItem, agg *validators.AggregateResult, d RoutingDecision) *ScopingEscalationError {\n337\t\terr := &ScopingEscalationError{\n338\t\t\tWorkItemID:          item.ID,\n339\t\t\tComprehensionCount:  d.ComprehensionCount,\n340\t\t\tSpecDefectSuspected: d.SpecDefect,\n341\t\t}\n342\t\terr.Diagnoses = scopingDiagnoses(agg)\n343\t\treturn err\n344\t}\n345\t\n346\t// NeedsHumanError reports a work item halted because every bounded path\n347\t// available to it is exhausted. It is a typed error so the caller can branch on\n348\t// it rather than parsing a message: the run continues with the next work item,\n349\t// while the halted item waits for a person to re-scope its change request.\n350\t//\n351\t// It is deliberately distinct from a verification failure. A work item that\n352\t// failed verification can be retried as it stands; a work item that needs a human\n353\t// would exhaust the same caps again, so retrying it unchanged only spends money.\n354\ttype NeedsHumanError struct {\n355\t\t// WorkItemID is the item that halted.\n356\t\tWorkItemID string\n357\t\t// Cap is the config key whose bound was exhausted.\n358\t\tCap string\n359\t\t// Limit is that cap's configured value.\n360\t\tLimit int\n361\t\t// Detail says what was attempted up to the bound, in the terms the cap counts.\n362\t\tDetail string\n363\t\t// Cause is the decision that led here, when there was one - a scoping\n364\t\t// escalation with no rewrite left to try, for instance. It is unwrapped, so a\n365\t\t// caller matching on the underlying reason still matches.\n366\t\tCause error\n367\t}\n368\t\n369\tfunc (e *NeedsHumanError) Error() string {\n370\t\tmsg := fmt.Sprintf(\"work item %s needs human attention: %s (%s = %d)\", e.WorkItemID, e.Detail, e.Cap, e.Limit)\n371\t\tif e.Cause != nil {\n372\t\t\treturn msg + \": \" + e.Cause.Error()\n373\t\t}\n374\t\treturn msg\n375\t}\n376\t\n377\t// Unwrap exposes the cause so errors.As reaches it through the halt.\n378\tfunc (e *NeedsHumanError) Unwrap() error { return e.Cause }\n379\t\n380\t// Is allows errors.Is to match any NeedsHumanError.\n381\tfunc (e *NeedsHumanError) Is(target error) bool {\n382\t\t_, ok := target.(*NeedsHumanError)\n383\t\treturn ok\n384\t}\n385\t\n386\t// haltNeedsHuman terminates a work item at the exhausted cap: the item is\n387\t// persisted as needs_human so a resume skips it rather than exhausting the same\n388\t// cap again, and the run record of what was tried is written because a run that\n389\t// gave up is what a person re-scoping the change request has to read.\n390\t//\n391\t// The status is what makes the halt distinguishable from a verification failure\n392\t// on disk; the returned typed error is what makes it distinguishable to the\n393\t// caller, which continues with the next work item. The status is set before the\n394\t// record is written so the routing record reports the halt as needs_human rather\n395\t// than as an abandonment.\n396\tfunc haltNeedsHuman(store *internal.YAMLStore, specID, crID string, item *domain.WorkItem, rec *runRecorder, halt *NeedsHumanError) error {\n397\t\titem.Status = domain.WorkItemNeedsHuman\n398\t\t_ = store.SaveWorkItemForSpec(specID, item)\n399\t\twriteRunTranscript(store, crID, item, rec, domain.RunFailed)\n400\t\treturn halt\n401\t}\n402\t\n403\t// resolveDefaultExecutorModel determines which model a first-attempt execution\n404\t// runs on. Priority: the run's --model override > models.execute >\n405\t// models.default > sonnet. The override is per invocation and so wins over\n406\t// config, but it is not the only way to set the model: without it the default\n407\t// executor resolves its own role's key like every other role does.\n408\tfunc resolveDefaultExecutorModel(mc *domain.ModelConfig, override string) string {\n409\t\tif override != \"\" {\n410\t\t\treturn override\n411\t\t}\n412\t\treturn mc.ExecutorModel()\n413\t}\n414\t\n415\t// resolveEscalatedExecutorModel determines which model an escalated execution\n416\t// attempt runs on. Priority: models.execute_escalated > opus. It never falls\n417\t// through to models.execute or models.default, because escalating to the model\n418\t// that just failed is not an escalation.\n419\tfunc resolveEscalatedExecutorModel(mc *domain.ModelConfig) string {\n420\t\treturn mc.EscalatedExecutorModel()\n421\t}\n422\t\n423\t// executorModelFor resolves the model the next attempt on this work item runs on.\n424\t// It is derived from the persisted comprehension counter rather than from an\n425\t// in-memory flag, so a resumed work item that already escalated stays escalated\n426\t// instead of resetting to the default executor.\n427\tfunc executorModelFor(item *domain.WorkItem, defaultModel, escalatedModel string) string {\n428\t\tif item.ComprehensionCount > 0 {\n429\t\t\treturn escalatedModel\n430\t\t}\n431\t\treturn defaultModel\n432\t}\n433\t\n434\t// chargeEscalatedAttempt books the attempt the loop is about to make against the\n435\t// escalated-execution cap, and reports the halt when that cap is already\n436\t// exhausted - before the attempt is spent rather than after.\n437\t//\n438\t// Whether an attempt is escalated is read from the item's persisted comprehension\n439\t// counter, the same source the model resolution uses, rather than by comparing\n440\t// model strings: a project that configures models.execute and\n441\t// models.execute_escalated to the same model still escalated, and its expensive\n442\t// attempts still need bounding.\n443\t//\n444\t// It returns whether the attempt was charged, so an attempt that never ran can be\n445\t// refunded. Only a real attempt costs money, which is what this cap bounds.\n446\tfunc chargeEscalatedAttempt(item *domain.WorkItem, caps EscalationCaps) (bool, *NeedsHumanError) {\n447\t\tif item.ComprehensionCount == 0 {\n448\t\t\treturn false, nil\n449\t\t}\n450\t\tif item.OpusExecutionAttempts >= caps.OpusExecutionAttempts {\n451\t\t\treturn false, &NeedsHumanError{\n452\t\t\t\tWorkItemID: item.ID,\n453\t\t\t\tCap:        \"escalation.opus_execution_attempts\",\n454\t\t\t\tLimit:      caps.OpusExecutionAttempts,\n455\t\t\t\tDetail: fmt.Sprintf(\"%d escalated execution attempt(s) failed to satisfy the validators\",\n456\t\t\t\t\titem.OpusExecutionAttempts),\n457\t\t\t}\n458\t\t}\n459\t\titem.OpusExecutionAttempts++\n460\t\treturn true, nil\n461\t}\n462\t\n463\t// refundEscalatedAttempt returns the escalated-execution charge an attempt was\n464\t// booked when that attempt produced no judgement about the code - it was skipped\n465\t// for a usage limit, or its invocation never ran. The cap bounds spend on\n466\t// evidence that the executor got it wrong, and neither case is that evidence.\n467\t//\n468\t// It is a no-op for an attempt that was never charged, which is every attempt on\n469\t// the default executor.\n470\tfunc refundEscalatedAttempt(item *domain.WorkItem, charged bool) {\n471\t\tif charged {\n472\t\t\titem.OpusExecutionAttempts--\n473\t\t}\n474\t}\n475\t\n476\t// chargeInvocationError books one claude invocation that failed to run against\n477\t// the item's consecutive-error counter, and reports the halt when that counter\n478\t// reaches its cap.\n479\t//\n480\t// The halt names the invocation failure rather than a comprehension failure,\n481\t// because that is the fault a person has to go and fix: nothing about the change\n482\t// request or the executor changes the outcome of a subprocess that will not\n483\t// start.\n484\tfunc chargeInvocationError(item *domain.WorkItem, caps EscalationCaps, cause error) *NeedsHumanError {\n485\t\titem.InvocationErrorCount++\n486\t\tif item.InvocationErrorCount < caps.InvocationErrors {\n487\t\t\treturn nil\n488\t\t}\n489\t\treturn &NeedsHumanError{\n490\t\t\tWorkItemID: item.ID,\n491\t\t\tCap:        \"escalation.invocation_errors\",\n492\t\t\tLimit:      caps.InvocationErrors,\n493\t\t\tDetail: fmt.Sprintf(\"%d consecutive claude invocation(s) failed to run, so no attempt reached a verdict about the code\",\n494\t\t\t\titem.InvocationErrorCount),\n495\t\t\tCause: cause,\n496\t\t}\n497\t}\n498\t\n499\t// clearInvocationErrors resets the consecutive-error counter after an invocation\n500\t// that actually ran, however its work was judged. The counter bounds a fault that\n501\t// is happening now, so an intermittent crash must not accumulate across an\n502\t// otherwise healthy run.\n503\tfunc clearInvocationErrors(item *domain.WorkItem) {\n504\t\titem.InvocationErrorCount = 0\n505\t}\n506\t\n507\t// aggregateFromGate extracts the validators' aggregate from a blocking gate\n508\t// error, or nil when the gate was something other than a failing validator.\n509\tfunc aggregateFromGate(err error) *validators.AggregateResult {\n510\t\tvar ge *GateError\n511\t\tif errors.As(err, &ge) {\n512\t\t\treturn ge.Aggregate\n513\t\t}\n514\t\treturn nil\n515\t}\n516\t"}]},"parent_tool_use_id":null,"session_id":"5fa8296d-43cc-4cc8-b010-9d1068f6b287","uuid":"8f7ab520-a8ac-429f-83cc-a0ea7719aa87","timestamp":"2026-07-31T01:44:17.747Z","tool_use_result":{"type":"text","file":{"filePath":"/Users/leighton.vanrooijen/projects/utopia/internal/ralph/escalation.go","content":"package ralph\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\n\t\"github.com/leightonvanrooijen/utopia/internal\"\n\t\"github.com/leightonvanrooijen/utopia/internal/domain\"\n\t\"github.com/leightonvanrooijen/utopia/internal/validators\"\n)\n\n// DefaultEscalatedExecutorModel is the model an escalated execution attempt runs\n// on when config sets no models.execute_escalated override. The escalated\n// executor resolves its own model rather than deriving one from models.execute,\n// following the precedent the validator relevance router set: a role with a\n// different cost profile and a different failure consequence resolves\n// independently.\nconst DefaultEscalatedExecutorModel = domain.DefaultEscalatedModel\n\n// Escalation caps. They are the inner bounds on the retry paths, sitting inside\n// verification.max_iterations, which still bounds total iterations for a work\n// item. The values are guesses chosen so the worst case is roughly cost-neutral\n// against running the expensive model throughout; the telemetry that would\n// confirm them does not exist yet, which is why they are named rather than\n// inlined.\nconst (\n\t// DefaultMechanicalRetryCap is how many consecutive mechanical failures are\n\t// retried on the same executor before the failure is reclassified as\n\t// comprehension. Enough mechanical slips in the same place is itself evidence\n\t// the executor is solving the wrong problem.\n\tDefaultMechanicalRetryCap = 4\n\t// DefaultComprehensionEscalationCap is the comprehension_count at which the\n\t// work item stops escalating the executor and escalates the scoping instead.\n\t// One comprehension failure escalates the executor; the second says the\n\t// change request, not the executor, is what needs rewriting.\n\tDefaultComprehensionEscalationCap = 2\n\t// DefaultOpusExecutionAttemptCap is how many execution attempts may run on the\n\t// escalated executor before the work item halts. Two attempts on the expensive\n\t// model is what keeps the worst case roughly cost-neutral against having run\n\t// the expensive model throughout.\n\tDefaultOpusExecutionAttemptCap = 2\n\t// DefaultScopingEscalationCap is how many times one change request may be\n\t// routed to scoping escalation. One rewrite is the bound: a change request that\n\t// is still misread after being rewritten is not a change request a second\n\t// rewrite fixes.\n\tDefaultScopingEscalationCap = 1\n\t// DefaultInvocationErrorCap is how many consecutive claude invocations may fail\n\t// to run at all before the work item halts. Three is enough to ride out a\n\t// transient fault - a dropped connection, a momentarily unavailable binary -\n\t// and few enough that a claude that fails every time is read by a human long\n\t// before it has spent the item's iterations.\n\tDefaultInvocationErrorCap = 3\n)\n\n// EscalationCaps bounds each escalation path. Every cap is independently\n// configurable because every one of them is a guess.\n//\n// The caps compose as a chain of last resorts, and only the end of the chain\n// halts. Exceeding MechanicalRetries reclassifies the failure as comprehension,\n// because an escalation is the only move that can change a stuck retry's\n// outcome. Reaching ComprehensionEscalations routes to scoping escalation, for\n// the same reason one step further out. Exhausting OpusExecutionAttempts or\n// ScopingEscalations leaves nothing further to route to, so the work item halts\n// as needs_human. verification.max_iterations remains the outer bound on the\n// item as a whole.\ntype EscalationCaps struct {\n\t// MechanicalRetries caps consecutive mechanical retries on the same executor.\n\tMechanicalRetries int\n\t// ComprehensionEscalations caps comprehension failures before the work item\n\t// routes to scoping escalation.\n\tComprehensionEscalations int\n\t// OpusExecutionAttempts caps execution attempts on the escalated executor.\n\tOpusExecutionAttempts int\n\t// ScopingEscalations caps scoping escalations for one change request.\n\tScopingEscalations int\n\t// InvocationErrors caps consecutive claude invocations that failed to run.\n\t// It sits apart from the caps above rather than beside them in the chain: an\n\t// invocation that never produced a verdict is not evidence the executor got\n\t// anything wrong, so escalating on it would spend the expensive model on a\n\t// fault the expensive model cannot fix. Exhausting it halts the work item,\n\t// because nothing in the loop can repair a broken subprocess either.\n\tInvocationErrors int\n}\n\n// DefaultEscalationCaps returns the caps the loop runs with absent configuration.\nfunc DefaultEscalationCaps() EscalationCaps {\n\treturn EscalationCaps{\n\t\tMechanicalRetries:        DefaultMechanicalRetryCap,\n\t\tComprehensionEscalations: DefaultComprehensionEscalationCap,\n\t\tOpusExecutionAttempts:    DefaultOpusExecutionAttemptCap,\n\t\tScopingEscalations:       DefaultScopingEscalationCap,\n\t\tInvocationErrors:         DefaultInvocationErrorCap,\n\t}\n}\n\n// EscalationCapsFrom resolves the caps one run executes with: each configured cap\n// overrides its default independently, and an omitted section or key keeps the\n// default. The values are known-positive here because config load already\n// rejected a non-positive cap.\nfunc EscalationCapsFrom(ec *domain.EscalationConfig) EscalationCaps {\n\tcaps := DefaultEscalationCaps()\n\tif ec == nil {\n\t\treturn caps\n\t}\n\tcaps.MechanicalRetries = domain.CapOr(ec.MechanicalRetries, caps.MechanicalRetries)\n\tcaps.ComprehensionEscalations = domain.CapOr(ec.ComprehensionEscalations, caps.ComprehensionEscalations)\n\tcaps.OpusExecutionAttempts = domain.CapOr(ec.OpusExecutionAttempts, caps.OpusExecutionAttempts)\n\tcaps.ScopingEscalations = domain.CapOr(ec.ScopingEscalations, caps.ScopingEscalations)\n\tcaps.InvocationErrors = domain.CapOr(ec.InvocationErrors, caps.InvocationErrors)\n\treturn caps\n}\n\n// Route is what the loop does next with a work item whose validation gate failed.\ntype Route string\n\nconst (\n\t// RouteMechanicalRetry retries on the default executor. The intent was right\n\t// and the execution slipped, so the executor was not the problem.\n\tRouteMechanicalRetry Route = \"mechanical-retry\"\n\t// RouteEscalateExecutor retries on the escalated executor. The same executor\n\t// re-reading the same specification would re-derive the same wrong intent.\n\tRouteEscalateExecutor Route = \"escalate-executor\"\n\t// RouteScopingEscalation stops execution and escalates the change request.\n\t// Repeated comprehension failure is evidence about the specification rather\n\t// than only about the executor.\n\tRouteScopingEscalation Route = \"scoping-escalation\"\n\t// RouteNeedsHuman halts the work item. Every path that could have changed the\n\t// outcome is exhausted, so a further attempt would only spend money to fail\n\t// the same way.\n\tRouteNeedsHuman Route = \"needs-human\"\n)\n\n// RoutingDecision records how one failing validation gate was routed, including\n// the counter values it routed on. It is what the per-iteration log line reports,\n// so an operator can reconstruct the routing from the run output alone.\ntype RoutingDecision struct {\n\t// Route is the path taken.\n\tRoute Route\n\t// Class is the failure class routed on, after any reclassification.\n\tClass validators.FailureClass\n\t// Reclassified is true when a mechanical failure exceeded the mechanical cap\n\t// and was routed as comprehension instead.\n\tReclassified bool\n\t// SpecDefect is true when a validator suspected the specification itself,\n\t// which routes to scoping escalation whatever the counters say.\n\tSpecDefect bool\n\t// Model is the executor model the next attempt runs on, empty on the scoping\n\t// escalation path where no execution attempt follows. An empty model on a\n\t// retry path means no override: the claude CLI default applies.\n\tModel string\n\t// MechanicalRetries, ComprehensionCount and ScopingEscalations are the counters\n\t// after this decision was applied to the work item.\n\tMechanicalRetries  int\n\tComprehensionCount int\n\tScopingEscalations int\n\t// CapExhausted names the config key whose cap left no path to route to, set\n\t// only on RouteNeedsHuman. It is what the halt reports, so an operator can see\n\t// which bound to raise rather than guessing.\n\tCapExhausted string\n}\n\n// reportedFailureClass is the class a failing validation gate reported, before any\n// cap reclassifies it. A gate carrying no aggregate - a gating connector rather\n// than a validator - is mechanical: a connector never claimed anything about\n// intent, so it cannot have concluded the specification was misread.\nfunc reportedFailureClass(agg *validators.AggregateResult) validators.FailureClass {\n\tif agg != nil && agg.FailureClass != \"\" {\n\t\treturn agg.FailureClass\n\t}\n\treturn validators.FailureMechanical\n}\n\n// routeValidationFailure decides what to do with a work item whose validation\n// gate failed, and applies the decision's counter changes to the item so they are\n// persisted with it and survive a resume.\n//\n// The classification comes from the validators' aggregate. A gate that carries no\n// aggregate - a gating connector rather than a validator - is routed as\n// mechanical: a connector never claimed anything about intent, and a connector\n// that keeps blocking is reclassified by the mechanical cap like any other\n// repeated slip.\nfunc routeValidationFailure(item *domain.WorkItem, agg *validators.AggregateResult, caps EscalationCaps, defaultModel, escalatedModel string) RoutingDecision {\n\tclass := reportedFailureClass(agg)\n\tspecDefect := agg != nil && agg.SpecDefectSuspected\n\n\t// Tally the reported class before any of the routing below reclassifies it, so\n\t// the persisted ratio of mechanical to comprehension failures measures what the\n\t// validators concluded rather than what the caps did with it.\n\trecordReportedFailureClass(item, class)\n\n\t// A suspected spec defect is a claim about the specification, so it routes to\n\t// scoping escalation without consulting or moving the executor counters - they\n\t// measure the executor, which is not what is being doubted. The scoping counter\n\t// still moves: it bounds rewrites, and a spec defect asks for one.\n\tif specDefect {\n\t\treturn routeScoping(item, caps, RoutingDecision{\n\t\t\tClass:              class,\n\t\t\tSpecDefect:         true,\n\t\t\tMechanicalRetries:  item.MechanicalRetryCount,\n\t\t\tComprehensionCount: item.ComprehensionCount,\n\t\t})\n\t}\n\n\treclassified := false\n\tif class == validators.FailureMechanical {\n\t\titem.MechanicalRetryCount++\n\t\tif item.MechanicalRetryCount <= caps.MechanicalRetries {\n\t\t\treturn RoutingDecision{\n\t\t\t\tRoute:              RouteMechanicalRetry,\n\t\t\t\tClass:              validators.FailureMechanical,\n\t\t\t\tModel:              defaultModel,\n\t\t\t\tMechanicalRetries:  item.MechanicalRetryCount,\n\t\t\t\tComprehensionCount: item.ComprehensionCount,\n\t\t\t}\n\t\t}\n\t\t// The cap is exceeded. Reclassifying rather than failing outright is the\n\t\t// load-bearing choice: it converts a stuck retry loop into an escalation,\n\t\t// which is the only move that can change the outcome.\n\t\treclassified = true\n\t\trecordReclassifiedFailure(item)\n\t\tclass = validators.FailureComprehension\n\t}\n\n\t// The mechanical counter counts consecutive slips, so a comprehension failure\n\t// - reported or reclassified - clears it.\n\titem.MechanicalRetryCount = 0\n\titem.ComprehensionCount++\n\n\tdecision := RoutingDecision{\n\t\tClass:              class,\n\t\tReclassified:       reclassified,\n\t\tMechanicalRetries:  item.MechanicalRetryCount,\n\t\tComprehensionCount: item.ComprehensionCount,\n\t\tScopingEscalations: item.ScopingEscalationCount,\n\t}\n\tif item.ComprehensionCount >= caps.ComprehensionEscalations {\n\t\treturn routeScoping(item, caps, decision)\n\t}\n\tdecision.Route = RouteEscalateExecutor\n\tdecision.Model = escalatedModel\n\treturn decision\n}\n\n// routeScoping completes a decision that has reached the scoping escalation path,\n// counting the escalation against the scoping cap. Exhausting that cap halts the\n// item: rewriting a change request is the last path available, so there is\n// nothing beyond it to route to.\nfunc routeScoping(item *domain.WorkItem, caps EscalationCaps, decision RoutingDecision) RoutingDecision {\n\titem.ScopingEscalationCount++\n\tdecision.ScopingEscalations = item.ScopingEscalationCount\n\tif item.ScopingEscalationCount > caps.ScopingEscalations {\n\t\tdecision.Route = RouteNeedsHuman\n\t\tdecision.CapExhausted = \"escalation.scoping_escalations\"\n\t\treturn decision\n\t}\n\tdecision.Route = RouteScopingEscalation\n\treturn decision\n}\n\n// logLine renders the routing decision for one iteration: the failure class, both\n// counters against their caps, the iteration against max_iterations, and the model\n// the next attempt runs on. Both bounds are on the line because they compose - the\n// caps are the inner bounds and max_iterations the outer one - so an operator can\n// tell which one stopped a work item.\nfunc (d RoutingDecision) logLine(iteration, maxIterations int, caps EscalationCaps) string {\n\tclass := string(d.Class)\n\tif d.Reclassified {\n\t\tclass += \" (reclassified from mechanical at the retry cap)\"\n\t}\n\tif d.SpecDefect {\n\t\tclass += \" (spec defect suspected)\"\n\t}\n\n\touter := \"unlimited\"\n\tif maxIterations > 0 {\n\t\touter = fmt.Sprintf(\"%d\", maxIterations)\n\t}\n\n\tline := fmt.Sprintf(\"routing: class=%s mechanical=%d/%d comprehension=%d/%d scoping=%d/%d iteration=%d/%s route=%s\",\n\t\tclass,\n\t\td.MechanicalRetries, caps.MechanicalRetries,\n\t\td.ComprehensionCount, caps.ComprehensionEscalations,\n\t\td.ScopingEscalations, caps.ScopingEscalations,\n\t\titeration, outer,\n\t\td.Route)\n\n\tswitch d.Route {\n\tcase RouteNeedsHuman:\n\t\treturn line + \" model=none (\" + d.CapExhausted + \" exhausted, work item halted)\"\n\tcase RouteScopingEscalation:\n\t\treturn line + \" model=none (execution halted pending scoping escalation)\"\n\tdefault:\n\t\tmodel := d.Model\n\t\tif model == \"\" {\n\t\t\tmodel = \"claude CLI default\"\n\t\t}\n\t\treturn line + \" model=\" + model\n\t}\n}\n\n// ScopingEscalationError reports a work item whose repeated comprehension\n// failures - or a suspected spec defect - routed it to scoping escalation. It is a\n// typed error so the caller can branch on it rather than parsing a message: the\n// work item did not fail verification, it is waiting for its change request to be\n// rewritten.\ntype ScopingEscalationError struct {\n\t// WorkItemID is the item that routed to scoping escalation.\n\tWorkItemID string\n\t// ComprehensionCount is the item's comprehension counter at the decision.\n\tComprehensionCount int\n\t// SpecDefectSuspected is true when a validator suspected the specification\n\t// rather than the execution, which routes here whatever the counter says.\n\tSpecDefectSuspected bool\n\t// Diagnoses carries the failing validators' diagnoses, which are the evidence\n\t// a rewrite is built from.\n\tDiagnoses []string\n}\n\nfunc (e *ScopingEscalationError) Error() string {\n\treason := fmt.Sprintf(\"comprehension failures (%d)\", e.ComprehensionCount)\n\tif e.SpecDefectSuspected {\n\t\treason = \"a suspected spec defect\"\n\t}\n\treturn fmt.Sprintf(\"work item %s routed to scoping escalation after %s\", e.WorkItemID, reason)\n}\n\n// Is allows errors.Is to match any ScopingEscalationError.\nfunc (e *ScopingEscalationError) Is(target error) bool {\n\t_, ok := target.(*ScopingEscalationError)\n\treturn ok\n}\n\n// scopingEscalationError builds the error for a work item routed to scoping\n// escalation, carrying the diagnoses behind the decision when the gate supplied\n// an aggregate.\nfunc scopingEscalationError(item *domain.WorkItem, agg *validators.AggregateResult, d RoutingDecision) *ScopingEscalationError {\n\terr := &ScopingEscalationError{\n\t\tWorkItemID:          item.ID,\n\t\tComprehensionCount:  d.ComprehensionCount,\n\t\tSpecDefectSuspected: d.SpecDefect,\n\t}\n\terr.Diagnoses = scopingDiagnoses(agg)\n\treturn err\n}\n\n// NeedsHumanError reports a work item halted because every bounded path\n// available to it is exhausted. It is a typed error so the caller can branch on\n// it rather than parsing a message: the run continues with the next work item,\n// while the halted item waits for a person to re-scope its change request.\n//\n// It is deliberately distinct from a verification failure. A work item that\n// failed verification can be retried as it stands; a work item that needs a human\n// would exhaust the same caps again, so retrying it unchanged only spends money.\ntype NeedsHumanError struct {\n\t// WorkItemID is the item that halted.\n\tWorkItemID string\n\t// Cap is the config key whose bound was exhausted.\n\tCap string\n\t// Limit is that cap's configured value.\n\tLimit int\n\t// Detail says what was attempted up to the bound, in the terms the cap counts.\n\tDetail string\n\t// Cause is the decision that led here, when there was one - a scoping\n\t// escalation with no rewrite left to try, for instance. It is unwrapped, so a\n\t// caller matching on the underlying reason still matches.\n\tCause error\n}\n\nfunc (e *NeedsHumanError) Error() string {\n\tmsg := fmt.Sprintf(\"work item %s needs human attention: %s (%s = %d)\", e.WorkItemID, e.Detail, e.Cap, e.Limit)\n\tif e.Cause != nil {\n\t\treturn msg + \": \" + e.Cause.Error()\n\t}\n\treturn msg\n}\n\n// Unwrap exposes the cause so errors.As reaches it through the halt.\nfunc (e *NeedsHumanError) Unwrap() error { return e.Cause }\n\n// Is allows errors.Is to match any NeedsHumanError.\nfunc (e *NeedsHumanError) Is(target error) bool {\n\t_, ok := target.(*NeedsHumanError)\n\treturn ok\n}\n\n// haltNeedsHuman terminates a work item at the exhausted cap: the item is\n// persisted as needs_human so a resume skips it rather than exhausting the same\n// cap again, and the run record of what was tried is written because a run that\n// gave up is what a person re-scoping the change request has to read.\n//\n// The status is what makes the halt distinguishable from a verification failure\n// on disk; the returned typed error is what makes it distinguishable to the\n// caller, which continues with the next work item. The status is set before the\n// record is written so the routing record reports the halt as needs_human rather\n// than as an abandonment.\nfunc haltNeedsHuman(store *internal.YAMLStore, specID, crID string, item *domain.WorkItem, rec *runRecorder, halt *NeedsHumanError) error {\n\titem.Status = domain.WorkItemNeedsHuman\n\t_ = store.SaveWorkItemForSpec(specID, item)\n\twriteRunTranscript(store, crID, item, rec, domain.RunFailed)\n\treturn halt\n}\n\n// resolveDefaultExecutorModel determines which model a first-attempt execution\n// runs on. Priority: the run's --model override > models.execute >\n// models.default > sonnet. The override is per invocation and so wins over\n// config, but it is not the only way to set the model: without it the default\n// executor resolves its own role's key like every other role does.\nfunc resolveDefaultExecutorModel(mc *domain.ModelConfig, override string) string {\n\tif override != \"\" {\n\t\treturn override\n\t}\n\treturn mc.ExecutorModel()\n}\n\n// resolveEscalatedExecutorModel determines which model an escalated execution\n// attempt runs on. Priority: models.execute_escalated > opus. It never falls\n// through to models.execute or models.default, because escalating to the model\n// that just failed is not an escalation.\nfunc resolveEscalatedExecutorModel(mc *domain.ModelConfig) string {\n\treturn mc.EscalatedExecutorModel()\n}\n\n// executorModelFor resolves the model the next attempt on this work item runs on.\n// It is derived from the persisted comprehension counter rather than from an\n// in-memory flag, so a resumed work item that already escalated stays escalated\n// instead of resetting to the default executor.\nfunc executorModelFor(item *domain.WorkItem, defaultModel, escalatedModel string) string {\n\tif item.ComprehensionCount > 0 {\n\t\treturn escalatedModel\n\t}\n\treturn defaultModel\n}\n\n// chargeEscalatedAttempt books the attempt the loop is about to make against the\n// escalated-execution cap, and reports the halt when that cap is already\n// exhausted - before the attempt is spent rather than after.\n//\n// Whether an attempt is escalated is read from the item's persisted comprehension\n// counter, the same source the model resolution uses, rather than by comparing\n// model strings: a project that configures models.execute and\n// models.execute_escalated to the same model still escalated, and its expensive\n// attempts still need bounding.\n//\n// It returns whether the attempt was charged, so an attempt that never ran can be\n// refunded. Only a real attempt costs money, which is what this cap bounds.\nfunc chargeEscalatedAttempt(item *domain.WorkItem, caps EscalationCaps) (bool, *NeedsHumanError) {\n\tif item.ComprehensionCount == 0 {\n\t\treturn false, nil\n\t}\n\tif item.OpusExecutionAttempts >= caps.OpusExecutionAttempts {\n\t\treturn false, &NeedsHumanError{\n\t\t\tWorkItemID: item.ID,\n\t\t\tCap:        \"escalation.opus_execution_attempts\",\n\t\t\tLimit:      caps.OpusExecutionAttempts,\n\t\t\tDetail: fmt.Sprintf(\"%d escalated execution attempt(s) failed to satisfy the validators\",\n\t\t\t\titem.OpusExecutionAttempts),\n\t\t}\n\t}\n\titem.OpusExecutionAttempts++\n\treturn true, nil\n}\n\n// refundEscalatedAttempt returns the escalated-execution charge an attempt was\n// booked when that attempt produced no judgement about the code - it was skipped\n// for a usage limit, or its invocation never ran. The cap bounds spend on\n// evidence that the executor got it wrong, and neither case is that evidence.\n//\n// It is a no-op for an attempt that was never charged, which is every attempt on\n// the default executor.\nfunc refundEscalatedAttempt(item *domain.WorkItem, charged bool) {\n\tif charged {\n\t\titem.OpusExecutionAttempts--\n\t}\n}\n\n// chargeInvocationError books one claude invocation that failed to run against\n// the item's consecutive-error counter, and reports the halt when that counter\n// reaches its cap.\n//\n// The halt names the invocation failure rather than a comprehension failure,\n// because that is the fault a person has to go and fix: nothing about the change\n// request or the executor changes the outcome of a subprocess that will not\n// start.\nfunc chargeInvocationError(item *domain.WorkItem, caps EscalationCaps, cause error) *NeedsHumanError {\n\titem.InvocationErrorCount++\n\tif item.InvocationErrorCount < caps.InvocationErrors {\n\t\treturn nil\n\t}\n\treturn &NeedsHumanError{\n\t\tWorkItemID: item.ID,\n\t\tCap:        \"escalation.invocation_errors\",\n\t\tLimit:      caps.InvocationErrors,\n\t\tDetail: fmt.Sprintf(\"%d consecutive claude invocation(s) failed to run, so no attempt reached a verdict about the code\",\n\t\t\titem.InvocationErrorCount),\n\t\tCause: cause,\n\t}\n}\n\n// clearInvocationErrors resets the consecutive-error counter after an invocation\n// that actually ran, however its work was judged. The counter bounds a fault that\n// is happening now, so an intermittent crash must not accumulate across an\n// otherwise healthy run.\nfunc clearInvocationErrors(item *domain.WorkItem) {\n\titem.InvocationErrorCount = 0\n}\n\n// aggregateFromGate extracts the validators' aggregate from a blocking gate\n// error, or nil when the gate was something other than a failing validator.\nfunc aggregateFromGate(err error) *validators.AggregateResult {\n\tvar ge *GateError\n\tif errors.As(err, &ge) {\n\t\treturn ge.Aggregate\n\t}\n\treturn nil\n}\n","numLines":516,"startLine":1,"totalLines":516}}}
