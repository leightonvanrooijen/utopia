04\t// itself failed to run. A validator that could not be invoked has not disapproved\n305\t// of anything, so retrying it risks nothing a verdict-carrying run would: there is\n306\t// no judgement about the code to discard, only an infrastructure fault to give\n307\t// another chance at clearing.\n308\t//\n309\t// Only the invocation is retried. Output that was produced but is unusable never\n310\t// reaches here as an error - InterpretOutput resolves it as a comprehension\n311\t// failure - so the retry cannot launder a validator's disapproval into a fresh\n312\t// attempt.\n313\t//\n314\t// Retrying stops early once the context is done: a cancelled or expired context\n315\t// fails the same way on every attempt, and the per-validator deadline is the bound\n316\t// on the whole sequence rather than on each attempt within it.\n317\tfunc (r *Runner) runWithDiffRetrying(ctx context.Context, validator *domain.Validator, changedFiles string) (*Result, error) {\n318\t\tretries := r.invocationRetries\n319\t\tif retries < 0 {\n320\t\t\tretries = DefaultValidatorInvocationRetries\n321\t\t}\n322\t\n323\t\tfor attempt := 0; ; attempt++ {\n324\t\t\tresult, err := r.runWithDiff(ctx, validator, changedFiles)\n325\t\t\tif err == nil {\n326\t\t\t\treturn result, nil\n327\t\t\t}\n328\t\t\tif attempt >= retries || ctx.Err() != nil {\n329\t\t\t\tif attempt == 0 {\n330\t\t\t\t\treturn nil, err\n331\t\t\t\t}\n332\t\t\t\treturn nil, fmt.Errorf(\"validator did not run in %d attempt(s): %w\", attempt+1, err)\n333\t\t\t}\n334\t\t}\n335\t}\n336\t\n337\t// runWithDiff executes a single validator with a pre-computed git diff.\n338\t// This is the internal execution method used by Run and RunAll, so both paths\n339\t// interpret a validator's output through the same contract.\n340\t// The model used is resolved via: validator override > models.validators > models.default.\n341\tfunc (r *Runner) runWithDiff(ctx context.Context, validator *domain.Validator, changedFiles string) (*Result, error