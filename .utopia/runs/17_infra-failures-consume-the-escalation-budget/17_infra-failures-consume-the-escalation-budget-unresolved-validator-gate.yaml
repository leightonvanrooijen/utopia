ailing validator's feedback wins over a gating connector\n154\t\t// on the same event, matching the pre-migration order where validators were\n155\t\t// checked first. Notify failures are logged warnings; gating failures\n156\t\t// propagate as *GateError through Dispatch to block loop progression.\n157\t\tdispatcher := NewDispatcher()\n158\t\tsubs := CompileValidators(validatorRunner, validatorList, config.Verification.ValidatorConcurrency)\n159\t\tsubs = append(subs, CompileConnectors(config.Connectors, projectDir)...)\n160\t\tif len(subs) > 0 {\n161\t\t\tengine := NewEngine(subs)\n162\t\t\tengine.out = out\n163\t\t\trunner := &ConnectorRunner{engine: engine}\n164\t\t\tdispatcher.Subscribe(func(e Event) error {\n165\t\t\t\treturn runner.Handle(ctx, e)\n166\t\t\t})\n167\t\t}\n168\t\tbasePayload := EventPayload{\n169\t\t\tCRID:   extractCRID(specID),"}]},"parent_tool_use_id":null,"session_id":"5fa8296d-43cc-4cc8-b010-9d1068f6b287","uuid":"605a4eb3-5a9a-4049-9a3c-faade760db7c","timestamp":"2026-07-31T01:47:27.873Z","tool_use_result":{"type":"text","file":{"filePath":"/Users/leighton.vanrooijen/projects/utopia/internal/ralph/ralph.go","content":"\t// falls silent only when the run is asked to be quieter than info.\n\tcli := internal.NewCLI().WithStreamLevel(slog.LevelInfo).WithAuth(auth, filepath.Join(projectDir, \".utopia\")).WithPrinter(out)\n\tefforts := resolveRoleEfforts(config.Effort, over.Effort)\n\tcli = cli.WithEffort(efforts.executor)\n\tdefaultExecutorModel := resolveDefaultExecutorModel(config.Models, over.Model)\n\tcli = cli.WithModel(defaultExecutorModel)\n\tverifier := verification.NewRunner(projectDir)\n\tvalidatorRunner := validators.NewRunner(projectDir).WithModelConfig(config.Models).WithEffort(efforts.validators).WithAuth(auth).\n\t\tWithInvocationRetries(domain.CapOr(config.Verification.ValidatorInvocationRetries, validators.DefaultValidatorInvocationRetries))\n\n\t// Load validators from config\n\tvar validatorList []*domain.Validator\n\tfor _, v