  {"type":"user","message":{"role":"user","content":[{"tool_use_id":"toolu_01PEoLMt9A5Xa8DFjJh6XCww","type":"tool_result","content":"1\tpackage ralph\n2\t\n3\timport (\n4\t\t\"bytes\"\n5\t\t\"context\"\n6\t\t\"errors\"\n7\t\t\"os\"\n8\t\t\"path/filepath\"\n9\t\t\"strconv\"\n10\t\t\"strings\"\n11\t\t\"testing\"\n12\t\n13\t\t\"github.com/leightonvanrooijen/utopia/internal\"\n14\t\t\"github.com/leightonvanrooijen/utopia/internal/domain\"\n15\t\t\"github.com/leightonvanrooijen/utopia/internal/ui\"\n16\t)\n17\t\n18\t// The consecutive-error counter bounds a fault that is happening now, and the\n19\t// halt it produces has to name that fault rather than a comprehension failure:\n20\t// nothing about the change request changes the outcome of a claude that will not\n21\t// start.\n22\tfunc TestChargeInvocationError(t *testing.T) {\n23\t\tcaps := testCaps() // InvocationErrors: 3\n24\t\n25\t\tt.Run(\"errors below the cap keep the item running\", func(t *testing.T) {\n26\t\t\titem := &domain.WorkItem{ID: \"item\"}\n27\t\t\tfor i := 1; i < caps.InvocationErrors; i++ {\n28\t\t\t\tif halt := chargeInvocationError(item, caps, errNoBinary); halt != nil {\n29\t\t\t\t\tt.Fatalf(\"error %d halted the item, want it retried under the cap\", i)\n30\t\t\t\t}\n31\t\t\t\tif item.InvocationErrorCount != i {\n32\t\t\t\t\tt.Errorf(\"InvocationErrorCount = %d, want %d\", item.InvocationErrorCount, i)\n33\t\t\t\t}\n34\t\t\t}\n35\t\t})\n36\t\n37\t\tt.Run(\"the error at the cap halts, naming the invocation failure\", func(t *testing.T) {\n38\t\t\titem := &domain.WorkItem{ID: \"item\", InvocationErrorCount: caps.InvocationErrors - 1}\n39\t\n40\t\t\thalt := chargeInvocationError(item, caps, errNoBinary)\n41\t\n42\t\t\tif halt == nil {\n43\t\t\t\tt.Fatal(\"halt = nil, want the item halted at the cap\")\n44\t\t\t}\n45\t\t\tif halt.Cap != \"escalation.invocation_errors\" || halt.Limit != caps.InvocationErrors {\n46\t\t\t\tt.Errorf(\"halt reports %s = %d, want the invocation-error cap\", halt.Cap, halt.Limit)\n47\t\t\t}\n48\t\t\tmsg := halt.Error()\n49\t\t\tfor _, want := range []string{\"invocation\", \"reached a verdict\", \"claude\"} {\n50\t\t\t\tif !strings.Contains(msg, want) {\n51\t\t\t\t\tt.Errorf(\"halt message %q missing %q, want the invocation failure named\", msg, want)\n52\t\t\t\t}\n53\t\t\t}\n54\t\t\tif strings.Contains(msg, \"comprehension\") {\n55\t\t\t\tt.Errorf(\"halt message %q reads as a comprehension failure\", msg)\n56\t\t\t}\n57\t\t})\n58\t\n59\t\tt.Run(\"an invocation that ran clears the streak\", func(t *testing.T) {\n60\t\t\titem := &domain.WorkItem{ID: \"item\", InvocationErrorCount: 2}\n61\t\n62\t\t\tclearInvocationErrors(item)\n63\t\n64\t\t\tif item.InvocationErrorCount != 0 {\n65\t\t\t\tt.Errorf(\"InvocationErrorCount = %d, want the streak cleared\", item.InvocationErrorCount)\n66\t\t\t}\n67\t\t})\n68\t\n69\t\tt.Run(\"a raised cap allows further errors\", func(t *testing.T) {\n70\t\t\titem := &domain.WorkItem{ID: \"item\", InvocationErrorCount: 3}\n71\t\t\tif halt := chargeInvocationError(item, EscalationCaps{InvocationErrors: 5}, errNoBinary); halt != nil {\n72\t\t\t\tt.Errorf(\"halt = %v, want the error allowed under the raised cap\", halt)\n73\t\t\t}\n74\t\t})\n75\t}\n76\t\n77\t// The refund is of routing budget only: an escalated attempt that produced no\n78\t// verdict gives its charge back, and an unescalated one never had a charge.\n79\tfunc TestRefundEscalatedAttempt(t *testing.T) {\n80\t\titem := &domain.WorkItem{ID: \"item\", ComprehensionCount: 1, OpusExecutionAttempts: 2}\n81\t\n82\t\trefundEscalatedAttempt(item, true)\n83\t\tif item.OpusExecutionAttempts != 1 {\n84\t\t\tt.Errorf(\"OpusExecutionAttempts = %d, want the charge returned\", item.OpusExecutionAttempts)\n85\t\t}\n86\t\n87\t\trefundEscalatedAttempt(item, false)\n88\t\tif item.OpusExecutionAttempts != 1 {\n89\t\t\tt.Errorf(\"OpusExecutionAttempts = %d, want an uncharged attempt left alone\", item.OpusExecutionAttempts)\n90\t\t}\n91\t}\n92\t\n93\t// A claude that fails every time must halt the work item on its own counter,\n94\t// without spending the escalation budget on it. Driven through Execute against a\n95\t// stand-in binary that exits non-zero, because the defect was in how the loop\n96\t// treated the error rather than in any helper: a test that stopped at the helpers\n97\t// would have passed against it.\n98\tfunc TestExecute_InvocationErrorsHaltOnTheirOwnCap(t *testing.T) {\n99\t\tprojectDir := t.TempDir()\n100\t\tstore := internal.NewYAMLStore(filepath.Join(projectDir, \".utopia\"))\n101\t\tconst specID = \"cr-fault\"\n102\t\n103\t\tsaveEscalationCR(t, store, specID)\n104\t\t// Already escalated, so every attempt below is charged against the\n105\t\t// escalated-execution cap of 2 - which two crashed invocations used to exhaust.\n106\t\titem := &domain.WorkItem{ID: \"wi-1\", Order: 1, Status: domain.WorkItemPending,\n107\t\t\tPrompt: \"do the thing\", ComprehensionCount: 1}\n108\t\tif err := store.SaveWorkItemForSpec(specID, item); err != nil {\n109\t\t\tt.Fatalf(\"SaveWorkItemForSpec() = %v\", err)\n110\t\t}\n111\t\t// Every invocation fails: the fault is the binary, not the work.\n112\t\tfailingClaudeOnPath(t, 99)\n113\t\n114\t\tvar stdout, stderr bytes.Buffer\n115\t\tvar result *Result\n116\t\tvar err error\n117\t\tcaptureStdout(t, func() {\n118\t\t\tresult, err = Execute(context.Background(), specID, store,\n119\t\t\t\t&domain.Config{Verification: domain.VerificationConfig{MaxIterations: 20}}, projectDir, \"\",\n120\t\t\t\tOverrides{Out: ui.NewPrinter(&stdout, &stderr)})\n121\t\t})\n122\t\tif err != nil {\n123\t\t\tt.Fatalf(\"Execute() error = %v, want the halted item reported on the result\", err)\n124\t\t}\n125\t\tif len(result.NeedsHuman) != 1 {\n126\t\t\tt.Fatalf(\"NeedsHuman = %v (completed %d), want the item halted for a person\\nstdout: %s\", result.NeedsHuman, result.Completed, stdout.String())\n127\t\t}\n128\t\n129\t\thalted := reloadWorkItem(t, store, specID, item.ID)\n130\t\tif halted.Status != domain.WorkItemNeedsHuman {\n131\t\t\tt.Errorf(\"Status = %q, want %q\", halted.Status, domain.WorkItemNeedsHuman)\n132\t\t}\n133\t\tif halted.InvocationErrorCount != DefaultInvocationErrorCap {\n134\t\t\tt.Errorf(\"InvocationErrorCount = %d, want the default cap of %d\", halted.InvocationErrorCount, DefaultInvocationErrorCap)\n135\t\t}\n136\t\t// The routing budget is untouched: no attempt reached a verdict, so none of it\n137\t\t// was evidence the executor got anything wrong.\n138\t\tif halted.OpusExecutionAttempts != 0 {\n139\t\t\tt.Errorf(\"OpusExecutionAttempts = %d, want every crashed attempt refunded\", halted.OpusExecutionAttempts)\n140\t\t}\n141\t\tif halted.ComprehensionCount != 1 {\n142\t\t\tt.Errorf(\"ComprehensionCount = %d, want it unmoved by invocation errors\", halted.ComprehensionCount)\n143\t\t}\n144\t\tif halted.ScopingEscalationCount != 0 {\n145\t\t\tt.Errorf(\"ScopingEscalationCount = %d, want no escalation on an invocation fault\", halted.ScopingEscalationCount)\n146\t\t}\n147\t\t// The accounting is kept, though: the attempts ran and spent whatever they\n148\t\t// spent, and each is recorded as having reached no verdict.\n149\t\tif len(halted.ExecutorAttempts) != DefaultInvocationErrorCap {\n150\t\t\tt.Fatalf(\"ExecutorAttempts = %d, want one per errored invocation\", len(halted.ExecutorAttempts))\n151\t\t}\n152\t\tfor i, a := range halted.ExecutorAttempts {\n153\t\t\tif a.Outcome != domain.AttemptErrored {\n154\t\t\t\tt.Errorf(\"attempt %d outcome = %q, want %q\", i+1, a.Outcome, domain.AttemptErrored)\n155\t\t\t}\n156\t\t\tif a.Usage == nil {\n157\t\t\t\tt.Errorf(\"attempt %d has no usage, want the spend recorded\", i+1)\n158\t\t\t}\n159\t\t}\n160\t\t// The iterations stand, so an item cannot run unbounded on errors alone.\n161\t\tif halted.IterationCount != DefaultInvocationErrorCap {\n162\t\t\tt.Errorf(\"IterationCount = %d, want each errored attempt counted\", halted.IterationCount)\n163\t\t}\n164\t}\n165\t\n166\t// An intermittent fault must not accumulate across an otherwise healthy run: the\n167\t// counter is a streak, so the invocation that runs clears it.\n168\tfunc TestExecute_SuccessfulInvocationResetsTheErrorStreak(t *testing.T) {\n169\t\tprojectDir := t.TempDir()\n170\t\tstore := internal.NewYAMLStore(filepath.Join(projectDir, \".utopia\"))\n171\t\tconst specID = \"cr-flaky\"\n172\t\n173\t\titem := &domain.WorkItem{ID: \"wi-1\", Order: 1, Status: domain.WorkItemPending, Prompt: \"do the thing\"}\n174\t\tif err := store.SaveWorkItemForSpec(specID, item); err != nil {\n175\t\t\tt.Fatalf(\"SaveWorkItemForSpec() = %v\", err)\n176\t\t}\n177\t\t// Two faults, then an invocation that runs, then two more: five in total, above\n178\t\t// the cap of three, but never three in a row.\n179\t\tfailingClaudeOnPath(t, 2)\n180\t\n181\t\tvar stdout, stderr bytes.Buffer\n182\t\tvar result *Result\n183\t\tvar err error\n184\t\tcaptureStdout(t, func() {\n185\t\t\tresult, err = Execute(context.Background(), specID, store,\n186\t\t\t\t&domain.Config{Verification: domain.VerificationConfig{MaxIterations: 20}}, projectDir, \"\",\n187\t\t\t\tOverrides{Out: ui.NewPrinter(&stdout, &stderr)})\n188\t\t})\n189\t\tif err != nil {\n190\t\t\tt.Fatalf(\"Execute() error = %v\", err)\n191\t\t}\n192\t\tif result.Completed != 1 {\n193\t\t\tt.Fatalf(\"Completed = %d, want the item to survive the intermittent faults (needs human: %v)\", result.Completed, result.NeedsHuman)\n194\t\t}\n195\t\n196\t\tdone := reloadWorkItem(t, store, specID, item.ID)\n197\t\t// The two faults happened and are on the record, so the reset is what carried\n198\t\t// the item through rather than the faults never occurring.\n199\t\tif len(done.ExecutorAttempts) != 3 {\n200\t\t\tt.Fatalf(\"ExecutorAttempts = %d, want the two errored attempts and the one that ran\", len(done.ExecutorAttempts))\n201\t\t}\n202\t\tfor i, want := range []domain.AttemptOutcome{domain.AttemptErrored, domain.AttemptErrored, domain.AttemptPassed} {\n203\t\t\tif got := done.ExecutorAttempts[i].Outcome; got != want {\n204\t\t\t\tt.Errorf(\"attempt %d outcome = %q, want %q\", i+1, got, want)\n205\t\t\t}\n206\t\t}\n207\t\tif done.InvocationErrorCount != 0 {\n208\t\t\tt.Errorf(\"InvocationErrorCount = %d, want the streak cleared by the invocation that ran\", done.InvocationErrorCount)\n209\t\t}\n210\t}\n211\t\n212\t// errNoBinary stands in for whatever the CLI reports when the subprocess never\n213\t// ran. The counter does not read the error, only that there was one.\n214\tvar errNoBinary = errors.New(\"claude prompt failed: exit status 1\")\n215\t\n216\t// failingClaudeOnPath installs a stand-in claude that exits non-zero for the\n217\t// first failures invocations and then answers with a completion token. It goes on\n218\t// PATH for the same reason the arg-recording one does: Execute builds its own\n219\t// *internal.CLI, so only a real spawn produces a real invocation failure.\n220\tfunc failingClaudeOnPath(t *testing.T, failures int) {\n221\t\tt.Helper()\n222\t\n223\t\tdir := t.TempDir()\n224\t\tcountPath := filepath.Join(dir, \"count\")\n225\t\tscript := \"#!/bin/sh\\n\" +\n226\t\t\t\"printf 'x' >> \" + countPath + \"\\n\" +\n227\t\t\t\"if [ $(wc -c < \" + countPath + \") -le \" + strconv.Itoa(failures) + \" ]; then\\n\" +\n228\t\t\t`  echo 'claude: connection reset' >&2` + \"\\n\" +\n229\t\t\t\"  exit 1\\n\" +\n230\t\t\t\"fi\\n\" +\n231\t\t\t`echo '{\"type\":\"system\",\"subtype\":\"init\",\"model\":\"claude-test\"}'` + \"\\n\" +\n232\t\t\t`echo '{\"type\":\"result\",\"subtype\":\"success\",\"result\":\"done <COMPLETE>\"}'` + \"\\n\"\n233\t\tif err := os.WriteFile(filepath.Join(dir, \"claude\"), []byte(script), 0o755); err != nil {\n234\t\t\tt.Fatalf(\"failed to write fake claude: %v\", err)\n235\t\t}\n236\t\tt.Setenv(\"PATH\", dir+string(os.PathListSeparator)+os.Getenv(\"PATH\"))\n237\t}\n238\t\n239\t// reloadWorkItem reads the item back from disk, which is where the counters the\n240\t// caps bound have to survive: the loop persists them every iteration so a resume\n241\t// sees the same bounds.\n242\tfunc reloadWorkItem(t *testing.T, store *internal.YAMLStore, specID, id string) *domain.WorkItem {\n243\t\tt.Helper()\n244\t\n245\t\titems, err := store.ListWorkItemsForSpec(specID)\n246\t\tif err != nil {\n247\t\t\tt.Fatalf(\"ListWorkItemsForSpec() = %v\", err)\n248\t\t}\n249\t\tfor _, it := range items {\n250\t\t\tif it.ID == id {\n251\t\t\t\treturn it\n252\t\t\t}\n253\t\t}\n254\t\tt.Fatalf(\"work item %s not found in %s\", id, specID)\n255\t\treturn nil\n256\t}\n257\t\n258\t// saveEscalationCR persists the change request an escalated attempt rebuilds its\n259\t// context from. Without it the escalated prompt cannot be built and the loop\n260\t// would leave on that error rather than on the invocation faults under test.\n261\tfunc saveEscalationCR(t *testing.T, store *internal.YAMLStore, crID string) {\n262\t\tt.Helper()\n263\t\n264\t\tcr := &domain.ChangeRequest{\n265\t\t\tID:     crID,\n266\t\t\tType:   domain.CRTypeBugfix,\n267\t\t\tTitle:  \"Stop harness failures from spending the escalation budget\",\n268\t\t\tStatus: domain.ChangeRequestInProgress,\n269\t\t}\n270\t\tif err := store.SaveChangeRequest(cr); err != nil {\n271\t\t\tt.Fatalf(\"SaveChangeRequest: %v\", err)\n272\t\t}\n273\t}\n274\t"}]},"parent_tool_use_id":null,"session_id":"5fa8296d-43cc-4cc8-b010-9d1068f6b287","uuid":"0b61be18-71e9-4b85-a74a-89d51b0fba6c","timestamp":"2026-07-31T01:46:44.426Z","tool_use_result":{"type":"text","file":{"filePath":"/Users/leighton.vanrooijen/projects/utopia/internal/ralph/invocation_error_test.go","content":"package ralph\n\nimport (\n\t\"bytes\"\n\t\"context\"\n\t\"errors\"\n\t\"os\"\n\t\"path/filepath\"\n\t\"strconv\"\n\t\"strings\"\n\t\"testing\"\n\n\t\"github.com/leightonvanrooijen/utopia/internal\"\n\t\"github.com/leightonvanrooijen/utopia/internal/domain\"\n\t\"github.com/leightonvanrooijen/utopia/internal/ui\"\n)\n\n// The consecutive-error counter bounds a fault that is happening now, and the\n// halt it produces has to name that fault rather than a comprehension failure:\n// nothing about the change request changes the outcome of a claude that will not\n// start.\nfunc TestChargeInvocationError(t *testing.T) {\n\tcaps := testCaps() // InvocationErrors: 3\n\n\tt.Run(\"errors below the cap keep the item running\", func(t *testing.T) {\n\t\titem := &domain.WorkItem{ID: \"item\"}\n\t\tfor i := 1; i < caps.InvocationErrors; i++ {\n\t\t\tif halt := chargeInvocationError(item, caps, errNoBinary); halt != nil {\n\t\t\t\tt.Fatalf(\"error %d halted the item, want it retried under the cap\", i)\n\t\t\t}\n\t\t\tif item.InvocationErrorCount != i {\n\t\t\t\tt.Errorf(\"InvocationErrorCount = %d, want %d\", item.InvocationErrorCount, i)\n\t\t\t}\n\t\t}\n\t})\n\n\tt.Run(\"the error at the cap halts, naming the invocation failure\", func(t *testing.T) {\n\t\titem := &domain.WorkItem{ID: \"item\", InvocationErrorCount: caps.InvocationErrors - 1}\n\n\t\thalt := chargeInvocationError(item, caps, errNoBinary)\n\n\t\tif halt == nil {\n\t\t\tt.Fatal(\"halt = nil, want the item halted at the cap\")\n\t\t}\n\t\tif halt.Cap != \"escalation.invocation_errors\" || halt.Limit != caps.InvocationErrors {\n\t\t\tt.Errorf(\"halt reports %s = %d, want the invocation-error cap\", halt.Cap, halt.Limit)\n\t\t}\n\t\tmsg := halt.Error()\n\t\tfor _, want := range []string{\"invocation\", \"reached a verdict\", \"claude\"} {\n\t\t\tif !strings.Contains(msg, want) {\n\t\t\t\tt.Errorf(\"halt message %q missing %q, want the invocation failure named\", msg, want)\n\t\t\t}\n\t\t}\n\t\tif strings.Contains(msg, \"comprehension\") {\n\t\t\tt.Errorf(\"halt message %q reads as a comprehension failure\", msg)\n\t\t}\n\t})\n\n\tt.Run(\"an invocation that ran clears the streak\", func(t *testing.T) {\n\t\titem := &domain.WorkItem{ID: \"item\", InvocationErrorCount: 2}\n\n\t\tclearInvocationErrors(item)\n\n\t\tif item.InvocationErrorCount != 0 {\n\t\t\tt.Errorf(\"InvocationErrorCount = %d, want the streak cleared\", item.InvocationErrorCount)\n\t\t}\n\t})\n\n\tt.Run(\"a raised cap allows further errors\", func(t *testing.T) {\n\t\titem := &domain.WorkItem{ID: \"item\", InvocationErrorCount: 3}\n\t\tif halt := chargeInvocationError(item, EscalationCaps{InvocationErrors: 5}, errNoBinary); halt != nil {\n\t\t\tt.Errorf(\"halt = %v, want the error allowed under the raised cap\", halt)\n\t\t}\n\t})\n}\n\n// The refund is of routing budget only: an escalated attempt that produced no\n// verdict gives its charge back, and an unescalated one never had a charge.\nfunc TestRefundEscalatedAttempt(t *testing.T) {\n\titem := &domain.WorkItem{ID: \"item\", ComprehensionCount: 1, OpusExecutionAttempts: 2}\n\n\trefundEscalatedAttempt(item, true)\n\tif item.OpusExecutionAttempts != 1 {\n\t\tt.Errorf(\"OpusExecutionAttempts = %d, want the charge returned\", item.OpusExecutionAttempts)\n\t}\n\n\trefundEscalatedAttempt(item, false)\n\tif item.OpusExecutionAttempts != 1 {\n\t\tt.Errorf(\"OpusExecutionAttempts = %d, want an uncharged attempt left alone\", item.OpusExecutionAttempts)\n\t}\n}\n\n// A claude that fails every time must halt the work item on its own counter,\n// without spending the escalation budget on it. Driven through Execute against a\n// stand-in binary that exits non-zero, because the defect was in how the loop\n// treated the error rather than in any helper: a test that stopped at the helpers\n// would have passed against it.\nfunc TestExecute_InvocationErrorsHaltOnTheirOwnCap(t *testing.T) {\n\tprojectDir := t.TempDir()\n\tstore := internal.NewYAMLStore(filepath.Join(projectDir, \".utopia\"))\n\tconst specID = \"cr-fault\"\n\n\tsaveEscalationCR(t, store, specID)\n\t// Already escalated, so every attempt below is charged against the\n\t// escalated-execution cap of 2 - which two crashed invocations used to exhaust.\n\titem := &domain.WorkItem{ID: \"wi-1\", Order: 1, Status: domain.WorkItemPending,\n\t\tPrompt: \"do the thing\", ComprehensionCount: 1}\n\tif err := store.SaveWorkItemForSpec(specID, item); err != nil {\n\t\tt.Fatalf(\"SaveWorkItemForSpec() = %v\", err)\n\t}\n\t// Every invocation fails: the fault is the binary, not the work.\n\tfailingClaudeOnPath(t, 99)\n\n\tvar stdout, stderr bytes.Buffer\n\tvar result *Result\n\tvar err error\n\tcaptureStdout(t, func() {\n\t\tresult, err = Execute(context.Background(), specID, store,\n\t\t\t&domain.Config{Verification: domain.VerificationConfig{MaxIterations: 20}}, projectDir, \"\",\n\t\t\tOverrides{Out: ui.NewPrinter(&stdout, &stderr)})\n\t})\n\tif err != nil {\n\t\tt.Fatalf(\"Execute() error = %v, want the halted item reported on the result\", err)\n\t}\n\tif len(result.NeedsHuman) != 1 {\n\t\tt.Fatalf(\"NeedsHuman = %v (completed %d), want the item halted for a person\\nstdout: %s\", result.NeedsHuman, result.Completed, stdout.String())\n\t}\n\n\thalted := reloadWorkItem(t, store, specID, item.ID)\n\tif halted.Status != domain.WorkItemNeedsHuman {\n\t\tt.Errorf(\"Status = %q, want %q\", halted.Status, domain.WorkItemNeedsHuman)\n\t}\n\tif halted.InvocationErrorCount != DefaultInvocationErrorCap {\n\t\tt.Errorf(\"InvocationErrorCount = %d, want the default cap of %d\", halted.InvocationErrorCount, DefaultInvocationErrorCap)\n\t}\n\t// The routing budget is untouched: no attempt reached a verdict, so none of it\n\t// was evidence the executor got anything wrong.\n\tif halted.OpusExecutionAttempts != 0 {\n\t\tt.Errorf(\"OpusExecutionAttempts = %d, want every crashed attempt refunded\", halted.OpusExecutionAttempts)\n\t}\n\tif halted.ComprehensionCount != 1 {\n\t\tt.Errorf(\"ComprehensionCount = %d, want it unmoved by invocation errors\", halted.ComprehensionCount)\n\t}\n\tif halted.ScopingEscalationCount != 0 {\n\t\tt.Errorf(\"ScopingEscalationCount = %d, want no escalation on an invocation fault\", halted.ScopingEscalationCount)\n\t}\n\t// The accounting is kept, though: the attempts ran and spent whatever they\n\t// spent, and each is recorded as having reached no verdict.\n\tif len(halted.ExecutorAttempts) != DefaultInvocationErrorCap {\n\t\tt.Fatalf(\"ExecutorAttempts = %d, want one per errored invocation\", len(halted.ExecutorAttempts))\n\t}\n\tfor i, a := range halted.ExecutorAttempts {\n\t\tif a.Outcome != domain.AttemptErrored {\n\t\t\tt.Errorf(\"attempt %d outcome = %q, want %q\", i+1, a.Outcome, domain.AttemptErrored)\n\t\t}\n\t\tif a.Usage == nil {\n\t\t\tt.Errorf(\"attempt %d has no usage, want the spend recorded\", i+1)\n\t\t}\n\t}\n\t// The iterations stand, so an item cannot run unbounded on errors alone.\n\tif halted.IterationCount != DefaultInvocationErrorCap {\n\t\tt.Errorf(\"IterationCount = %d, want each errored attempt counted\", halted.IterationCount)\n\t}\n}\n\n// An intermittent fault must not accumulate across an otherwise healthy run: the\n// counter is a streak, so the invocation that runs clears it.\nfunc TestExecute_SuccessfulInvocationResetsTheErrorStreak(t *testing.T) {\n\tprojectDir := t.TempDir()\n\tstore := internal.NewYAMLStore(filepath.Join(projectDir, \".utopia\"))\n\tconst specID = \"cr-flaky\"\n\n\titem := &domain.WorkItem{ID: \"wi-1\", Order: 1, Status: domain.WorkItemPending, Prompt: \"do the thing\"}\n\tif err := store.SaveWorkItemForSpec(specID, item); err != nil {\n\t\tt.Fatalf(\"SaveWorkItemForSpec() = %v\", err)\n\t}\n\t// Two faults, then an invocation that runs, then two more: five in total, above\n\t// the cap of three, but never three in a row.\n\tfailingClaudeOnPath(t, 2)\n\n\tvar stdout, stderr bytes.Buffer\n\tvar result *Result\n\tvar err error\n\tcaptureStdout(t, func() {\n\t\tresult, err = Execute(context.Background(), specID, store,\n\t\t\t&domain.Config{Verification: domain.VerificationConfig{MaxIterations: 20}}, projectDir, \"\",\n\t\t\tOverrides{Out: ui.NewPrinter(&stdout, &stderr)})\n\t})\n\tif err != nil {\n\t\tt.Fatalf(\"Execute() error = %v\", err)\n\t}\n\tif result.Completed != 1 {\n\t\tt.Fatalf(\"Completed = %d, want the item to survive the intermittent faults (needs human: %v)\", result.Completed, result.NeedsHuman)\n\t}\n\n\tdone := reloadWorkItem(t, store, specID, item.ID)\n\t// The two faults happened and are on the record, so the reset is what carried\n\t// the item through rather than the faults never occurring.\n\tif len(done.ExecutorAttempts) != 3 {\n\t\tt.Fatalf(\"ExecutorAttempts = %d, want the two errored attempts and the one that ran\", len(done.ExecutorAttempts))\n\t}\n\tfor i, want := range []domain.AttemptOutcome{domain.AttemptErrored, domain.AttemptErrored, domain.AttemptPassed} {\n\t\tif got := done.ExecutorAttempts[i].Outcome; got != want {\n\t\t\tt.Errorf(\"attempt %d outcome = %q, want %q\", i+1, got, want)\n\t\t}\n\t}\n\tif done.InvocationErrorCount != 0 {\n\t\tt.Errorf(\"InvocationErrorCount = %d, want the streak cleared by the invocation that ran\", done.InvocationErrorCount)\n\t}\n}\n\n// errNoBinary stands in for whatever the CLI reports when the subprocess never\n// ran. The counter does not read the error, only that there was one.\nvar errNoBinary = errors.New(\"claude prompt failed: exit status 1\")\n\n// failingClaudeOnPath installs a stand-in claude that exits non-zero for the\n// first failures invocations and then answers with a completion token. It goes on\n// PATH for the same reason the arg-recording one does: Execute builds its own\n// *internal.CLI, so only a real spawn produces a real invocation failure.\nfunc failingClaudeOnPath(t *testing.T, failures int) {\n\tt.Helper()\n\n\tdir := t.TempDir()\n\tcountPath := filepath.Join(dir, \"count\")\n\tscript := \"#!/bin/sh\\n\" +\n\t\t\"printf 'x' >> \" + countPath + \"\\n\" +\n\t\t\"if [ $(wc -c < \" + countPath + \") -le \" + strconv.Itoa(failures) + \" ]; then\\n\" +\n\t\t`  echo 'claude: connection reset' >&2` + \"\\n\" +\n\t\t\"  exit 1\\n\" +\n\t\t\"fi\\n\" +\n\t\t`echo '{\"type\":\"system\",\"subtype\":\"init\",\"model\":\"claude-test\"}'` + \"\\n\" +\n\t\t`echo '{\"type\":\"result\",\"subtype\":\"success\",\"result\":\"done <COMPLETE>\"}'` + \"\\n\"\n\tif err := os.WriteFile(filepath.Join(dir, \"claude\"), []byte(script), 0o755); err != nil {\n\t\tt.Fatalf(\"failed to write fake claude: %v\", err)\n\t}\n\tt.Setenv(\"PATH\", dir+string(os.PathListSeparator)+os.Getenv(\"PATH\"))\n}\n\n// reloadWorkItem reads the item back from disk, which is where the counters the\n// caps bound have to survive: the loop persists them every iteration so a resume\n// sees the same bounds.\nfunc reloadWorkItem(t *testing.T, store *internal.YAMLStore, specID, id string) *domain.WorkItem {\n\tt.Helper()\n\n\titems, err := store.ListWorkItemsForSpec(specID)\n\tif err != nil {\n\t\tt.Fatalf(\"ListWorkItemsForSpec() = %v\", err)\n\t}\n\tfor _, it := range items {\n\t\tif it.ID == id {\n\t\t\treturn it\n\t\t}\n\t}\n\tt.Fatalf(\"work item %s not found in %s\", id, specID)\n\treturn nil\n}\n\n// saveEscalationCR persists the change request an escalated attempt rebuilds its\n// context from. Without it the escalated prompt cannot be built and the loop\n// would leave on that error rather than on the invocation faults under test.\nfunc saveEscalationCR(t *testing.T, store *internal.YAMLStore, crID string) {\n\tt.Helper()\n\n\tcr := &domain.ChangeRequest{\n\t\tID:     crID,\n\t\tType:   domain.CRTypeBugfix,\n\t\tTitle:  \"Stop harness failures from spending the escalation budget\",\n\t\tStatus: domain.ChangeRequestInProgress,\n\t}\n\tif err := store.SaveChangeRequest(cr); err != nil {\n\t\tt.Fatalf(\"SaveChangeRequest: %v\", err)\n\t}\n}\n","numLines":274,"startLine":1,"totalLines":274}}}
