    --- iteration 1 ---
    Done.

    **Change**
    - `internal/ralph/failure_output.go` (new): `printFailureBlock(source, content)` - frames content in `--- Failure Output: <source> ---` / `--- End Failure Output: <source> ---`, verbatim content, nothing for empty.
    - `engine.go:logResolution` - failing handle's captured output renders through the helper; non-failing output stays indented chatter (keeps existing ledger tests green, keeps block as failure signal).
    - `ralph.go` verification branch - calls helper with same string assigned to `item.LastFailureOutput`.
    - `ralph.go` after-phase - removed its own print (it was double-printing: ledger + call site). After-workitem needed no call-site print; ledger owns it, comment pins that.
    - Order: ledger prints during the dispatch that joins, so before prompt injection on both validator paths.
    - Validator ID untouched - comes from `AggregateResults`, helper prepends nothing.

    **Tests** `internal/ralph/failure_output_test.go`: exact-bytes frame, empty-content no-frame, verification path, after-workitem join prints one block with validator ID (regression for the silently-dropped path), after-phase gating join same, passing handle stays indented.

    `go test ./...` 1342 pass, `go vet` clean, `gofmt` clean. ADR-008 records the decision.

    Two user-visible deltas, both intended by the unification: delimiter text changed for the two paths that had blocks, and after-phase's block now prints just before its "validators failed, will retry" status line instead of just after. No change to commands run, exit codes, or AI content.

