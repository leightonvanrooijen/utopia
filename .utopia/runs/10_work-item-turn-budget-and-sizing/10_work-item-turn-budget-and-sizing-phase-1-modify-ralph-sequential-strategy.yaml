    --- iteration 1 ---
    Done.

    - `FeatureSplits map[string][]domain.Feature` - sizer's per-feature slices, keyed by feature ID. `nil` = current behaviour.
    - `expandFeatures()` walks features in spec order, emits a split feature's units adjacently in sizer order; unit ID `<featureID>-<n>` (1-based), owned by chunker so IDs stay unique + traceable. Hints inherit from parent feature when slice has none.
    - `generateWorkItems()` assigns `Order` from unit position, so contiguous/sequential across splits. Replaces the two duplicate loops in `Chunk`/`ChunkPhase`, so ordering guarantee lives once.
    - Bugfix `REFERENCE` lookup keys off `sourceFeature`, not unit ID, so split units still resolve.
    - Callers (`cli/execute.go`, `ralph/scoping.go`) pass `nil` until the sizer work item wires it.
    - 5 new tests: split ordering via `Chunk` and `ChunkPhase`, unsplit-unchanged (absent + single slice), expand order/source-feature, hint inheritance. Full suite: 1207 passed.

