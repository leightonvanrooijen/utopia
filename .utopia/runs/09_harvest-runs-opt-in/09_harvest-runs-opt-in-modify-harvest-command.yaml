transcript: |
    --- iteration 1 ---
    Done. Changes:

    **`internal/cli/harvest.go`** - `--runs` bool flag (default false), threaded as `harvest.Options.IncludeRuns`; without it the "nothing to harvest" framing keys on conversations only; help text updated.

    **`internal/harvest/harvest.go`**
    - `Options.IncludeRuns`; `ListUnprocessedExecutionRuns()` still called always (filesystem walk, no tokens) so `Result.UnprocessedRuns` and the hint stay accurate.
    - `formatRunsExcludedHint` prints one line (`1 unprocessed execution run not scanned - pass --runs to include them.`) before the early return, so it shows whether or not a session starts; empty when runs opted in or count is 0.
    - Session-start test: conversations alone without `--runs`, either source with it.
    - Prompt template: run-marking procedure and the two marked-sources phrases are now injected. `buildMarkProcessedInstructions` emits the run half only when runs were a source, else states explicitly runs were not scanned and must be left alone. `buildHarvestSourcesSummary` gets `nil` runs, so no Execution Runs section, no transcripts.

    **Tests** - 4 new (hint table, marking instructions both ways, no-transcript summary, `Run` skips session + leaves run unprocessed), plus prompt-composition helper updated. `go test ./internal/...`: 1247 passed.

    Left out per `.utopia/notes/harvest-runs-docs-and-truncation.md`, which scopes them out of this CR: README docs for `--runs`/`.utopia/runs/`, and transcript truncation.

