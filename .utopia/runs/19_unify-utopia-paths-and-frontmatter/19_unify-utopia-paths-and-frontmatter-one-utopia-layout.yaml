transcript: |-
  --- iteration 1 ---
  I'll start by exploring the codebase structure and the existing helper.Most matches are doc strings. Need the actual path builds.Now let me look at store.go where the subdirectory defaults live.Import graph is clear: layout can be a leaf package. Let me enumerate every path-build site.Now the store, which is rooted at the `.utopia` directory:All store.go remnants are doc comments. Now the remaining packages:Now shape.go and standards.go, which discard the project dir:Build and vet clean. Running tests:All 1466 tests pass, no test file touched. Now verifying the acceptance criteria on remaining `.utopia` literals:Zero path-construction sites remain outside the owning package. Committing:Done. `internal/layout` owns the layout; 22 files rewired.

  **What landed**

  - New `internal/layout` package: `DirName` constant, subdirectory name constants, and accessors `Root`, `Specs`, `ADRs`, `Concepts`, `Domain`, `Drafts`, `DraftSpecs`, `DraftDomain`, `Notes`, `Conversations`, `ChangeRequests`, `WorkItems`, `Runs`, `Validators`, `Standards`, plus `StandardRelPath` (keeps the `filepath.ToSlash`).
  - `internal/discover/discover.go`'s `utopiaDirOf` deleted, its three callers now call `layout.Root`.
  - The two traversal skip checks in `discover/collect.go` compare against `layout.DirName`.

  **Verified**

  - `go build ./...` and `go vet ./...` clean, `gofmt` clean.
  - `go test ./...` - 1466 pass, no test file touched.
  - Zero `.utopia` path-construction sites outside `internal/layout`.

  **Two things to know at review**

  The store is rooted at the `.utopia` directory rather than a project directory, and `NewYAMLStore` is called with a bare `t.TempDir()` in tests, so it can't use the project-dir accessors - deriving a project dir back out of `baseDir` would resolve elsewhere. It composes with the exported name constants instead. `CleanupAfterMerge` keeps its `utopiaDir` parameter for the same reason: `execute_commit_test.go` calls it directly.

  I removed the `.utopia` literal everywhere it *builds* a path, but left it in doc comments and in Claude prompt / cobra help prose - about a hundred sites that describe the layout rather than construct it. Reading the criterion literally would have meant `Sprintf` interpolation through large prompt templates for no behavioural gain. Rationale and alternatives are in the commit body.

