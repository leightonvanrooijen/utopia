  --- iteration 2 ---
  Done.

  **What was actually wrong**: not the tests. Commit `99d7f3d` already landed the coverage. Validation never ran - two work items carried `status: in_progress`, so `spec-intent` could not identify which item's criteria to judge against.

  **Fixed**:
  - `06_..-phase-4-modify-step-timing-logs.yaml:16` `in_progress` → `completed`. Its work landed in `5c86651`; status was never transitioned. Store now has one running item.
  - `internal/ralph/execute_model_test.go`: recorder returned one blob of every spawn's argv; `Contains("--model sonnet")` could match any role. Now returns one entry per spawn, test asserts exactly one, then asserts on that invocation. Anchors the assertion to the default-executor attempt, which is criterion 4.

  **Criteria coverage** (all four, in the committed tests):

  | criterion | assertion |
  |---|---|
  | `models.execute` + no flag → `--model` set | `--model sonnet` on argv |
  | no models section → CLI default | wrapper-level `no model omits the flag` in `TestCLI_ModelAndEffortReachTheBinary`; ralph-level table records the actual `--model sonnet` fallback |
  | `--model` overrides `models.execute` | `--model fable`, `sonnet` absent |
  | default executor specifically | full `Execute()` run, fresh item, first attempt |

  Criterion 2 is asserted at the wrapper, not the loop. The loop cannot omit `--model` - task 1's shipped criterion says every default-executor attempt carries it explicitly, and `backward-compatibility` resolves a missing models section to `sonnet`. Both layers' contracts are pinned rather than one assumed. Rationale in commit body.

  **Defect re-verified**: reinstating the conditional `WithModel` in `ralph.go` fails 3 of 4 cases.

  `./scripts/verify.sh` passes. Left alone: `16_..-resolve-default-executor-model-from-config` at `needs_human` - fix shipped in `5b5a29c`, status looks stale, but terminal state is a human call and it does not block item identification.

