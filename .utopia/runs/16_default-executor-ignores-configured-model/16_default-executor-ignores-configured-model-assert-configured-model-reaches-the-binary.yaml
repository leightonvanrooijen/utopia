  ## SCOPING ESCALATION

  work item 16_default-executor-ignores-configured-model-assert-configured-model-reaches-the-binary routed to scoping escalation after a suspected spec defect

  - spec-intent: The diff implements the substance of the task correctly on the argv of a real default-executor spawn, but one acceptance criterion is unsatisfiable as written: it demands no --model flag for a project with no models section, while the feature it cites and the sibling task in the same change request both require the resolution chain to terminate at sonnet and be passed explicitly. The fault is in w (corrected intent: Assert on the argv of a real default-executor spawn that the resolved model always reaches the claude binary: models.execute when configured, models.default when execute is absent, the executor default sonnet when there is no models section at all, and the --model flag when it overrides. Assert the wrapper's omit-the-flag-when-nothing-is-resolved contract at the internal.CLI layer, which is the only place no model is resolved.)

  Change request rewritten as 16_default-executor-ignores-configured-model-rewrite-1; execution resumes against it.

  --- iteration 3 ---
  Coverage already at right layers from prior commits; verified both and fixed misleading case name.

  - `internal/ralph/execute_model_test.go`: 4 cases on real default-executor spawn argv - `models.execute`, `models.default` fallback, `sonnet` with no models section, `--model` override. All assert flag present.
  - `internal/claude_test.go:353` "no model omits the flag": wrapper layer, empty model parameter, no `--model` on argv.
  - No default-executor test asserts absent flag. Renamed case `"models.execute reaches the binary with no --model flag"` to `"...when no --model override is given"` so it cannot read as an argv-absence claim.

  Full suite: 1410 passed, 14 packages.

