transcript: |-
  --- iteration 1 ---
  I'll start by reading the relevant code and tests.Now write the ralph-level test.Test proven to catch the defect. Commit.Gap closed. Two layers pinned:

  - `internal/ralph/execute_model_test.go` - full default-executor attempt through `Execute`, stand-in `claude` on PATH records argv. 4 cases: `models.execute`, `models.default` fallback, no models section, `--model` override. Reinstating the old conditional `WithModel` fails 3 of 4.
  - `internal/claude_test.go` - `no model omits the flag` subtest: wrapper passes no `--model` when caller resolved none.

  Note on criterion 2: "no models section -> no `--model` flag" holds at the CLI wrapper, not at the ralph loop. Post-fix, a project with no models section gets `--model sonnet` explicitly by design - making ralph omit it would restore the ambient-default nondeterminism CR 16 fixed. Both contracts asserted where true; rationale in commit body for PR review.

  Full suite: 1410 passed.

