 or timeout) - take the graceful shutdown path.\n499\t\t\tif outcome, limitErr := handleClaudeLimits(ctx, out, claudeResult, auth, projectDir); limitErr != nil {\n500\t\t\t\t_ = store.SaveWorkItemForSpec(specID, item)\n501\t\t\t\treturn nil, limitErr\n502\t\t\t} else if outcome == limitWaited {\n503\t\t\t\tout.Progressf(\"  Iteration %d: usage limit handled, re-running this iteration (claude %s)\\n\", item.IterationCount, ui.Duration(claudeElapsed))\n504\t\t\t\titem.IterationCount--\n505\t\t\t\t// The attempt produced no work, so it is refunded: the cap bounds spend on\n506\t\t\t\t// the escalated executor, and nothing was spent here. The routing record is\n507\t\t\t\t// refunded with it, so the attempt list stays a list of attempts that ran.\n508\t\t\t\tif charged {\n509\t\t\t\t\titem.OpusExecutionAttempts--"}]},"parent_tool_use_id":null,"session_id":"5fbf67db-6f9b-4b30-b9b2-f81f0e107c4a","uuid":"9a7d9b80-0b18-49dc-bb2d-23b4924bb3e0","timestamp":"2026-07-30T11:27:27.943Z","tool_use_result":{"type":"text","file":{"filePath":"/Users/leighton.vanrooijen/projects/utopia/internal/ralph/ralph.go","content":"\n\t\t// Which executor this attempt runs on is derived from the item's persisted\n\t\t// escalation state rather than from an in-memory flag, so a resumed item\n\t\t// that already escalated does not reset to the default executor. The CLI is\n\t\t// cloned rather than mutated because it is shared with every other work\n\t\t// item in this run, and escalation is per item.\n\t\tattemptModel := executorModelFor(item, defaultExecutorModel, escalatedExecutorModel)\n\t\t// The escalated executor's effort is its own role's level, not the default\n\t\t// executor's raised: a mechanical retry stays on the default executor and so\n\t\t// keeps that role's effort unchanged.\n\t\tattemptEffort := executorEffortFor(item, efforts)\n\n\t\t// An escalated attempt is booked against its cap before it runs, so the\n\t\t// halt costs nothing when the cap is already spent. It is refunded