  {"type":"user","message":{"role":"user","content":[{"tool_use_id":"toolu_01R4HXa3aG1bHP8njhGxBftc","type":"tool_result","content":"440\t\n441\t\t\t// Which executor this attempt runs on is derived from the item's persisted\n442\t\t\t// escalation state rather than from an in-memory flag, so a resumed item\n443\t\t\t// that already escalated does not reset to the default executor. The CLI is\n444\t\t\t// cloned rather than mutated because it is shared with every other work\n445\t\t\t// item in this run, and escalation is per item.\n446\t\t\tattemptModel := executorModelFor(item, defaultExecutorModel, escalatedExecutorModel)\n447\t\t\t// The escalated executor's effort is its own role's level, not the default\n448\t\t\t// executor's raised: a mechanical retry stays on the default executor and so\n449\t\t\t// keeps that role's effort unchanged.\n450\t\t\tattemptEffort := executorEffortFor(item, efforts)\n451\t\n452\t\t\t// An escalated attempt is booked against its cap before it runs, so the\n453\t\t\t// halt costs nothing when the cap is already spent. It is refunded below\n454\t\t\t// if the attempt never actually happened.\n455\t\t\tcharged, capErr := chargeEscalatedAttempt(item, caps)\n456\t\t\tif capErr != nil {\n457\t\t\t\titem.IterationCount--\n458\t\t\t\treturn nil, haltNeedsHuman(store, specID, crID, item, rec, capErr)\n459\t\t\t}\n460\t\n461\t\t\t// Book the attempt onto the item's routing record alongside the cap charge\n462\t\t\t// above, and for the same reason: both are refunded together if the attempt\n463\t\t\t// never actually runs. Recording the model and effort here rather than\n464\t\t\t// reconstructing them later is what makes the record evidence - in particular\n465\t\t\t// the evidence that the default executor's effort was never raised.\n466\t\t\trecordExecutorAttempt(item, attemptModel, attemptEffort)\n467\t\n468\t\t\t// Every execution attempt runs under the turn budget, escalated or not: the\n469\t\t\t// budget bounds one iteration's spend