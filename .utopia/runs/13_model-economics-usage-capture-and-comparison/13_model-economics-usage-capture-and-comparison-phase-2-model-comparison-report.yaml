transcript: |
    --- iteration 1 ---
    Done. Committed `1cd1ce2`.

    **New files**
    - `internal/analysis/economics.go` - `ModelComparison` + `Escalations` aggregations over `[]*domain.ExecutionRun`, plus `ObservationalCaveat`/`UnavailableUsageNote`
    - `internal/cli/report.go` - `utopia report models [--by spec|cr_type]`, `utopia report escalations`
    - `internal/cli/ui/table.go` - aligned column renderer
    - tests for all three (`go test ./...` 1313 pass)

    **Decisions worth knowing**
    - Row key is model + effort; effort absent becomes `cli-default` (its own row, not blank).
    - Work-item completion is credited to the *concluding* attempt (the one that passed, else the last one), so an escalated item's completion goes to the escalated model, not the model that failed first. Attempts still count on every pair that ran.
    - Escalation before/after split is by executor **role**, not model - default and escalated executors can be configured to the same model.
    - Marginal completion rate = share of escalated CRs that completed (every escalated CR was incomplete when it escalated); never-escalated CRs print as a separate baseline line, labelled as context, not a control.
    - Records with no usage list are counted and excluded, `-` not `0`; token totals over zero readable attempts also print `-`.
    - Costs render as labelled parts (`$0.5100 charged`, `$6.4000 list-est`), joined by ` + `, never added.
    - `--by` rejects anything but `spec`/`cr_type`; empty means ungrouped.

    Also added `report` to root help's Other Commands list.

