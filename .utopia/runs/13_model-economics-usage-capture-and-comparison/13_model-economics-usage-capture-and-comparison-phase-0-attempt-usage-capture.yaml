    - `internal/claude.go`: `WithUsageCapture`, format flags in `outputFormatArgs`, `PromptResult.Usage`, `GetUsage()` nil-safe. Stdout still carries assistant prose (raw output on error paths, so rate-limit/turn-exhaustion detection unchanged).
    - `internal/ralph`: execution loop and after-phase fix invocations capture usage; `recordAttemptUsage` books it onto `ExecutorAttempt.Usage`, unavailable-with-reason when unparseable, measured wall clock as fallback.
