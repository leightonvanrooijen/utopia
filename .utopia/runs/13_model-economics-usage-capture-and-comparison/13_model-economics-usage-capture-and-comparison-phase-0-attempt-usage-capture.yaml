    Three fixes against validator findings:

    1. **`--verbose` contract** (`internal/claude.go`): flag now emitted in `outputFormatArgs` alongside `--output-format stream-json --include-partial-messages`, where format chosen. Note: `streamingPrompt` already appended `--verbose`, so real argv was arguably legal - but contract now lives with format selection per hint, `streamingPrompt` guards against duplicate via `slices.Contains`.
    2. **Faithful test doubles** (`claude_usage_test.go`, `claude_test.go`): `scriptedClaude` and `argRecordingClaude` now run `claudeFlagContract` - exit 1 with real binary's exact error (`When using --print, --output-format=stream-json requires --verbose`) when stream-json lacks `--verbose`. Verbose arg-assertion test now requires `--verbose` explicitly. Mutation-verified: stripping flag from both code paths fails `TestCLI_Prompt_VerboseStreamsTextAndCapturesUsage` and `TestCLI_UsageCapture_RequestsStructuredOutput`.
    3. **Scoper capture** (`internal/ralph/scoping.go:211`): rewrite invocation now carries `.WithUsageCapture(true)` - scoper is loop invocation like executor attempt and after-phase fix; validators and discovery stay on prose.

    Full suite: 1275 tests pass, `gofmt`/`go vet` clean.

