    Done. What landed:

    - `internal/domain/usage.go`: `AttemptUsage` (available flag, resolved model, effort, 4 token counts, turns, `duration_ms`, cost) + `CostBasis` (`charged` / `list-price-estimate` / `unknown`) and `CostBasisForAuth`.
