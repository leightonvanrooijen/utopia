    Committed `019d158`.

    Finding: implementation already complete in HEAD `00d275f` - every acceptance criterion verified in code:

    - Usage list one entry per iteration: `UsageEntriesFor` projects `ExecutorAttempts` onto `ExecutionRun.Usage` (`internal/domain/usage.go:169`)
    - Entry carries iteration, resolved model, effort, outcome, failure class (`UsageEntry`, reuses `validators.FailureClass` vocab)
    - Totals derivable without transcript: `TotalUsage`, `TotalRunUsage`, `UsageTotals`
    - Shared yaml formatter: `SaveExecutionRun` calls `writeFormattedYAML` (`internal/store.go:816`)
    - Same commit as work item: `writeRunTranscript` at `internal/ralph/ralph.go:679` runs before `gitCommitWorkItem` at `:680`, which stages `-A`
    - Abort/needs_human persist usage: `haltNeedsHuman` (`escalation.go:384`) and `recordAbort` both call `writeRunTranscript`
    - Non-blocking: write failure only warns (`telemetry.go:273`)
    - Missing usage list reads as unknown: `Usage` is `omitempty`, `UsageTotals()` returns `RecordsWithoutUsage: 1` not zero

    Real blocker was run state, exactly as validator said: work item 02 stale at `status: in_progress` alongside item 13, so spec-intent could not bind the diff to one criteria set. Item 02's constraint strings exist nowhere in code - work never landed - so reset to `pending` for clean re-execution.

