transcript: |
    --- iteration 1 ---
    Done. What landed:

    - `internal/domain/workitem.go`: `ExecutorAttempt` gains `Outcome` (`passed`/`failed`/`incomplete`/`errored`) + `FailureClass` (validators' vocabulary, reported class, pre-reclassification).
    - `internal/domain/usage.go`: `AttemptOutcome`, `UsageEntry` (flat row - iteration, role, outcome, failure class, inlined `AttemptUsage`), `UsageEntriesFor`, `UsageTotals` + `TotalUsage`/`ExecutionRun.UsageTotals`/`TotalRunUsage`. Three cost columns kept apart per ADR-007; unavailable attempts counted, never summed as zero.
    - `internal/domain/documentation.go`: `ExecutionRun.Usage []UsageEntry`; `CostNotCapturedNote` → `CostApproximationNote` (old text claimed cost unobservable, now false next to captured usage).
    - `internal/ralph`: `recordAttemptOutcome` booked at each path out of an iteration (turn cap, invocation error, no completion token, verification fail = mechanical, gate fail = reported class, pass); `writeRunTranscript` projects `Usage` from persisted attempts, so halt/abort paths keep spend already made. Warn-on-failure unchanged. `reportedFailureClass` extracted so gate classification has one definition.
    - `internal/store.go`: `SaveExecutionRun` writes through `FormatYAML`, falling back to unformatted rather than losing a record.

    Tests: 1290 pass, `gofmt`/`go vet`/staticcheck clean. Mutation-verified - dropping the usage projection and reverting the formatter both fail the new tests. Legacy records without `usage:` load and read as unknown spend.

