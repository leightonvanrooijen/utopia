    --- iteration 1 ---
    Done. Diagnostics through `log/slog`, results untouched.

    What landed:
    - `internal/ui/diagnostics.go`: `TextHandler` (human form: `⚠`/`✗` glyphs, bare message for info/debug, `key=value` trailer for structured records), `DefaultLevel = info`, and a context marker distinguishing pre-rendered lines from structured records.
    - `internal/ui/ui.go`: `Printer` holds an `*slog.Logger` over `err`. `Progressf` = info, `Warnf` = warn, plus new `Debugf`/`Errorf`; new attribute methods `Debug/Info/Warn/Error(msg, ...slog.Attr)`; `WithAttrs`, `WithHandler`, `Logger`. `Printf`/`Successf`/`Banner`/`Rule`/`Summary` still write direct to stdout.
    - `internal/ralph/ralph.go`: `cr_id` attached once at `Execute` entry (before printer reaches CLI/engine/loop), `work_item_id` per item; one debug diagnostic at item entry.

    Compatibility: formatted messages are treated as whole lines - no newline or attr trailer appended - so all ~172 call sites, including the partial-line stderr streaming at `internal/claude.go:374`, stay byte-identical. Printer-level attrs (cr_id) are deliberately not rendered for those lines.

    Tests: `internal/ui/diagnostics_test.go` asserts by attribute via a recording handler (typed `int64` attr, inherited run context, severity per method, results produce zero records, verbatim rendering, level filtering); `internal/ralph/execute_diagnostics_test.go` runs `Execute` with a JSON handler and asserts `cr_id`/`work_item_id` as record fields.

