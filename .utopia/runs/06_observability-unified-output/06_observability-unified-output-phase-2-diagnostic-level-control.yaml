transcript: |
    --- iteration 3 ---
    Done. What changed from the failed attempt:

    **Progress** - phase lines (`StartPhase`/`EndPhase`) now gate at info, not just `Verbosef` at debug. Also folded the three hand-written `out.Printf(" done (...)")` early-return tails in `discover`/`domain` into `prog.EndPhase`, so a completion can't outlive the suppressed line it belongs to.

    **Claude streaming** - `WithVerbose(bool)` replaced by `WithStreamLevel(slog.Level)`. The call site declares a *severity*, not a gate; `streamsDetail()` asks `ui.Enabled(c.streamLevel)`. So:

    | run | executor transcript (info) | validator/sizer/discover transcript (debug) |
    |---|---|---|
    | `--log-level warn`/`error` | silent | silent |
    | default (info) | streams | silent |
    | `--log-level debug` / `--verbose` | streams | streams |

    That keeps `execution-ralph`'s `streaming-output` criteria intact (`utopia execute` still streams at the default level) while giving the level real authority in both directions — the pure-global variant the last attempt built would have silenced `utopia execute` at info, breaking that spec.

    **`--verbose` equivalence in substance** - `discover` no longer threads its flag anywhere. `applyVerbose` raises the level; nothing else reads the bool. `SpecsOptions.Verbose`, `DomainOptions.Verbose` and `SizerOptions.Verbose` are gone, along with `WithVerbose` on `validators.NewRunner`. Discover's refinement/disqualification chatter moved to `out.Debugf`.

    **Tests** - phase lines across all four levels, `streamsDetail` across the stream-level × active-level matrix, `-v` shorthand + help text naming `--log-level debug` on both commands, and the two spellings landing on the same level.

    `./scripts/verify.sh` passes.

    One thing to flag: running the suite wrote usage backfill into 31 `.utopia/runs/**` files and created `.utopia/change-requests/14_usage-provenance.yaml`. That's a test writing into the real project dir, unrelated to this work item — I left it uncommitted rather than reverting it, since it may be wanted.

